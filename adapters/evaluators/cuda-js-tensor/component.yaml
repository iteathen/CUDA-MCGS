    "status": "candidate",
    "product_area": "adapters",
    "path": "adapters/evaluators/cuda-js-tensor",
    "purpose": "Bind an injected public CUDA-JS-Tensor TensorDeviceProgram to CUDA-MCGS evaluator request/batch/scatter semantics without taking over Tensor mathematics or lower CUDA ownership.",
    "roles": ["adapter", "evaluator-integration"],
    "governing_authority": [
      "docs/specs/SPEC-0009-evaluator-contract.md",
      "docs/specs/SPEC-0011-finite-search-resources.md",
      "docs/specs/SPEC-0012-device-owned-search-progress.md",
      "docs/specs/SPEC-0015-native-boundary-and-js-only-implementation.md",
      "https://github.com/iteathen/CUDA-MCGS/issues/124"
    ],
    "design": {
      "owned_invariant": "Every admitted evaluator request maps to at most one current Tensor item-slot incarnation; only matching current item results can become ready/scattered, and all capacity/cancellation/retry/cleanup dispositions are finite and explicit.",
      "intended_equivalence_class": [
        "public CUDA-JS-Tensor TensorDeviceProgram capabilities with item-parallel callable semantics",
        "product-neutral scalar, vector or multi-output Tensor evaluator payloads",
        "full or partial finite batches"
      ],
      "excluded_cases": [
        "Tensor mathematics or TensorProgram/TensorPlan interpretation",
        "model/checkpoint/head/product semantics",
        "native CUDA/provider mechanisms",
        "host-driven active evaluator progression"
      ],
      "authoritative_state_owner": "CUDA-MCGS owns evaluator request/batch/slot/readiness state; the injected TensorDeviceProgram owns callable, item-axis and workspace facts",
      "public_ports": ["adapters/evaluators/cuda-js-tensor/index.mjs"],
      "injected_dependencies": ["public cuda-js-tensor TensorDeviceProgram capability"],
      "adapter_boundaries": [
        "CUDA-JS-Tensor owns public Tensor callable/library identity",
        "CUDA-MCGS SPEC-0009 owns evaluator lifecycle",
        "CUDA-JS owns Device-JS library linking and native execution"
      ],
      "solid_responsibilities": ["admit public Tensor callable shape", "plan finite evaluator item capacity", "preserve stale-safe request/item identity", "map portable lifecycle outcomes"],
      "cupid_qualities": ["composable", "predictable", "domain-based", "fail-closed"],
      "second_instance": "A materially different downstream evaluator can inject another conforming TensorDeviceProgram without changing connector vocabulary.",
      "first_consumer_deletion": "Removing every Tensor evaluator removes this optional adapter while evaluator-free/non-Tensor CUDA-MCGS profiles remain complete.",
      "essential_complexity": ["item capacity", "slot generations", "full/partial batch occupancy", "stale rejection", "cancellation/retry/cleanup"],
      "accidental_complexity_rejected": ["model semantics", "second Tensor compiler", "private/deep imports", "native source", "host search scheduler"],
      "complexity_moved_elsewhere": ["Tensor math/callable ABI/workspace remain CUDA-JS-Tensor", "native linking/execution remains CUDA-JS"],
      "simplest_sufficient_total_system": "Validate one public TensorDeviceProgram, expose its opaque public DeviceJsImport and maintain only the finite evaluator request/batch/scatter state needed by CUDA-MCGS."
    },
    "public_contracts": ["cuda-mcgs.tensor-evaluator-connector/0.1.0", "cuda-mcgs.tensor-evaluator-reference/0.1.0"],
    "owns": ["Tensor evaluator connector admission", "request/item slot generation reference semantics", "batch occupancy/scatter/cancellation/retry reference semantics"],
    "persistent_state": [],
    "generated_artifacts": ["immutable connector descriptor", "portable conformance evidence"],
    "testing": {
      "test_owner": "conformance/cuda-js-tensor-evaluator",
      "authoritative_oracles": ["accepted SPEC-0009 evaluator semantics", "public CUDA-JS-Tensor TensorDeviceProgram contract"],
      "coverage_map_location": ["conformance/cuda-js-tensor-evaluator/README.md"],
      "focused_fast_capsules_and_commands": ["node scripts/run-cuda-js-tensor-evaluator.mjs"],
      "owner_contract_capsules_and_commands": ["node scripts/run-evaluator-reference.mjs", "node scripts/run-search-ir-composer-reference.mjs"],
      "integration_smoke_dependencies": ["repository source-boundary policy", "documentation/governance verification"],
      "deep_forensic_and_release_triggers": ["TensorDeviceProgram public ABI change", "evaluator request/batch semantics change"],
      "expected_discovery_and_skip_policy": ["portable connector capsule has zero native prerequisites and zero conditional skips"],
      "evidence_key_dimensions": ["connector source identity", "Tensor callable contract/item capacity/workspace identity"],
      "test_invalidation_inputs": ["SPEC-0009", "TensorDeviceProgram public contract", "connector source"],
      "shared_setup_and_mutable_state_isolation": ["each case creates a fresh connector/reference state"],
      "failure_cluster_and_repair_owner": "integration.cuda-js-tensor-evaluator for connector defects; CUDA-JS-Tensor for generic callable defects; CUDA-JS for lower native defects",
      "test_intent_consolidation_and_debt_policy": ["new lifecycle falsifiers join the owner-local connector capsule"],
      "runtime_output_and_resource_budgets": ["bounded CUDA-free Node.js portable qualification; no native/performance claim"]
    },
    "lifecycle_and_cleanup": {
      "startup_and_acquisition": ["validate public TensorDeviceProgram and exact finite item/request capacity before mutation"],
      "steady_state_ownership": ["slot generations and request/item/batch readiness only"],
      "cancellation_and_failure": ["queued cancellation frees the slot; failed in-flight batches can return to queued retry only for the exact current incarnation"],
      "teardown_and_resource_release": ["close succeeds only after every slot is free; otherwise returns retained active state"],
      "generated_cache_package_test_and_diagnostic_disposition": ["no persistent connector cache; portable evidence is not native evidence"],
      "persistence_migration_backup_and_recovery_retention": ["not applicable"],
      "archive_deprecation_and_supersession": ["public Tensor contract changes require explicit compatibility reassessment"],
      "cleanup_verification": ["capacity/stale/cancel/retry/scatter/close portable falsifiers"]
    },
    "allowed_dependencies": ["injected public cuda-js-tensor capability values only"],
    "forbidden_dependencies": ["cuda-js-tensor private/deep source", "CUDA-JS private/deep source", "native addons/FFI/CUDA/PTX", "product semantics", "Python"],
    "known_consumers": ["conformance/cuda-js-tensor-evaluator", "future optional evaluator profiles"],
