name: Implementation
description: Implement an accepted UMCGS specification through selective authority reading, engineering judgment, token backpressure, focus branches, testing, cleanup, and integration
title: "[Implementation]: "
labels: ["implementation"]
body:
  - type: input
    id: specification
    attributes:
      label: Accepted specification
      placeholder: docs/specs/...
    validations:
      required: true
  - type: textarea
    id: document-reading
    attributes:
      label: Specification and agent-file applicability
      description: State the task signature, mandatory kernel, root-to-target AGENTS.md chains, registry/index/manifest/search discovery, governing documents with status/scope/exact revision, triggered specialist doctrine, material producer/consumer/generated/lifecycle/test/cleanup adjacency, normative references/semantic closure, material not-applicable reasons, missing/conflicting authority, rerouting triggers, final authority refresh, and whether a durable document-reading record is required.
    validations:
      required: true
  - type: textarea
    id: engineering-contract
    attributes:
      label: Engineering contract and specification alignment
      description: State required outcome/consumers, governing authority/clauses, material obligations/derived requirements, semantics/units/ranges/identity/versions, finite resources/deadlines/accuracy/quality bounds, lifecycle/failure/recovery/cleanup, compatibility/migration, non-goals, completion evidence, and any authority/oracle problem. Map obligations to owners, mechanisms, and tests.
    validations:
      required: true
  - type: textarea
    id: engineering-judgment
    attributes:
      label: Engineering judgment, value ordering, candidate paths, and priority
      description: Identify gates, objectives, supporting qualities, costs, contextual value order, credible paths, gate results, false-tradeoff separation, decisive evidence, reversibility, total lifecycle cost, selected path, alternatives rejected, tradeoffs, confidence/revisit triggers, priority P0–P4, and whether a durable decision record is required.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Coherent ownership and organization boundary
      description: Identify product area, component, manifest/registry entry, public surface, dependencies, responsibilities/non-responsibilities, lifecycle/test owners, canonical capsules, and disposition.
    validations:
      required: true
  - type: textarea
    id: assessment
    attributes:
      label: Assessment and strongest adversarial challenge
      description: Link the assessment/plan or summarize disposition, strongest overengineering/underengineering objections, counterexample, revision, falsifier, testing risks, and cleanup implications.
    validations:
      required: true
  - type: textarea
    id: focus-branch
    attributes:
      label: Parent task and focus-branch contract
      description: State whether focus branches are triggered. For large work identify parent/version, integration owner, global invariants/value order, branch ID/owner, full-attention sizing, exact inputs, context, scope/write surface, dependencies, output/consumers, acceptance/falsifier, testing, invalidation, cleanup, and integration.
    validations:
      required: true
  - type: textarea
    id: token-backpressure
    attributes:
      label: Universal token backpressure and minimum practice floor
      description: State task class, implicit or explicit token posture, minimum practice floor, smallest coherent scope, decisive verification, reserve, pressure triggers, reduction-ladder actions, optional breadth/polish to defer, unchanged retry/read rules, repair-cycle replan rule, extend/narrow/split/handoff conditions, claim changes if evidence is reduced, checkpoints, and token debt. Routine work may state that no durable budget record is required.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing and repair-loop strategy
      description: Identify authoritative oracles, coverage, test intents, owning capsules, evidence keys/invalidation, tiers, expected discovery/skips, shared setup/isolation, failure clustering/root-cause repair, no-repeat rules, consolidation, provisional-test cleanup, and test debt.
    validations:
      required: true
  - type: textarea
    id: plan-node
    attributes:
      label: Plan version, node, readiness, and execution contract
      description: State plan/decision/branch/node versions, owner, dependencies/revisions, frozen head/environment, obligations/path/value order, expected effects/outputs, acceptance/falsifier, rollback, testing/cleanup, pressure/deviation triggers, and required durable records.
    validations:
      required: true
  - type: textarea
    id: cleanup
    attributes:
      label: Cleanup inventory, protected state, and final disposition
      description: Identify protected state; expected reading/decision records, files, provisional tests/fixtures/logs, branches/worktrees/stashes, remote PR/issues/reviews, generated/build artifacts, processes/device state, credentials, backups/persistence, external resources, dispositions, safeguards, verification, and debt.
    validations:
      required: true
  - type: dropdown
    id: reasoning
    attributes:
      label: Reasoning level
      options:
        - Routine or Substantial
        - Critical (foundational specification/decision, safety/security, CUDA/concurrency/memory/ABI, persistence/migration, hot path, component/repository boundary, high-consequence oracle, destructive or sensitive state)
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Completion evidence and stop conditions
      description: Include authority-closure and final-refresh evidence, obligation/gate satisfaction, selected-path falsifiers, actual-effect inspection, test evidence/counts/intents/clusters, branch integration, token-practice-floor adherence, resource/failure/compatibility checks, cleanup verification, document-reading/decision/test/token debt, and conditions to pause/narrow/split/revise/invalidate/rollback/fail/block.
    validations:
      required: true
