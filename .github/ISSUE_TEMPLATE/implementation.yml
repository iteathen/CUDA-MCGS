name: Implementation
description: Implement an accepted UMCGS specification
title: "[Implementation]: "
labels: ["implementation"]
body:
  - type: input
    id: specification
    attributes:
      label: Accepted specification
      placeholder: docs/specs/...
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Coherent ownership and organization boundary
      description: Identify product area, component, manifest/registry entry, public surface, dependencies, in-scope responsibilities, and explicit non-responsibilities.
    validations:
      required: true
  - type: textarea
    id: assessment
    attributes:
      label: Assessment and strongest adversarial challenge
      description: Link the assessment/plan or summarize its disposition, strongest credible objection, integrated resolution, sound fundamentals, and decisive falsifier. Do not duplicate accepted authority.
    validations:
      required: true
  - type: dropdown
    id: reasoning
    attributes:
      label: Reasoning level
      options:
        - Substantial
        - Critical (CUDA, concurrency, memory, ABI, persistent state, hot path, component boundary, or foundational contract)
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Completion evidence, validation, and stop conditions
      description: Pair validation with the mechanisms claimed; include resource/failure/compatibility checks and evidence that would halt or redesign the work.
    validations:
      required: true
