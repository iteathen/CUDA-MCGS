name: Implementation
description: Implement an accepted UMCGS specification
title: "[Implementation]: "
labels: ["implementation"]
body:
  - type: input
    id: specification
    attributes:
      label: Accepted specification
      placeholder: docs/specs/...
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Coherent ownership boundary
      description: State components in scope and explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: organization
    attributes:
      label: Product area, component, and dependency direction
      description: Identify the component manifest/registry entry and public surface. Explain why placement remains valid at large-project scale.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: LEGO boundary and simplest sufficient total system
      description: State authoritative owner, ports, injected dependencies, adapters, SOLID responsibility structure, CUPID qualities, and complexity moved elsewhere.
    validations:
      required: true
  - type: textarea
    id: foundations
    attributes:
      label: Domain-appropriate foundations and accurate-generality tests
      description: State ranges/precision/capacities plus second-instance, first-consumer deletion, and included/excluded cases for reusable concepts.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Invariants, lifecycle, resources, and failure behavior
    validations:
      required: true
  - type: dropdown
    id: reasoning
    attributes:
      label: Reasoning level
      options:
        - Substantial
        - Critical (CUDA, concurrency, memory, ABI, persistent state, hot path, or component boundary)
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and performance guardrails
    validations:
      required: true
