name: Implementation
description: Implement an accepted UMCGS specification through a governed plan node
title: "[Implementation]: "
labels: ["implementation"]
body:
  - type: input
    id: specification
    attributes:
      label: Accepted specification
      placeholder: docs/specs/...
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Coherent ownership and organization boundary
      description: Identify product area, component, manifest/registry entry, public surface, dependencies, in-scope responsibilities, and explicit non-responsibilities.
    validations:
      required: true
  - type: textarea
    id: assessment
    attributes:
      label: Assessment and strongest adversarial challenge
      description: Link the assessment/plan or summarize its disposition, strongest credible objection, integrated resolution, sound fundamentals, and decisive falsifier. Do not duplicate accepted authority.
    validations:
      required: true
  - type: textarea
    id: plan-node
    attributes:
      label: Plan version, node, readiness, and execution contract
      description: State plan record/version/node, owner, dependencies and expected revisions, frozen head/environment, expected local/wider effects, outputs, acceptance, cheapest falsifier, rollback/safe stop, material deviation triggers, and whether a durable execution record is required.
    validations:
      required: true
  - type: dropdown
    id: reasoning
    attributes:
      label: Reasoning level
      options:
        - Substantial
        - Critical (CUDA, concurrency, memory, ABI, persistent state, hot path, component boundary, foundational contract, coordinated or invalid-intermediate-state execution)
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Completion evidence, validation, and stop conditions
      description: Pair validation with the mechanisms claimed; include expected-versus-actual inspection, resource/failure/compatibility checks, affected boundary/path reconciliation, downstream outputs, and evidence that would pause, revise, rollback, or fail the node.
    validations:
      required: true
