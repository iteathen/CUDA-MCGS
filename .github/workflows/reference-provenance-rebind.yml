name: Reference provenance rebind transport

on:
  push:
    branches:
      - ref/channel-evidence-01
    paths:
      - '.github/workflows/reference-provenance-rebind.yml'

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ref/channel-evidence-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Regenerate Composer and direct profile projections
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-domain-profiles.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/export-search-ir-composer-policy-profiles.mjs
          node scripts/export-search-ir-composer-evaluator-profiles.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/export-search-ir-composer-progress-profiles.mjs
          node scripts/export-search-ir-composer-output-profiles.mjs
      - name: Rebind direct producer provenance
        run: node scripts/reference-provenance-rebind.mjs direct
      - name: Qualify direct reference owners
        shell: bash
        run: |
          node experiments/search-semantics-reference/run.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-policy-reference.mjs
          node scripts/run-evaluator-reference.mjs
          node scripts/run-resource-reference.mjs
          node scripts/run-progress-reference.mjs
          node scripts/run-output-reference.mjs
      - name: Rebind and qualify Graph EDGE
        shell: bash
        run: |
          node scripts/reference-provenance-rebind.mjs graph-edge
          node scripts/run-graph-edge-reference.mjs
      - name: Rebind and qualify Graph REF
        shell: bash
        run: |
          node scripts/reference-provenance-rebind.mjs graph-ref
          node scripts/run-graph-ref-reference.mjs
      - name: Rebind and qualify Graph PATH
        shell: bash
        run: |
          node scripts/reference-provenance-rebind.mjs graph-path
          node scripts/run-graph-path-reference.mjs
      - name: Rebind and qualify Graph ROOT
        shell: bash
        run: |
          node scripts/reference-provenance-rebind.mjs graph-root
          node scripts/run-graph-root-reference.mjs
      - name: Rebind and qualify Graph RECLAIM
        shell: bash
        run: |
          node scripts/reference-provenance-rebind.mjs graph-reclaim
          node scripts/run-graph-reclaim-reference.mjs
      - name: Rebind and qualify Graph ADVANCE occurrence
        shell: bash
        run: |
          node scripts/reference-provenance-rebind.mjs graph-advance
          node scripts/run-graph-advance-occurrence-reference.mjs
      - name: Rebind and qualify Graph CLEANUP
        shell: bash
        run: |
          node scripts/reference-provenance-rebind.mjs graph-cleanup
          node scripts/run-graph-cleanup-reference.mjs
      - name: Verify complete provenance transition
        shell: bash
        run: |
          git diff --check
          if grep -R -n 'a6abe9cb7b22f15b4e57fb89cbe0dd0a22e8539beff3e98f9f18f67c421e2bfe' experiments/search-semantics-reference/fixtures; then
            echo 'stale Composer evidence identity remains in reference fixtures' >&2
            exit 1
          fi
          git diff --stat -- experiments/search-semantics-reference/fixtures
          git diff -- experiments/search-semantics-reference/fixtures
      - name: Commit only regenerated reference provenance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/search-semantics-reference/fixtures/domain-cases.json \
            experiments/search-semantics-reference/fixtures/evaluator-cases.json \
            experiments/search-semantics-reference/fixtures/graph-advance-occurrence-cases.json \
            experiments/search-semantics-reference/fixtures/graph-cleanup-cases.json \
            experiments/search-semantics-reference/fixtures/graph-edge-cases.json \
            experiments/search-semantics-reference/fixtures/graph-node-cases.json \
            experiments/search-semantics-reference/fixtures/graph-path-cases.json \
            experiments/search-semantics-reference/fixtures/graph-reclaim-cases.json \
            experiments/search-semantics-reference/fixtures/graph-ref-cases.json \
            experiments/search-semantics-reference/fixtures/graph-root-cases.json \
            experiments/search-semantics-reference/fixtures/neutral-schedules.json \
            experiments/search-semantics-reference/fixtures/output-cases.json \
            experiments/search-semantics-reference/fixtures/policy-cases.json \
            experiments/search-semantics-reference/fixtures/progress-cases.json \
            experiments/search-semantics-reference/fixtures/resource-cases.json
          git commit -m 'REF-CHANNEL-EVIDENCE-01: rebind reference provenance'
          git push origin HEAD:ref/channel-evidence-01
