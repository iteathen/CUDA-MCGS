name: agent-routing-validator-verify

on:
  push:
    branches:
      - fix/agent-routing-validator-alignment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Run agent-routing validators
        run: |
          bash scripts/verify-docs.sh
          node scripts/check-structured-data.mjs
          git diff --check -- scripts/verify-docs.sh scripts/check-structured-data.mjs
