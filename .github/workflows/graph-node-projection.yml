name: Graph NODE projection

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ref/graph-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ref/graph-01
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Run exact Composer and Graph projection
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
