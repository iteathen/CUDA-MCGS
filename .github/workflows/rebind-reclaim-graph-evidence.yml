name: one-shot RECLAIM preflight Graph evidence rebind

on:
  push:
    branches: [ref/graph-reclaim-preflight-01]

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ref/graph-reclaim-preflight-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Regenerate and freeze Graph evidence chain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const composer = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/graph-node-cases.json';
          const fixture = JSON.parse(fs.readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = { schema: projection.schema, ...projection.projectionIdentity };
          fs.writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          NODE

          node scripts/run-graph-node-reference.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const composer = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const node = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-node-evidence.json', 'utf8'));
          for (const name of ['graph-edge-cases.json', 'graph-ref-cases.json']) {
            const path = `experiments/search-semantics-reference/fixtures/${name}`;
            const fixture = JSON.parse(fs.readFileSync(path, 'utf8'));
            fixture.composerEvidence = composer.representationCompositionEvidenceKey;
            fixture.profileProjection = { schema: projection.schema, ...projection.projectionIdentity };
            fixture.nodeEvidence = node.evidenceIdentity;
            fs.writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          }
          NODE

          node scripts/run-graph-edge-reference.mjs
          node scripts/run-graph-ref-reference.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const composer = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const node = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-node-evidence.json', 'utf8'));
          const ref = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-ref-evidence.json', 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/graph-path-cases.json';
          const fixture = JSON.parse(fs.readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = { schema: projection.schema, ...projection.projectionIdentity };
          fixture.nodeEvidence = node.evidenceIdentity;
          fixture.refEvidence = ref.evidenceIdentity;
          fs.writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          NODE

          node scripts/run-graph-path-reference.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const composer = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const rootControl = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/root-control.json', 'utf8'));
          const node = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-node-evidence.json', 'utf8'));
          const ref = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-ref-evidence.json', 'utf8'));
          const pathEvidence = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-path-evidence.json', 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/graph-root-cases.json';
          const fixture = JSON.parse(fs.readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = { schema: projection.schema, ...projection.projectionIdentity };
          fixture.nodeEvidence = node.evidenceIdentity;
          fixture.refEvidence = ref.evidenceIdentity;
          fixture.pathEvidence = pathEvidence.evidenceIdentity;
          fixture.rootControlProjection = rootControl.identity;
          fs.writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          NODE

          node scripts/run-graph-root-reference.mjs
          git diff --check

          git rm .github/workflows/rebind-reclaim-graph-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/search-semantics-reference/fixtures/graph-node-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-edge-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-ref-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-path-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-root-cases.json
          git commit -m 'test: rebind Graph evidence to RECLAIM preflight representation'
          git push origin HEAD:ref/graph-reclaim-preflight-01
