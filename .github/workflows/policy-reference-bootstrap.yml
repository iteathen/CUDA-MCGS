name: policy-reference-bootstrap

on:
  push:
    branches: [ref/policy-reference-01]

permissions:
  contents: write

jobs:
  install-policy-reference:
    if: ${{ github.ref == 'refs/heads/ref/policy-reference-01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install bounded Policy reference payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '[... ELLIPSIZATION ...]' | base64 -d | tar -xzf -
          rm .github/workflows/policy-reference-bootstrap.yml
          allowed='^(\.github/workflows/policy-reference-focused\.yml|experiments/search-ir-composer-reference/export-policy-profiles\.mjs|experiments/search-semantics-reference/(fixtures/policy-cases\.json|run-policy\.mjs|src/policy(-cases)?\.mjs)|scripts/(export-search-ir-composer-policy-profiles|run-policy-reference)\.mjs|\.github/workflows/policy-reference-bootstrap\.yml)$'
          bad="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$bad" ]]; then
            printf 'unexpected Policy bootstrap paths:\n%s\n' "$bad" >&2
            exit 1
          fi
          git diff --check
          node --check experiments/search-ir-composer-reference/export-policy-profiles.mjs
          node --check experiments/search-semantics-reference/src/policy.mjs
          node --check experiments/search-semantics-reference/src/policy-cases.mjs
          node --check experiments/search-semantics-reference/run-policy.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: add Policy reference oracle'
          git push origin HEAD:ref/policy-reference-01
