name: policy-reference-focused

on:
  push:
    branches: [ref/policy-reference-01]
  pull_request:
    branches: [experimental/portfolio]

permissions:
  contents: read

jobs:
  policy-reference:
    name: Policy reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer and Policy reference
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-policy-profiles.mjs
          node scripts/run-policy-reference.mjs
      - name: Retain Policy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-reference
          if-no-files-found: ignore
          path: |
            experiments/search-ir-composer-reference/build/policy-profiles.json
            experiments/search-semantics-reference/build/policy-evidence.json
