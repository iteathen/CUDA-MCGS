name: construct-202-sideband-v2

on:
  push:
    branches:
      - impl/202-external-control-sideband-projection

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: impl/202-external-control-sideband-projection
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Extract preserved construction source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/construct-202-sideband.yml';
          const source = fs.readFileSync(path, 'utf8');
          const constructStartMarker = "          node <<'NODE'\n";
          const constructEndMarker = "\n          NODE\n      - name: Write permanent #202 falsifier/conformance verifier";
          const constructStart = source.indexOf(constructStartMarker);
          const constructEnd = source.indexOf(constructEndMarker, constructStart);
          if (constructStart < 0 || constructEnd < 0) throw new Error('preserved construction block not found');
          let construct = source.slice(constructStart + constructStartMarker.length, constructEnd);
          construct = construct
            .replace("id: `sideband.${profileId}.framework-cancellation`", "id: \\`sideband.\\${profileId}.framework-cancellation\\`")
            .replace("id: `sideband.${profileId}.session-command-publication`", "id: \\`sideband.\\${profileId}.session-command-publication\\`");
          fs.writeFileSync('/tmp/construct-202.cjs', construct);
          const verifierStartMarker = "          cat > experiments/search-ir-composer-reference/verify-external-control-sideband-authority.mjs <<'EOF'\n";
          const verifierEndMarker = "\n          EOF\n      - name: Qualify focused Composer/reference implementation";
          const verifierStart = source.indexOf(verifierStartMarker);
          const verifierEnd = source.indexOf(verifierEndMarker, verifierStart);
          if (verifierStart < 0 || verifierEnd < 0) throw new Error('preserved verifier block not found');
          let verifier = source.slice(verifierStart + verifierStartMarker.length, verifierEnd)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');
          verifier = verifier.replace(
            "requirements: [schemaReference('cuda-js.publication-mailbox', '8')], engineStepRoles",
            "requirements: [baseBuilt.context.requirementById.get('cuda-js.publication-mailbox/0.1.0')], engineStepRoles",
          );
          verifier = verifier.replace(
            "const unknownBinding = structuredClone(baseBuilt.input);\nunknownBinding.operations[0].bindings.find(({ source }) => source.kind === 'sideband').source.sideband = 'sideband.unknown-control';\nassert.throws(() => normalizeProgramPackageProfile(unknownBinding, inspected, baseBuilt.context), /sideband binding is incompatible/);\n\nconst missingSidebands = structuredClone(baseBuilt.input);\ndelete missingSidebands.sidebands;\nassert.throws(() => normalizeProgramPackageProfile(missingSidebands, inspected, baseBuilt.context), /sideband binding is incompatible/);\n\nconst missingCapability = structuredClone(baseBuilt.input);\nmissingCapability.publicRequirements = missingCapability.publicRequirements.filter(({ contract }) => contract.id !== 'cuda-js.publication-mailbox/0.1.0');\nfor (const record of missingCapability.deletion.records) record.publicRequirements = record.publicRequirements.filter((id) => id !== 'cuda-js.publication-mailbox/0.1.0');\nassert.throws(() => normalizeProgramPackageProfile(missingCapability, inspected, baseBuilt.context), /public requirements differ|publication-mailbox/);\n\nconst invalidDirection = structuredClone(baseBuilt.input);\ninvalidDirection.sidebands[0].direction = 'device-to-host';\nassert.throws(() => normalizeProgramPackageProfile(invalidDirection, inspected, baseBuilt.context), /direction is invalid/);\n\nconst changedMeaning = structuredClone(baseBuilt.input);\nchangedMeaning.sidebands[0].capacity = '2';\nassert.throws(() => normalizeProgramPackageProfile(changedMeaning, inspected, baseBuilt.context), /first accepted realization requires one finite signal lane/);\nconst changedApplication = structuredClone(baseBuilt.input);\nchangedApplication.sidebands[0].applicationPoint = 'session-command-checkpoint';\nassert.throws(() => normalizeProgramPackageProfile(changedApplication, inspected, baseBuilt.context), /framework cancellation sideband ownership/);\n\nconst historical = structuredClone(baseBuilt.input);",
            "const unknownBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst unknownBinding = structuredClone(unknownBuilt.input);\nunknownBinding.operations[0].bindings.find(({ source }) => source.kind === 'sideband').source.sideband = 'sideband.unknown-control';\nassert.throws(() => normalizeProgramPackageProfile(unknownBinding, inspected, unknownBuilt.context), /sideband binding is incompatible/);\n\nconst missingBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst missingSidebands = structuredClone(missingBuilt.input);\nmissingSidebands.sidebands = [];\nassert.throws(() => normalizeProgramPackageProfile(missingSidebands, inspected, missingBuilt.context), /sidebands must contain/);\n\nconst capabilityBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst missingCapability = structuredClone(capabilityBuilt.input);\nmissingCapability.publicRequirements = missingCapability.publicRequirements.filter(({ contract }) => contract.id !== 'cuda-js.publication-mailbox/0.1.0');\nfor (const record of missingCapability.deletion.records) record.publicRequirements = record.publicRequirements.filter((id) => id !== 'cuda-js.publication-mailbox/0.1.0');\nassert.throws(() => normalizeProgramPackageProfile(missingCapability, inspected, capabilityBuilt.context), /public requirements differ|publication-mailbox/);\n\nconst directionBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst invalidDirection = structuredClone(directionBuilt.input);\ninvalidDirection.sidebands[0].direction = 'device-to-host';\nassert.throws(() => normalizeProgramPackageProfile(invalidDirection, inspected, directionBuilt.context), /direction is invalid/);\n\nconst capacityBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst changedMeaning = structuredClone(capacityBuilt.input);\nchangedMeaning.sidebands[0].capacity = '2';\nassert.throws(() => normalizeProgramPackageProfile(changedMeaning, inspected, capacityBuilt.context), /first accepted realization requires one finite signal lane/);\nconst applicationBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst changedApplication = structuredClone(applicationBuilt.input);\nchangedApplication.sidebands[0].applicationPoint = 'session-command-checkpoint';\nassert.throws(() => normalizeProgramPackageProfile(changedApplication, inspected, applicationBuilt.context), /framework cancellation sideband ownership/);\n\nconst historicalBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst historical = structuredClone(historicalBuilt.input);"
          );
          verifier = verifier
            .replace("const historicalResult = normalizeProgramPackageProfile(historical, inspected, baseBuilt.context);", "const historicalResult = normalizeProgramPackageProfile(historical, inspected, historicalBuilt.context);")
            .replace("const identityMutation = structuredClone(baseBuilt.input);", "const identityBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');\nconst identityMutation = structuredClone(identityBuilt.input);")
            .replace("const progressDeletion = identityMutation.deletion.records.find(({ owner }) => owner === baseBuilt.context.progressResult.normalized.id);", "const progressDeletion = identityMutation.deletion.records.find(({ owner }) => owner === identityBuilt.context.progressResult.normalized.id);")
            .replace("normalizeProgramPackageProfile(identityMutation, inspected, baseBuilt.context)", "normalizeProgramPackageProfile(identityMutation, inspected, identityBuilt.context)");
          fs.writeFileSync('/tmp/verify-external-control-sideband-authority.mjs', verifier + '\n');
          NODE
      - name: Apply package-sideband implementation
        shell: bash
        run: |
          node --check /tmp/construct-202.cjs
          node /tmp/construct-202.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'experiments/search-ir-composer-reference/verify-operation-local-access.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const outputBinding = ".bindings.find(({ parameter }) => parameter === 'output')";
          source = source
            .replace("program.normalized.operations[0].bindings[0].source.access", `program.normalized.operations[0]${outputBinding}.source.access`)
            .replace("execution.normalized.cudaJsAdapter.operationRequirements[0].bindings[0].source.access", `execution.normalized.cudaJsAdapter.operationRequirements[0]${outputBinding}.source.access`)
            .replaceAll(".normalized.normalized.operations[0].bindings[0].source.access", `.normalized.normalized.operations[0]${outputBinding}.source.access`)
            .replace("historical.normalized.normalized.operations[0].bindings[0].source", `historical.normalized.normalized.operations[0]${outputBinding}.source`);
          fs.writeFileSync(path, source);
          NODE
          cp /tmp/verify-external-control-sideband-authority.mjs experiments/search-ir-composer-reference/verify-external-control-sideband-authority.mjs
          git diff --check
      - name: Qualify focused Composer/reference implementation
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          git diff --check
      - name: Commit clean semantic construction
        shell: bash
        run: |
          rm .github/workflows/construct-202-sideband.yml .github/workflows/construct-202-sideband-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Execution package: implement bounded external control sidebands"
          git push origin HEAD:impl/202-external-control-sideband-projection
