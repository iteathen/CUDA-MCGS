name: one-shot adjacent root authority reconciliation v5

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'docs/ref-root-control-01-reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ref-root-control-01-reconcile
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Reuse reconciliation with normalized contract-set identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const workflow = await readFile('.github/workflows/reconcile-adjacent-root-authority-v4.yml', 'utf8');
          const marker = '        run: |\n';
          const start = workflow.indexOf(marker);
          if (start < 0) throw new Error('v4 reconciliation run block not found');
          let script = workflow.slice(start + marker.length)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');

          const rawIdentity = 'canonicalIdentity(contractSet)';
          const normalizedIdentity = "canonicalIdentity((await import('./experiments/search-ir-composer-reference/src/catalog.mjs')).normalizeContractSet(contractSet))";
          if (!script.includes(rawIdentity)) throw new Error('raw contract-set identity expression not found');
          script = script.replace(rawIdentity, normalizedIdentity);

          const oldCleanup = '.github/workflows/reconcile-adjacent-root-authority-v4.yml`';
          const newCleanup = '.github/workflows/reconcile-adjacent-root-authority-v4.yml .github/workflows/reconcile-adjacent-root-authority-v5.yml`';
          if (!script.includes(oldCleanup)) throw new Error('v4 cleanup anchor missing');
          script = script.replace(oldCleanup, newCleanup);

          await writeFile('/tmp/reconcile-adjacent-root-authority-v5.sh', `set -euo pipefail\n${script}`, { mode: 0o700 });
          NODE
          bash /tmp/reconcile-adjacent-root-authority-v5.sh
