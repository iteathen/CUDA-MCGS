name: Rebind Graph EDGE evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  rebind:
    if: github.event.pull_request.head.ref == 'ref/graph-edge-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ref/graph-edge-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Rebind exact Graph NODE and EDGE evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const composer = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/graph-node-cases.json';
          const fixture = JSON.parse(fs.readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = {
            schema: projection.schema,
            algorithm: projection.projectionIdentity.algorithm,
            byteLength: projection.projectionIdentity.byteLength,
            sha256: projection.projectionIdentity.sha256,
          };
          fs.writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          console.log(`node_fixture_composer=${fixture.composerEvidence.sha256} bytes=${fixture.composerEvidence.byteLength}`);
          console.log(`node_fixture_projection=${fixture.profileProjection.sha256} bytes=${fixture.profileProjection.byteLength}`);
          NODE

          node scripts/run-graph-node-reference.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const composer = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(fs.readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const nodeEvidence = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-node-evidence.json', 'utf8'));
          if (nodeEvidence.status !== 'pass' || nodeEvidence.summary.passed !== 13 || nodeEvidence.graphNodeRequirementCoverage.executedRequirementCount !== 11) {
            throw new Error('NODE evidence is not fully qualified');
          }
          const path = 'experiments/search-semantics-reference/fixtures/graph-edge-cases.json';
          const fixture = JSON.parse(fs.readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = {
            schema: projection.schema,
            algorithm: projection.projectionIdentity.algorithm,
            byteLength: projection.projectionIdentity.byteLength,
            sha256: projection.projectionIdentity.sha256,
          };
          fixture.nodeEvidence = nodeEvidence.evidenceIdentity;
          if (fixture.expectedCases.length !== 16) throw new Error(`EDGE expected case count is ${fixture.expectedCases.length}, expected 16`);
          fs.writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          console.log(`edge_fixture_node=${fixture.nodeEvidence.sha256} bytes=${fixture.nodeEvidence.byteLength}`);
          NODE

          node scripts/run-graph-edge-reference.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const edge = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-edge-evidence.json', 'utf8'));
          if (edge.status !== 'pass' || edge.summary.passed !== 16 || edge.graphEdgeRequirementCoverage.executedRequirementCount !== 10) {
            throw new Error('EDGE evidence is not fully qualified');
          }
          console.log(`qualified_edge=${edge.evidenceIdentity.sha256} bytes=${edge.evidenceIdentity.byteLength}`);
          NODE

          git rm --ignore-unmatch .github/workflows/rebind-graph-edge-evidence.yml
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add experiments/search-semantics-reference/fixtures/graph-node-cases.json experiments/search-semantics-reference/fixtures/graph-edge-cases.json
          git commit -m "ref: rebind Graph EDGE evidence chain"
          git push origin HEAD:ref/graph-edge-01
