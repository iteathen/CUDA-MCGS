name: Channel construction patch transport

on:
  push:
    branches:
      - ref/channel-evidence-01
    paths:
      - '.github/workflows/channel-construction-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ref/channel-evidence-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Apply exact Channel oracle correction and falsifiers
        run: node scripts/channel-construction-patch.mjs
      - name: Verify patch shape
        run: git diff --check && git diff -- experiments/search-ir-composer-reference/src/channel.mjs experiments/search-ir-composer-reference/run.mjs
      - name: Commit exact construction change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/search-ir-composer-reference/src/channel.mjs experiments/search-ir-composer-reference/run.mjs
          git commit -m 'REF-CHANNEL-EVIDENCE-01: preserve Channel cancellation first cause'
          git push origin HEAD:ref/channel-evidence-01
