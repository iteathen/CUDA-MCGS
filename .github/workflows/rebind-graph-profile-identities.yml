name: Rebind Graph-derived profile identities

on:
  pull_request:

permissions:
  contents: write

jobs:
  rebind:
    if: github.event.pull_request.head.ref == 'ref/graph-edge-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ref/graph-edge-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Rebind exact Graph-derived identities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'experiments/search-ir-composer-reference';
          const replacements = new Map([
            ['e067810464a0bbcfc052dc4f2958f9e6ffb289c14eeca9f669b439fa16e12c22', '332258844f1210f952a22fd4c191d684accbf16060e07fb57a22099675d956b8'],
            ['b7d7183dc73d82774f144aba80a9215aad07666e1864a8203474eae0ca88c5fa', '797990263ff7863bc7c6a25e9d0ff19c91862d94283049e84415209e5313effb'],
            ['b060dbf88f88fde6b39380501c89e089f3402e9bd6b2db0f991de92180ae5f0d', '54c8a8c09c86e8c7570fa57c3e7d06119030a2fb59ae66e193805394b0ef99ca'],
            ['20950a061de105c27d2bc9bf71021483ff9ac697cb24214ead52c168dd20ccc2', '250471d0d79ca0e5237b60fc921204b51737292fb52e255ad24396fe5b31a4f6'],
            ['c14d25fa8def9eca4963fa85fd944826120d420c3175ee5589d5b0270f09edc6', '17a2aabbdc26e65912f24306b5ec99256637f2990caf775bd06e2f9212ba977d'],
          ]);
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(mjs|json|md)$/.test(entry.name)) files.push(full);
            }
          }
          walk(root);
          for (const [oldValue, newValue] of replacements) {
            const hits = [];
            for (const file of files) {
              const text = fs.readFileSync(file, 'utf8');
              const count = text.split(oldValue).length - 1;
              if (count) hits.push([file, count]);
            }
            const total = hits.reduce((sum, [, count]) => sum + count, 0);
            if (total !== 1) throw new Error(`${oldValue}: expected exactly one stale occurrence, found ${total}: ${JSON.stringify(hits)}`);
            const [file] = hits[0];
            const text = fs.readFileSync(file, 'utf8');
            fs.writeFileSync(file, text.replace(oldValue, newValue));
            console.log(`${oldValue} -> ${newValue} in ${file}`);
          }
          NODE
          git rm --ignore-unmatch .github/workflows/rebind-graph-profile-identities.yml
          node scripts/run-search-ir-composer-reference.mjs
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add experiments/search-ir-composer-reference
          git commit -m "ref: rebind Graph-derived profile identities"
          git push origin HEAD:ref/graph-edge-01
