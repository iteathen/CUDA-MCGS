name: policy-transaction-review-repair

on:
  push:
    branches: [ref/policy-reference-01]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Apply guarded Policy transaction review repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tmp-policy-transaction-review-repair.mjs
          git diff --check
          node --check experiments/search-semantics-reference/src/policy.mjs
          node --check experiments/search-semantics-reference/src/policy-cases.mjs
          changed="$(git diff --name-only)"
          test "$changed" = $'experiments/search-semantics-reference/src/policy-cases.mjs\nexperiments/search-semantics-reference/src/policy.mjs'
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-policy-profiles.mjs
          node scripts/run-policy-reference.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/search-semantics-reference/src/policy.mjs experiments/search-semantics-reference/src/policy-cases.mjs
          git commit -m 'fix: close Policy transaction review gaps'
          git push origin HEAD:ref/policy-reference-01
