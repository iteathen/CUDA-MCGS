name: REF-ROOT-CONTROL-01 reconcile

on:
  push:
    branches: [docs/ref-root-control-01-reconcile]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[root-control-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Reconstruct bounded migration
        shell: bash
        run: |
          cat scripts/.ref-root-control-01/part*.b64 | base64 --decode | gzip -dc > scripts/_ref-root-control-01-migrate.mjs
          node --check scripts/_ref-root-control-01-migrate.mjs
      - name: Apply authority reconciliation
        run: node scripts/_ref-root-control-01-migrate.mjs apply
      - name: Preflight structure and accepted reference
        shell: bash
        run: |
          node scripts/check-project-organization.mjs
          node scripts/check-doc-links.mjs
          node scripts/check-structured-data.mjs
          node scripts/run-search-ir-reference.mjs
      - name: Regenerate Composer evidence
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/_ref-root-control-01-migrate.mjs sync-composer
      - name: Regenerate Domain projection and semantic evidence
        shell: bash
        run: |
          node scripts/export-search-ir-composer-domain-profiles.mjs
          node scripts/_ref-root-control-01-migrate.mjs sync-domain
          node scripts/run-search-semantics-reference.mjs
          node scripts/_ref-root-control-01-migrate.mjs finalize
      - name: Verify complete repository state
        shell: bash
        run: |
          ./scripts/verify-docs.sh
          git diff --check
      - name: Remove temporary migration transport
        shell: bash
        run: |
          rm -f scripts/_ref-root-control-01-migrate.mjs
          rm -rf scripts/.ref-root-control-01
          git diff --check
      - name: Commit reconciled branch
        shell: bash
        env:
          BRANCH: docs/ref-root-control-01-reconcile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Reconcile root control representation and live authority docs [root-control-generated]'
          git push origin HEAD:$BRANCH
