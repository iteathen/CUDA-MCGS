name: framework-lifecycle-reference

on:
  pull_request:
    branches:
      - experimental/portfolio
  push:
    branches:
      - experimental/portfolio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-lifecycle-reference:
    name: Framework lifecycle reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer and Framework lifecycle reference
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/run-framework-lifecycle-reference.mjs
      - name: Retain Framework lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framework-lifecycle-reference
          path: experiments/search-semantics-reference/build/framework-lifecycle-evidence.json
