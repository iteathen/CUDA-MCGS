name: one-shot Graph evidence rebind

on:
  push:
    branches:
      - architecture/44-framework-only-production

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: architecture/44-framework-only-production
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Generate corrected Composer and Graph projection
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
      - name: Rebind NODE fixture to corrected framework authority
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = 'experiments/search-ir-composer-reference/build';
          const evidence = JSON.parse(readFileSync(`${root}/evidence.json`, 'utf8'));
          const projection = JSON.parse(readFileSync(`${root}/graph-profiles.json`, 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/graph-node-cases.json';
          const fixture = JSON.parse(readFileSync(path, 'utf8'));
          fixture.composerEvidence = evidence.representationCompositionEvidenceKey;
          fixture.profileProjection = {
            schema: fixture.profileProjection.schema,
            ...projection.projectionIdentity,
          };
          writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          NODE
          node scripts/run-graph-node-reference.mjs
      - name: Rebind EDGE and REF fixtures to NODE evidence
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const composer = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const node = JSON.parse(readFileSync('experiments/search-semantics-reference/build/graph-node-evidence.json', 'utf8'));
          for (const name of ['graph-edge-cases.json', 'graph-ref-cases.json']) {
            const path = `experiments/search-semantics-reference/fixtures/${name}`;
            const fixture = JSON.parse(readFileSync(path, 'utf8'));
            fixture.composerEvidence = composer.representationCompositionEvidenceKey;
            fixture.profileProjection = { schema: fixture.profileProjection.schema, ...projection.projectionIdentity };
            fixture.nodeEvidence = node.evidenceIdentity;
            writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          }
          NODE
          node scripts/run-graph-edge-reference.mjs
          node scripts/run-graph-ref-reference.mjs
      - name: Rebind PATH fixture to REF evidence
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const composer = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const node = JSON.parse(readFileSync('experiments/search-semantics-reference/build/graph-node-evidence.json', 'utf8'));
          const ref = JSON.parse(readFileSync('experiments/search-semantics-reference/build/graph-ref-evidence.json', 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/graph-path-cases.json';
          const fixture = JSON.parse(readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = { schema: fixture.profileProjection.schema, ...projection.projectionIdentity };
          fixture.nodeEvidence = node.evidenceIdentity;
          fixture.refEvidence = ref.evidenceIdentity;
          writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          NODE
          node scripts/run-graph-path-reference.mjs
      - name: Rebind ROOT fixture to PATH and root-control evidence
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          const composer = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/graph-profiles.json', 'utf8'));
          const rootControl = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/root-control.json', 'utf8'));
          const node = JSON.parse(readFileSync('experiments/search-semantics-reference/build/graph-node-evidence.json', 'utf8'));
          const ref = JSON.parse(readFileSync('experiments/search-semantics-reference/build/graph-ref-evidence.json', 'utf8'));
          const pathEvidence = JSON.parse(readFileSync('experiments/search-semantics-reference/build/graph-path-evidence.json', 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/graph-root-cases.json';
          const fixture = JSON.parse(readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = { schema: fixture.profileProjection.schema, ...projection.projectionIdentity };
          fixture.nodeEvidence = node.evidenceIdentity;
          fixture.refEvidence = ref.evidenceIdentity;
          fixture.pathEvidence = pathEvidence.evidenceIdentity;
          fixture.rootControlProjection = rootControl.identity;
          writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          unlinkSync('.github/workflows/rebind-graph-evidence.yml');
          NODE
          node scripts/run-graph-root-reference.mjs
          git diff --check
      - name: Commit exact fixture rebinding and self-clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/search-semantics-reference/fixtures/graph-node-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-edge-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-ref-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-path-cases.json \
                  experiments/search-semantics-reference/fixtures/graph-root-cases.json \
                  .github/workflows/rebind-graph-evidence.yml
          git commit -m 'test: rebind Graph evidence to framework authority'
          git push origin HEAD:architecture/44-framework-only-production
