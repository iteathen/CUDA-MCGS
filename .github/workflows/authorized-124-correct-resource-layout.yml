name: "Authorized #124 corrected Tensor Resource layout"

on:
  push:
    branches:
      - feature/124-tensor-resource-binding

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Materialize, commit locally, qualify exact bytes, and self-remove
        run: |
          set -euo pipefail
          workflow=.github/workflows/authorized-124-correct-resource-layout.yml
          rb_gz=.github/authorized-124-resource-binding.mjs.gz
          test_gz=.github/authorized-124-resource-binding-test.mjs.gz
          package_gz=.github/authorized-124-package.mjs.gz
          readme_gz=.github/authorized-124-adapter-readme.md.gz
          conf_readme_gz=.github/authorized-124-conformance-readme.md.gz
          rb=adapters/evaluators/cuda-js-tensor/src/resource-binding.mjs
          test=conformance/cuda-js-tensor-evaluator/resource-binding.mjs
          index=adapters/evaluators/cuda-js-tensor/index.mjs
          package_test=conformance/cuda-js-tensor-evaluator/package.mjs
          readme=adapters/evaluators/cuda-js-tensor/README.md
          conf_readme=conformance/cuda-js-tensor-evaluator/README.md

          gzip -dc "$rb_gz" > "$rb"
          gzip -dc "$test_gz" > "$test"
          gzip -dc "$package_gz" > "$package_test"
          gzip -dc "$readme_gz" > "$readme"
          gzip -dc "$conf_readme_gz" > "$conf_readme"

          printf '%s  %s\n' \
            b5e9b2c7db1cd4503e5e30a3e97e490815b3d90761540a39e8f9c117851ac875 "$rb" \
            47ca8006c70d138e81b75bb78733a51b4a6de0870955b41d70e9a41132077012 "$test" \
            965a47e34f2a78cd81fb03a2ff9646654b539a77a99096a84b79bb7f777e4d9f "$index" \
            caf78798027a9676c0cf19190844d0fa938a4716b07bea4b32657bdad4855915 "$package_test" \
            0a56c554faff15df760ca63844769736b52b61e41d6106d868a9dbc916138bb5 "$readme" \
            2a637dc9f1a8394504db15f7014c3c6032b07467fef49bce42ecdf64655956fd "$conf_readme" | sha256sum -c -

          test "$(git hash-object "$rb")" = c2fa8bbac5f664fb0a45ed5cdde6ebb6bbf6d129
          test "$(git hash-object "$test")" = cb23d742aa17eec1f7b8674401ee459737d325cd
          test "$(git hash-object "$index")" = 28afb1b32db42ae32e15c2f0722d4efbea47ed1c
          test "$(git hash-object "$package_test")" = 23e0d582a13abd6505fcf1b114eaf49ff6bcf200
          test "$(git hash-object "$readme")" = 690cc7c711de4d6e69afda2c62ff9c015a42d978
          test "$(git hash-object "$conf_readme")" = f06bb119a646488ad8fb17b2b87c9d1ed99d1157

          node --check "$rb"
          node --check "$test"
          node --check "$index"
          node --check "$package_test"

          rm -- "$workflow" "$rb_gz" "$test_gz" "$package_gz" "$readme_gz" "$conf_readme_gz"
          git add -A -- "$workflow" "$rb_gz" "$test_gz" "$package_gz" "$readme_gz" "$conf_readme_gz" "$rb" "$test" "$index" "$package_test" "$readme" "$conf_readme"
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Ev '^(adapters/evaluators/cuda-js-tensor/(README\.md|index\.mjs|src/resource-binding\.mjs)|conformance/cuda-js-tensor-evaluator/(README\.md|package\.mjs|resource-binding\.mjs)|\.github/(authorized-124-.*\.gz|workflows/authorized-124-correct-resource-layout\.yml))$' || true)"
          test -z "$unexpected" || { echo "unexpected staged paths:"; echo "$unexpected"; exit 1; }

          git config user.name "OpenAI authorized project agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct Tensor evaluator Resource layout ownership for #124"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          node scripts/run-cuda-js-tensor-evaluator.mjs
          node conformance/cuda-js-tensor-evaluator/package.mjs
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/run-evaluator-reference.mjs
          node scripts/run-progress-reference.mjs

          git push origin HEAD:refs/heads/feature/124-tensor-resource-binding
