name: "Authorized #255 exact reference-chain refresh"

on:
  push:
    branches:
      - feature/124-device-resident-evaluator

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Refresh exact checked-in reference identities and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          lock() {
            node tools/reference-evidence-locks.mjs --write "$1"
          }

          # Producer foundations.
          node scripts/run-search-ir-reference.mjs
          lock search-ir

          node scripts/run-search-ir-composer-reference.mjs
          lock composer

          for owner in domain graph policy evaluator resource progress output session stage; do
            node "scripts/export-search-ir-composer-${owner}-profiles.mjs"
          done

          # Only fixtures whose contract stores an identity-bearing projection are
          # lock-maintained here. Descriptor projections remain untouched by the
          # canonical maintainer.
          lock projection:domain
          lock projection:graph
          lock projection:policy
          lock projection:evaluator
          lock projection:resource
          lock root-control

          # Downstream reference producers are refreshed in their declared dependency order.
          node scripts/run-search-semantics-reference.mjs
          lock domain

          node scripts/run-graph-node-reference.mjs
          lock graph-node

          node scripts/run-graph-edge-reference.mjs
          lock graph-edge

          node scripts/run-graph-ref-reference.mjs
          lock graph-ref

          node scripts/run-graph-path-reference.mjs
          lock graph-path

          node scripts/run-graph-root-reference.mjs
          lock graph-root

          node scripts/run-graph-reclaim-reference.mjs
          lock graph-reclaim

          node scripts/run-graph-advance-occurrence-reference.mjs
          lock graph-advance

          node scripts/run-graph-cleanup-reference.mjs
          lock graph-cleanup

          node scripts/run-policy-reference.mjs
          lock policy

          node scripts/run-evaluator-reference.mjs
          lock evaluator

          node scripts/run-resource-reference.mjs
          lock resource

          node scripts/run-progress-reference.mjs
          lock progress

          node scripts/run-output-reference.mjs
          lock output

          node scripts/run-framework-lifecycle-reference.mjs
          lock framework

          node scripts/run-terminal-slice-reference.mjs
          lock terminal

          node scripts/run-session-reference.mjs
          lock session

          node scripts/run-stage-reference.mjs
          lock stage

          node scripts/run-channel-reference-evidence.mjs
          lock channel

          # The canonical maintainer must report no remaining drift, then the normal
          # full integration driver must reproduce the complete packet without writes.
          node tools/reference-evidence-locks.mjs --check
          node scripts/run-engine-reference-integration.mjs

          rm -- .github/workflows/authorized-255-reference-chain-refresh.yml
          git config user.name "OpenAI authorized project agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/search-semantics-reference/fixtures .github/workflows/authorized-255-reference-chain-refresh.yml
          git diff --cached --check
          git diff --exit-code

          while IFS= read -r changed; do
            case "$changed" in
              experiments/search-semantics-reference/fixtures/*.json|.github/workflows/authorized-255-reference-chain-refresh.yml) ;;
              *) echo "unexpected staged path: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)

          test -n "$(git diff --cached --name-only)"
          git commit -m "Refresh #255 downstream reference evidence chain"
          git push origin HEAD:refs/heads/feature/124-device-resident-evaluator
