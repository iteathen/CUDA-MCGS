name: ENGINE-CONTRACT-ACCEPTANCE-01 migration

on:
  push:
    branches:
      - accept/122-semantic-packet
    paths:
      - '.github/workflows/accept-122-semantic-packet.yml'
      - 'scripts/accept-122-semantic-packet.mjs'
      - 'scripts/accept-122-catalog-guards.mjs'
      - 'scripts/accept-122-contract-identities.mjs'
      - 'scripts/accept-122-reference-fixture-guards.mjs'
      - 'scripts/accept-122-search-semantics-fixtures.mjs'
      - 'scripts/accept-122-integration-gate-identities.mjs'

permissions:
  contents: write

jobs:
  migrate-and-qualify:
    name: Migrate and qualify accepted semantic packet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Apply asserted acceptance migration
        run: node scripts/accept-122-semantic-packet.mjs
      - name: Mark durable assessment informational
        run: sed -i 's/^\*\*Status:\*\* Active$/\*\*Status:\*\* Informational/' docs/development/2026-09-03-engine-contract-acceptance-01-assessment-and-plan.md
      - name: Migrate structured-data authority guards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'scripts/check-structured-data.mjs';
          let text = readFileSync(file, 'utf8');
          text = text.replaceAll('proposalContractSet', 'acceptedContractSet').replaceAll('proposalCoverage', 'acceptedCoverage');
          text = text.replaceAll('Search IR 0.2.0 proposal contract set', 'Search IR 0.2.0 accepted contract set');
          text = text.replaceAll('Search IR 0.2.0 proposal requirement coverage', 'Search IR 0.2.0 accepted requirement coverage');
          text = text.replace('|| acceptedContractSet.status !== "proposal-evidence"', '|| acceptedContractSet.status !== "accepted"');
          text = text.replace('Search IR 0.2.0 contract set must remain bounded proposal evidence for 12 contracts and 989 requirements', 'Search IR 0.2.0 contract set must be accepted authority for exactly 12 contracts and 989 requirements');
          const oldCoverage = `if (acceptedCoverage.schema !== "cuda-mcgs.search-ir.requirement-coverage/0.2.0"\n      || acceptedCoverage.contractSet !== acceptedContractSet.schema\n      || !Number.isSafeInteger(acceptedCoverage.totals?.classified)\n      || !Number.isSafeInteger(acceptedCoverage.totals?.pending)\n      || acceptedCoverage.totals.classified + acceptedCoverage.totals.pending !== 989) {\n    throw new Error("Search IR 0.2.0 coverage must partition exactly 989 classified/pending requirements");\n  }`;
          const newCoverage = `const nativeDeferred = acceptedCoverage.classifications\n    .filter(({ evidenceStatus }) => evidenceStatus === "deferred-native")\n    .reduce((sum, entry) => sum + entry.requirementCount, 0);\n  const acceptedReference = acceptedCoverage.classifications\n    .filter(({ evidenceStatus }) => evidenceStatus === "accepted-reference")\n    .reduce((sum, entry) => sum + entry.requirementCount, 0);\n  if (acceptedCoverage.schema !== "cuda-mcgs.search-ir.requirement-coverage/0.2.0"\n      || acceptedCoverage.contractSet !== acceptedContractSet.schema\n      || acceptedCoverage.totals?.classified !== 989\n      || acceptedCoverage.totals?.pending !== 0\n      || acceptedReference !== 937\n      || nativeDeferred !== 52\n      || acceptedCoverage.contracts.some(({ currentDisposition, completionStatus }) => currentDisposition !== "accepted-reference" || completionStatus !== "accepted")) {\n    throw new Error("Search IR 0.2.0 coverage must prove 989 classified / 0 pending with 937 accepted-reference and 52 deferred-native requirements");\n  }`;
          if (!text.includes(oldCoverage)) throw new Error('structured-data coverage guard drifted');
          text = text.replace(oldCoverage, newCoverage);
          text = text.replace('|| domainProfileSchema.properties?.representation?.const !== "cuda-mcgs.search-ir/0.2.0"', '|| domainProfileSchema.properties?.representation?.const !== "cuda-mcgs.search-ir/0.2.0"\n      || domainProfileSchema.properties?.status?.const !== "accepted"');
          text = text.replace('Search IR 0.2.0 domain profile must remain closed proposal evidence with restricted Device-JS program contribution only', 'Search IR 0.2.0 domain profile must remain closed accepted semantic authority with restricted Device-JS program contribution only');
          writeFileSync(file, text, 'utf8');
          NODE
      - name: Migrate Composer accepted-state consistency guards
        run: node scripts/accept-122-catalog-guards.mjs
      - name: Migrate accepted contract-reference identities
        run: node scripts/accept-122-contract-identities.mjs
      - name: Reconcile accepted reference fixtures and assertions
        run: node scripts/accept-122-reference-fixture-guards.mjs
      - name: Rebind search-semantics accepted evidence bridge
        run: node scripts/accept-122-search-semantics-fixtures.mjs
      - name: Refreeze accepted final integration identities
        run: node scripts/accept-122-integration-gate-identities.mjs
      - name: Verify governance and source boundary
        run: |
          set +e
          ./scripts/verify-docs.sh > /tmp/accept-122-verify.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- first assertion/error markers ---'
            grep -nE 'AssertionError|Error:|ERR_|result=fail|failed|Process completed' /tmp/accept-122-verify.log | head -n 40 || true
            echo '--- verify tail ---'
            tail -n 120 /tmp/accept-122-verify.log
            exit "$status"
          fi
          cat /tmp/accept-122-verify.log
      - name: Trace Graph NODE fixture across integration precursors
        run: |
          check_fixture() {
            label="$1"
            LABEL="$label" node --input-type=module -e "import {readFileSync} from 'node:fs'; const f=JSON.parse(readFileSync('experiments/search-semantics-reference/fixtures/graph-node-cases.json','utf8')); const expected='d8b6890ae4fc18e39618cd172e59fd0dedad465e48ae80e5442142235be7c4b4'; if (f.composerEvidence?.sha256 !== expected) throw new Error('Graph NODE fixture reset after '+process.env.LABEL+': '+JSON.stringify(f.composerEvidence)); console.log('graph_node_fixture_state=accepted after='+process.env.LABEL);"
          }
          check_fixture verify-docs
          commands=(
            scripts/run-search-ir-reference.mjs
            scripts/run-search-ir-composer-reference.mjs
            scripts/export-search-ir-composer-domain-profiles.mjs
            scripts/export-search-ir-composer-graph-profiles.mjs
            scripts/export-search-ir-composer-policy-profiles.mjs
            scripts/export-search-ir-composer-evaluator-profiles.mjs
            scripts/export-search-ir-composer-resource-profiles.mjs
            scripts/export-search-ir-composer-progress-profiles.mjs
            scripts/export-search-ir-composer-output-profiles.mjs
            scripts/export-search-ir-composer-session-profiles.mjs
            scripts/export-search-ir-composer-stage-profiles.mjs
            scripts/run-search-semantics-reference.mjs
          )
          for command in "${commands[@]}"; do
            echo "trace_step=$command"
            node "$command" >/tmp/accept-122-trace.log 2>&1 || { tail -n 120 /tmp/accept-122-trace.log; exit 1; }
            check_fixture "$command"
          done
      - name: Run complete CUDA-free owner and integration packet
        run: |
          set +e
          node scripts/run-engine-reference-integration.mjs > /tmp/accept-122-integration.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- integration markers ---'
            grep -nE 'integration_step=|AssertionError|Error:|ERR_|result=fail|capsule=' /tmp/accept-122-integration.log | tail -n 160 || true
            echo '--- integration tail ---'
            tail -n 180 /tmp/accept-122-integration.log
            exit "$status"
          fi
          cat /tmp/accept-122-integration.log
      - name: Commit exact generated acceptance subject
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Spec: accept universal semantic packet for #122'
          git push origin HEAD:accept/122-semantic-packet
