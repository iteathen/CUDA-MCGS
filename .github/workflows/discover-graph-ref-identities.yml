name: Discover Graph REF identities

on:
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'ref/graph-ref-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ref/graph-ref-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Apply ephemeral protection-resource closure and expose derived identities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const input = fs.readFileSync(path, 'utf8');
            const first = input.indexOf(before);
            if (first < 0 || input.indexOf(before, first + 1) >= 0) throw new Error(`${path}: expected exactly one replacement target`);
            fs.writeFileSync(path, input.slice(0, first) + after + input.slice(first + before.length));
          }

          replaceOnce(
            'experiments/search-ir-composer-reference/src/graph-fixtures.mjs',
            "    'node-capacity': 'capacity', 'owner-lifecycle-failure': 'compatibility', 'path-capacity': 'capacity', 'path-depth': 'capacity',\n    'publication-conflict': 'publication'",
            "    'node-capacity': 'capacity', 'owner-lifecycle-failure': 'compatibility', 'path-capacity': 'capacity', 'path-depth': 'capacity',\n    'protection-capacity': 'capacity', 'publication-conflict': 'publication'",
          );

          replaceOnce(
            'experiments/search-ir-composer-reference/src/graph-fixtures.mjs',
            "    { id: `graph.${profile}.resource-path-depth`, unit: 'records', minimum: '1', maximum: '4096', alignment: '8', scope: 'per-invocation', pressureOutcome: 'path-depth' },\n  ];",
            "    { id: `graph.${profile}.resource-path-depth`, unit: 'records', minimum: '1', maximum: '4096', alignment: '8', scope: 'per-invocation', pressureOutcome: 'path-depth' },\n    { id: `graph.${profile}.resource-protection-slots`, unit: 'slots', minimum: '1', maximum: '8192', alignment: '8', scope: 'per-engine', pressureOutcome: 'protection-capacity' },\n  ];",
          );

          replaceOnce(
            'experiments/search-ir-composer-reference/src/graph.mjs',
            "const REQUIRED_RESOURCE_PRESSURES = ['action-byte-capacity', 'edge-capacity', 'node-capacity', 'path-capacity', 'path-depth', 'state-byte-capacity'];",
            "const REQUIRED_RESOURCE_PRESSURES = ['action-byte-capacity', 'edge-capacity', 'node-capacity', 'path-capacity', 'path-depth', 'protection-capacity', 'state-byte-capacity'];",
          );

          replaceOnce(
            'experiments/search-ir-composer-reference/src/graph.mjs',
            "  'invalid-graph-profile', 'invalid-reference', 'node-capacity', 'owner-lifecycle-failure', 'path-capacity', 'path-depth', 'publication-conflict',\n  'reclamation-not-quiescent'",
            "  'invalid-graph-profile', 'invalid-reference', 'node-capacity', 'owner-lifecycle-failure', 'path-capacity', 'path-depth', 'protection-capacity', 'publication-conflict',\n  'reclamation-not-quiescent'",
          );

          replaceOnce(
            'experiments/search-ir-composer-reference/src/graph.mjs',
            "    if (compareDecimalUint(edgeSlotCapacity, structuralEdgeDemand) < 0) {\n      fail('GRAPH_RESOURCE_CAPACITY', 'edge-capacity slot resources cannot cover parent-edge plus expansion layout capacity');\n    }\n    const requiredRegions =",
            "    if (compareDecimalUint(edgeSlotCapacity, structuralEdgeDemand) < 0) {\n      fail('GRAPH_RESOURCE_CAPACITY', 'edge-capacity slot resources cannot cover parent-edge plus expansion layout capacity');\n    }\n    const protectionSlotCapacity = resources\n      .filter(({ unit, pressureOutcome, scope }) => unit === 'slots' && pressureOutcome === 'protection-capacity' && scope === 'per-engine')\n      .reduce((total, { maximum }) => addDecimalUint(total, maximum), '0');\n    const protectionDemand = layoutByObject.get(roleObject.get('protection-record')).capacity;\n    if (compareDecimalUint(protectionSlotCapacity, protectionDemand) < 0) {\n      fail('GRAPH_RESOURCE_CAPACITY', 'protection-capacity slot resources cannot cover protection-record layout capacity');\n    }\n    const requiredRegions =",
          );

          replaceOnce(
            'experiments/search-ir-composer-reference/run.mjs',
            "  const underfunded = clone(graphProfileInputs[0]);\n  underfunded.resources = underfunded.resources.filter(({ id }) => !id.endsWith('resource-expansion-slots'));\n  assert.throws(() => normalizeGraphProfile(underfunded, inspected, graphFixtures[0].domain), { code: 'GRAPH_RESOURCE_CAPACITY' });\n});",
            "  const underfunded = clone(graphProfileInputs[0]);\n  underfunded.resources = underfunded.resources.filter(({ id }) => !id.endsWith('resource-expansion-slots'));\n  assert.throws(() => normalizeGraphProfile(underfunded, inspected, graphFixtures[0].domain), { code: 'GRAPH_RESOURCE_CAPACITY' });\n  const unprotected = clone(graphProfileInputs[0]);\n  unprotected.resources = unprotected.resources.filter(({ id }) => !id.endsWith('resource-protection-slots'));\n  assert.throws(() => normalizeGraphProfile(unprotected, inspected, graphFixtures[0].domain), { code: 'GRAPH_RESOURCE_REQUIRED' });\n  const protectionUnderfunded = clone(graphProfileInputs[0]);\n  protectionUnderfunded.resources.find(({ id }) => id.endsWith('resource-protection-slots')).maximum = '8191';\n  assert.throws(() => normalizeGraphProfile(protectionUnderfunded, inspected, graphFixtures[0].domain), { code: 'GRAPH_RESOURCE_CAPACITY' });\n});",
          );
          NODE

          node scripts/run-search-ir-composer-reference.mjs
