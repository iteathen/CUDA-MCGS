name: library-interface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-package:
    name: Installed public package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact CUDA-MCGS candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Pack, install, and exercise public library surface
        run: node scripts/run-library-interface.mjs
