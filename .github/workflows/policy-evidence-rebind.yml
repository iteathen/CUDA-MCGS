name: policy-evidence-rebind

on:
  push:
    branches: [ref/policy-reference-01]

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Rebind exact semantic/reference evidence in owner order
        shell: bash
        run: |
          set -euo pipefail

          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-domain-profiles.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/export-search-ir-composer-policy-profiles.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const fixtureDir = 'experiments/search-semantics-reference/fixtures';
          const fixtureNames = [
            'neutral-schedules.json',
            'domain-cases.json',
            'graph-node-cases.json',
            'graph-edge-cases.json',
            'graph-ref-cases.json',
            'graph-path-cases.json',
            'graph-root-cases.json',
            'graph-reclaim-cases.json',
            'graph-advance-occurrence-cases.json',
            'graph-cleanup-cases.json',
            'policy-cases.json'
          ];
          const evidenceKeys = new Set([
            'composerEvidence', 'profileProjection', 'nodeEvidence', 'edgeEvidence',
            'refEvidence', 'pathEvidence', 'rootControlProjection', 'rootEvidence',
            'reclaimEvidence', 'advanceOccurrenceEvidence', 'evidenceKey'
          ]);
          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => fs.writeFileSync(p, `${JSON.stringify(value, null, 2)}\n`);
          const stripEvidence = (value) => {
            if (Array.isArray(value)) return value.map(stripEvidence);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value)
                .filter(([key]) => !evidenceKeys.has(key))
                .map(([key, child]) => [key, stripEvidence(child)]));
            }
            return value;
          };

          const fixtures = new Map();
          const semanticSnapshots = new Map();
          for (const name of fixtureNames) {
            const p = path.join(fixtureDir, name);
            const value = readJson(p);
            fixtures.set(name, value);
            semanticSnapshots.set(name, JSON.stringify(stripEvidence(value)));
          }

          const composer = readJson('experiments/search-ir-composer-reference/build/evidence.json').representationCompositionEvidenceKey;
          const domainProjection = readJson('experiments/search-ir-composer-reference/build/domain-profiles.json').projectionIdentity;
          const graphProjection = readJson('experiments/search-ir-composer-reference/build/graph-profiles.json').projectionIdentity;
          const policyProjection = readJson('experiments/search-ir-composer-reference/build/policy-profiles.json').projectionIdentity;
          const rootControl = readJson('experiments/search-ir-composer-reference/build/root-control.json').identity;

          for (const value of fixtures.values()) {
            if (Object.hasOwn(value, 'composerEvidence')) value.composerEvidence = structuredClone(composer);
          }
          const neutral = fixtures.get('neutral-schedules.json');
          for (const schedule of Object.values(neutral.schedules)) schedule.evidenceKey = composer.sha256;

          const domain = fixtures.get('domain-cases.json');
          domain.profileProjection = { schema: domain.profileProjection.schema, ...domainProjection };
          const policy = fixtures.get('policy-cases.json');
          policy.profileProjection = { schema: policy.profileProjection.schema, ...policyProjection };

          for (const name of fixtureNames.filter((name) => name.startsWith('graph-'))) {
            const value = fixtures.get(name);
            if (Object.hasOwn(value, 'profileProjection')) value.profileProjection = { schema: value.profileProjection.schema, ...graphProjection };
            if (Object.hasOwn(value, 'rootControlProjection')) value.rootControlProjection = structuredClone(rootControl);
          }

          for (const [name, value] of fixtures) {
            if (JSON.stringify(stripEvidence(value)) !== semanticSnapshots.get(name)) {
              throw new Error(`semantic fixture content changed during initial evidence rebind: ${name}`);
            }
            writeJson(path.join(fixtureDir, name), value);
          }
          NODE

          node scripts/run-search-semantics-reference.mjs
          node scripts/run-policy-reference.mjs
          node scripts/run-graph-node-reference.mjs

          update_evidence() {
            local key="$1"
            local evidence_path="$2"
            node - "$key" "$evidence_path" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const key = process.argv[2];
          const evidencePath = process.argv[3];
          const identity = JSON.parse(fs.readFileSync(evidencePath, 'utf8')).evidenceIdentity;
          if (!identity || identity.algorithm !== 'sha256' || !Number.isInteger(identity.byteLength) || typeof identity.sha256 !== 'string') {
            throw new Error(`invalid evidence identity in ${evidencePath}`);
          }
          const dir = 'experiments/search-semantics-reference/fixtures';
          let changed = 0;
          for (const name of fs.readdirSync(dir).filter((name) => name.endsWith('.json'))) {
            const p = path.join(dir, name);
            const value = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!Object.hasOwn(value, key)) continue;
            value[key] = structuredClone(identity);
            fs.writeFileSync(p, `${JSON.stringify(value, null, 2)}\n`);
            changed += 1;
          }
          if (changed === 0) throw new Error(`no fixture consumed ${key}`);
          console.log(`${key}=${identity.sha256} bytes=${identity.byteLength} consumers=${changed}`);
          NODE
          }

          update_evidence nodeEvidence experiments/search-semantics-reference/build/graph-node-evidence.json
          node scripts/run-graph-edge-reference.mjs
          update_evidence edgeEvidence experiments/search-semantics-reference/build/graph-edge-evidence.json
          node scripts/run-graph-ref-reference.mjs
          update_evidence refEvidence experiments/search-semantics-reference/build/graph-ref-evidence.json
          node scripts/run-graph-path-reference.mjs
          update_evidence pathEvidence experiments/search-semantics-reference/build/graph-path-evidence.json
          node scripts/run-graph-root-reference.mjs
          update_evidence rootEvidence experiments/search-semantics-reference/build/graph-root-evidence.json
          node scripts/run-graph-reclaim-reference.mjs
          update_evidence reclaimEvidence experiments/search-semantics-reference/build/graph-reclaim-evidence.json
          node scripts/run-graph-advance-occurrence-reference.mjs
          update_evidence advanceOccurrenceEvidence experiments/search-semantics-reference/build/graph-advance-occurrence-evidence.json
          node scripts/run-graph-cleanup-reference.mjs

          ./scripts/verify-docs.sh
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-edge-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node scripts/run-graph-path-reference.mjs
          node scripts/run-graph-root-reference.mjs
          node scripts/run-graph-reclaim-reference.mjs
          node scripts/run-graph-advance-occurrence-reference.mjs
          node scripts/run-graph-cleanup-reference.mjs
          node scripts/export-search-ir-composer-policy-profiles.mjs
          node scripts/run-policy-reference.mjs

          git diff --check
          changed="$(git diff --name-only)"
          allowed='^experiments/search-semantics-reference/fixtures/(neutral-schedules|domain-cases|graph-node-cases|graph-edge-cases|graph-ref-cases|graph-path-cases|graph-root-cases|graph-reclaim-cases|graph-advance-occurrence-cases|graph-cleanup-cases|policy-cases)\.json$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [[ -n "$bad" ]]; then
            printf 'unexpected evidence-rebind paths:\n%s\n' "$bad" >&2
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" = 11

          if git diff --quiet; then
            echo 'Evidence chain already rebound.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/search-semantics-reference/fixtures/*.json
          git commit -m 'test: rebind Policy evidence chain'
          git push origin HEAD:ref/policy-reference-01
