name: temporary Resource permanent wiring v2

on:
  push:
    branches: [ref/resource-01]

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ref/resource-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Wire permanent Resource peer gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = '.github/workflows/docs.yml';
          let source = readFileSync(path, 'utf8');
          const expr = (body) => '$' + '{{ ' + body + ' }}';
          function replaceOnce(before, after, label) {
            const matches = source.split(before).length - 1;
            if (matches !== 1) throw new Error(`${label}: expected one match, found ${matches}`);
            source = source.replace(before, after);
          }
          const resourceJob = `
  resource-reference:
    name: Resource reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer and Resource reference
        # Resource owns finite admission/accounting, pressure, exhaustion and cleanup semantics. Contributor policy, Progress scheduling and native/CUDA realization remain separate owners.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/run-resource-reference.mjs
      - name: Retain Resource evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-reference
          path: |
            experiments/search-ir-composer-reference/build/resource-profiles.json
            experiments/search-semantics-reference/build/resource-evidence.json
`;
          replaceOnce('\n  verify:\n', `${resourceJob}\n  verify:\n`, 'resource job insertion');
          replaceOnce('      - policy-reference\n    runs-on:', '      - policy-reference\n      - resource-reference\n    runs-on:', 'verify needs');
          const policyEnv = `          POLICY_RESULT: ${expr('needs.policy-reference.result')}\n`;
          replaceOnce(policyEnv, `${policyEnv}          RESOURCE_RESULT: ${expr('needs.resource-reference.result')}\n`, 'verify env');
          replaceOnce('          names=(GOVERNANCE SEARCH_IR GRAPH_NODE GRAPH_EDGE GRAPH_REF GRAPH_PATH GRAPH_ROOT GRAPH_RECLAIM GRAPH_ADVANCE_OCCURRENCE GRAPH_CLEANUP POLICY)\n', '          names=(GOVERNANCE SEARCH_IR GRAPH_NODE GRAPH_EDGE GRAPH_REF GRAPH_PATH GRAPH_ROOT GRAPH_RECLAIM GRAPH_ADVANCE_OCCURRENCE GRAPH_CLEANUP POLICY RESOURCE)\n', 'verify names');
          replaceOnce('            "$POLICY_RESULT"\n          )\n', '            "$POLICY_RESULT"\n            "$RESOURCE_RESULT"\n          )\n', 'verify results');
          writeFileSync(path, source);
          NODE
          git diff --check
      - name: Smoke Resource peer gate
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/run-resource-reference.mjs
      - name: Commit permanent gate and self-clean
        shell: bash
        run: |
          rm .github/workflows/temp-resource-permanent-wiring-v2.yml
          git diff --check
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add .github/workflows/docs.yml .github/workflows/temp-resource-permanent-wiring-v2.yml
          git commit -m "ci(resource): add fail-closed reference gate"
          git push origin HEAD:ref/resource-01
