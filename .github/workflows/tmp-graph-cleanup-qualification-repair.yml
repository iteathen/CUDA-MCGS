name: Temporary Graph cleanup qualification repair

on:
  push:
    branches:
      - tmp/graph-cleanup-qualification-repair-20260828

permissions:
  contents: write

jobs:
  repair-composer-count:
    if: github.event.head_commit.message == 'chore: stage graph cleanup qualification repair helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact guarded composer count repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'experiments/search-ir-composer-reference/run.mjs';
          const from = '  assert.deepEqual(countByStatus, { deferred: 52, partial: 904, pending: 33 });';
          const to = '  assert.deepEqual(countByStatus, { deferred: 52, partial: 908, pending: 29 });';
          const before = fs.readFileSync(file, 'utf8');
          const occurrences = before.split(from).length - 1;
          if (occurrences !== 1) {
            throw new Error(`expected exactly one stale coverage-count assertion; found ${occurrences}`);
          }
          const after = before.replace(from, to);
          if (after === before) {
            throw new Error('guarded replacement produced no change');
          }
          fs.writeFileSync(file, after);
          NODE

          git diff --check
          file='experiments/search-ir-composer-reference/run.mjs'
          expected=$'1\t1\t'"${file}"
          actual="$(git diff --numstat -- "${file}")"
          test "${actual}" = "${expected}"
          git diff -- "${file}" | grep -F -- '-  assert.deepEqual(countByStatus, { deferred: 52, partial: 904, pending: 33 });'
          git diff -- "${file}" | grep -F -- '+  assert.deepEqual(countByStatus, { deferred: 52, partial: 908, pending: 29 });'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${file}"
          git commit -m 'test: align Graph cleanup coverage count assertion'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
