name: Temporary Graph cleanup qualification repair

on:
  push:
    branches:
      - 'tmp/graph-cleanup-qualification-repair-20260828'

permissions:
  contents: write

jobs:
  repair-composer-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact guarded composer count repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'experiments/search-ir-composer-reference/run.mjs';
          const from = '  assert.deepEqual(countByStatus, { deferred: 52, partial: 904, pending: 33 });';
          const to = '  assert.deepEqual(countByStatus, { deferred: 52, partial: 908, pending: 29 });';
          const before = fs.readFileSync(file, 'utf8');
          const oldOccurrences = before.split(from).length - 1;
          const newOccurrences = before.split(to).length - 1;
          if (oldOccurrences === 0 && newOccurrences === 1) {
            console.log('composer count assertion is already repaired');
            process.exit(0);
          }
          if (oldOccurrences !== 1 || newOccurrences !== 0) {
            throw new Error(`expected one stale assertion and no repaired assertion; found old=${oldOccurrences} new=${newOccurrences}`);
          }
          fs.writeFileSync(file, before.replace(from, to));
          NODE

          file='experiments/search-ir-composer-reference/run.mjs'
          if git diff --quiet -- "${file}"; then
            echo 'No commit required; guarded repair already present.'
            exit 0
          fi

          git diff --check
          expected=$'1\t1\t'"${file}"
          actual="$(git diff --numstat -- "${file}")"
          test "${actual}" = "${expected}"
          git diff -- "${file}" | grep -F -- '-  assert.deepEqual(countByStatus, { deferred: 52, partial: 904, pending: 33 });'
          git diff -- "${file}" | grep -F -- '+  assert.deepEqual(countByStatus, { deferred: 52, partial: 908, pending: 29 });'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${file}"
          git commit -m 'test: align Graph cleanup coverage count assertion'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
