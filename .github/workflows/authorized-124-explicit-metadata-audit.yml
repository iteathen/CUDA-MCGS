name: authorized-124-explicit-metadata-audit

on:
  push:
    branches:
      - feature/124-explicit-runtime-metadata-audit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/124-explicit-runtime-metadata-audit
          fetch-depth: 0
      - name: Repair one-shot transport expectations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = '.github/authorized-124-explicit-metadata-audit.cjs';
          let s = fs.readFileSync(p, 'utf8');
          const one = (a, b) => {
            const n = s.split(a).length - 1;
            if (n !== 1) throw new Error(`transport repair expected 1 occurrence, found ${n}: ${a}`);
            s = s.replace(a, b);
          };
          one(
            "replaceCount(resourceTest, 'bindTensorEvaluatorProfileResources(programBound, runtime, connector)', 'bindTensorEvaluatorProfileResources(programBound, runtime)', 3);",
            "replaceCount(resourceTest, 'bindTensorEvaluatorProfileResources(programBound, runtime, connector)', 'bindTensorEvaluatorProfileResources(programBound, runtime)', 1);\nreplaceCount(resourceTest, 'bindTensorEvaluatorProfileResources(noWorkspace, runtime, connector)', 'bindTensorEvaluatorProfileResources(noWorkspace, runtime)', 1);\nreplaceCount(resourceTest, 'bindTensorEvaluatorProfileResources(conflictingResource, runtime, connector)', 'bindTensorEvaluatorProfileResources(conflictingResource, runtime)', 1);"
          );
          one(
            "replaceCount(resourceTest, 'binding.allocations', 'binding.resourceBindings', 7);",
            "replaceCount(resourceTest, 'binding.allocations', 'binding.resourceBindings', 10);"
          );
          one(
            "replaceCount(resourceTest, \"id.includes('runtime-control')\", \"representationRole === 'runtime-control'\", 1);\n",
            ''
          );
          one(
            "replaceCount(resourceTest, \"binding.allocations.length\", \"binding.resourceBindings.length\", 2);\n",
            ''
          );
          fs.writeFileSync(p, s);
          NODE
      - name: Apply fail-closed audit refactor
        run: node .github/authorized-124-explicit-metadata-audit.cjs
      - name: Remove one-shot transport
        run: git rm .github/authorized-124-explicit-metadata-audit.cjs .github/workflows/authorized-124-explicit-metadata-audit.yml
      - name: Syntax and focused qualification
        run: |
          node --check adapters/evaluators/cuda-js-tensor/src/runtime-contribution.mjs
          node --check adapters/evaluators/cuda-js-tensor/src/program-binding.mjs
          node --check adapters/evaluators/cuda-js-tensor/src/resource-binding.mjs
          node scripts/run-cuda-js-tensor-evaluator.mjs
      - name: Commit corrected candidate
        run: |
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "Replace inferred Tensor binding metadata with explicit ownership"
          git push origin HEAD:feature/124-explicit-runtime-metadata-audit
