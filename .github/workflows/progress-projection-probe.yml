name: Progress projection probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  progress-projection-probe:
    name: Progress projection probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Rebuild Composer and exact Progress projection
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-progress-profiles.mjs
      - name: Retain projection probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: progress-projection-probe
          path: experiments/search-ir-composer-reference/build/progress-profiles.json
