name: one-shot adjacent root authority reconciliation v3

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'docs/ref-root-control-01-reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ref-root-control-01-reconcile
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Reuse reconciliation with complete contract identity refresh
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const workflow = await readFile('.github/workflows/reconcile-adjacent-root-authority.yml', 'utf8');
          const marker = '        run: |\n';
          const start = workflow.indexOf(marker);
          if (start < 0) throw new Error('adjacent reconciliation run block not found');
          let script = workflow.slice(start + marker.length)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');

          const staleAnchor = "'output/observation, root-update reserve, diagnostics and selected capability/product resources compose under different finite profiles;'";
          const correctedAnchor = "'output/observation, reroot-admission reserve, diagnostics and selected capability/product resources compose under different finite profiles;'";
          if (!script.includes(staleAnchor)) throw new Error('SPEC-0011 stale anchor not found');
          script = script.replace(staleAnchor, correctedAnchor);

          const importBefore = "import { sourceTextSha256 } from './experiments/search-ir-composer-reference/src/validation.mjs';";
          const importAfter = "import { canonicalIdentity, sourceTextSha256 } from './experiments/search-ir-composer-reference/src/validation.mjs';";
          if (!script.includes(importBefore)) throw new Error('validation import anchor missing');
          script = script.replace(importBefore, importAfter);

          const frameworkAnchor = "const framework = JSON.parse(await readFile(frameworkPath, 'utf8'));";
          const frameworkRefresh = `${frameworkAnchor}\n          framework.contractSet.identity = canonicalIdentity(contractSet);\n          const contractById = new Map(contractSet.contracts.map((entry) => [entry.id, entry]));\n          const frameworkCatalog = contractById.get(framework.frameworkContract.id);\n          framework.frameworkContract = { kind: 'catalog', id: frameworkCatalog.id, specificationIdentity: frameworkCatalog.specificationIdentity, sha256: frameworkCatalog.sha256 };\n          for (const profile of framework.profiles) {\n            if (profile.contract.kind !== 'catalog') continue;\n            const catalog = contractById.get(profile.contract.id);\n            if (!catalog) throw new Error(\`missing catalog contract \${profile.contract.id}\`);\n            profile.contract = { kind: 'catalog', id: catalog.id, specificationIdentity: catalog.specificationIdentity, sha256: catalog.sha256 };\n          }`;
          if (!script.includes(frameworkAnchor)) throw new Error('framework fixture anchor missing');
          script = script.replace(frameworkAnchor, frameworkRefresh);

          const addMarker = 'git add -A';
          if (!script.includes(addMarker)) throw new Error('git add marker missing');
          script = script.replace(addMarker,
            "git rm .github/workflows/reconcile-adjacent-root-authority.yml .github/workflows/reconcile-adjacent-root-authority-v2.yml .github/workflows/reconcile-adjacent-root-authority-v3.yml\n" + addMarker);

          await writeFile('/tmp/reconcile-adjacent-root-authority-v3.sh', `set -euo pipefail\n${script}`, { mode: 0o700 });
          NODE
          bash /tmp/reconcile-adjacent-root-authority-v3.sh
