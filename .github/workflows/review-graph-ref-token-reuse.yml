name: Qualify Graph REF review corrections

on:
  push:
    branches: [ref/graph-ref-01]

permissions:
  contents: write

jobs:
  qualify:
    if: github.ref == 'refs/heads/ref/graph-ref-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ref/graph-ref-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Correct reusable protection tokens and explicit incarnation coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const input = fs.readFileSync(path, 'utf8');
            const first = input.indexOf(before);
            if (first < 0 || input.indexOf(before, first + 1) >= 0) throw new Error(`${path}: expected exactly one replacement target`);
            fs.writeFileSync(path, input.slice(0, first) + after + input.slice(first + before.length));
          }

          replaceOnce(
            'experiments/search-semantics-reference/src/graph-ref.mjs',
            `    if (BigInt(protections.length) >= protectionSlots) return freeze({ kind: 'pressure', code: 'protection-capacity' }, 'Graph protection pressure');
    const slot = protections.length;
    const token = freeze({ id: \`protection.\${slot}\`, generation: '0' }, 'Graph protection token');
    const entry = { token, owner: input.owner, reference: validated.reference, referenceKey: key, state: 'held' };
    protections.push(entry);
    emit('protection-acquired', { owner: input.owner, reference: validated.reference, token });
    return freeze({ kind: 'protected', token }, 'Graph protection acquisition');`,
            `    let entry = protections.find((candidate) => candidate.state === 'released'
      && decimal(candidate.token.generation, 'GRAPH_REF_PROTECTION', 'protection generation') < ranges.generation);
    if (entry) {
      entry.token = freeze({
        id: entry.token.id,
        generation: toDecimal(decimal(entry.token.generation, 'GRAPH_REF_PROTECTION', 'protection generation') + 1n),
      }, 'Graph protection token');
    } else {
      if (BigInt(protections.length) >= protectionSlots) {
        const generationExhausted = protections.length > 0 && protections.every((candidate) => candidate.state === 'released'
          && decimal(candidate.token.generation, 'GRAPH_REF_PROTECTION', 'protection generation') === ranges.generation);
        return generationExhausted
          ? freeze({ kind: 'exhausted', code: 'generation-exhausted' }, 'Graph protection generation exhaustion')
          : freeze({ kind: 'pressure', code: 'protection-capacity' }, 'Graph protection pressure');
      }
      const slot = protections.length;
      entry = {
        token: freeze({ id: \`protection.\${slot}\`, generation: '0' }, 'Graph protection token'),
        owner: null,
        reference: null,
        referenceKey: null,
        state: 'released',
      };
      protections.push(entry);
    }
    entry.owner = input.owner;
    entry.reference = validated.reference;
    entry.referenceKey = key;
    entry.state = 'held';
    emit('protection-acquired', { owner: input.owner, reference: validated.reference, token: entry.token });
    return freeze({ kind: 'protected', token: entry.token }, 'Graph protection acquisition');`,
          );

          replaceOnce(
            'experiments/search-semantics-reference/src/graph-ref.mjs',
            `  function releaseProtection(input) {
    if (!isRecord(input) || Object.keys(input).length !== 1 || !Object.hasOwn(input, 'token') || !isRecord(input.token)) return invalid('stale-reference');
    const token = protections.find((entry) => entry.token.id === input.token.id && entry.token.generation === input.token.generation);
    if (!token || token.state !== 'held') return invalid('stale-reference');
    token.state = 'released';
    emit('protection-released', { owner: token.owner, reference: token.reference, token: token.token });
    return freeze({ kind: 'released', token: token.token }, 'Graph protection release');
  }`,
            `  function releaseProtection(input) {
    if (!isRecord(input) || Object.keys(input).length !== 1 || !Object.hasOwn(input, 'token') || !isRecord(input.token)) return invalid('stale-reference');
    const tokenKeys = Object.keys(input.token).sort();
    if (tokenKeys.length !== 2 || tokenKeys[0] !== 'generation' || tokenKeys[1] !== 'id') return invalid('stale-reference');
    const slot = protections.find((entry) => entry.token.id === input.token.id);
    if (!slot || slot.state !== 'held' || slot.token.generation !== input.token.generation) return invalid('stale-reference');
    slot.state = 'released';
    emit('protection-released', { owner: slot.owner, reference: slot.reference, token: slot.token });
    return freeze({ kind: 'released', token: slot.token }, 'Graph protection release');
  }`,
          );

          replaceOnce(
            'experiments/search-semantics-reference/src/graph-ref-cases.mjs',
            `  defineCase('graph-ref-consumes-current-node-reference-shape', () => {`,
            `  defineCase('graph-ref-arena-incarnation-mismatch-is-typed-and-side-effect-free', () => {
    const profile = profileById(projection);
    const ready = readyState(profile, 'state-node');
    let resolverCalls = 0;
    const oracle = createGraphReferenceOracle({
      profile,
      resolveSlotState: ({ kind, slot }) => {
        resolverCalls += 1;
        return { kind, arena: '8', slot, generation: '11', lifecycleState: ready };
      },
    });
    expectInvalid(oracle.validateReference({
      expectedKind: 'state-node',
      reference: { kind: 'state-node', arena: '7', slot: '9', generation: '11' },
    }), 'arena-incarnation-mismatch');
    assert.equal(resolverCalls, 1);
    assert.equal(oracle.snapshot().events.length, 0);
    return { resolverCalls, semanticSideEffects: 0, code: 'arena-incarnation-mismatch' };
  }, ['GRAPH-REF-001', 'GRAPH-REF-006']);

  defineCase('graph-ref-consumes-current-node-reference-shape', () => {`,
          );

          replaceOnce(
            'experiments/search-semantics-reference/src/graph-ref-cases.mjs',
            `    assert.equal(oracle.acquireProtection({ expectedKind: 'state-node', owner: 'a', reference: one }).kind, 'protected');
    assert.deepEqual(oracle.acquireProtection({ expectedKind: 'state-node', owner: 'b', reference: two }), { kind: 'pressure', code: 'protection-capacity' });
    assert.equal(oracle.snapshot().limits.protectionSlots, '1');
    return { protectionSlots: '1', pressure: 'protection-capacity' };`,
            `    const first = oracle.acquireProtection({ expectedKind: 'state-node', owner: 'a', reference: one });
    assert.equal(first.kind, 'protected');
    assert.deepEqual(oracle.acquireProtection({ expectedKind: 'state-node', owner: 'b', reference: two }), { kind: 'pressure', code: 'protection-capacity' });
    assert.equal(oracle.releaseProtection({ token: first.token }).kind, 'released');
    const reused = oracle.acquireProtection({ expectedKind: 'state-node', owner: 'b', reference: two });
    assert.equal(reused.kind, 'protected');
    assert.equal(reused.token.id, first.token.id);
    assert.equal(reused.token.generation, '1');
    expectInvalid(oracle.releaseProtection({ token: first.token }), 'stale-reference');
    assert.equal(oracle.releaseProtection({ token: reused.token }).kind, 'released');
    assert.equal(oracle.snapshot().limits.protectionSlots, '1');
    return { protectionSlots: '1', pressure: 'protection-capacity', reusedGeneration: reused.token.generation };`,
          );

          const fixturePath = 'experiments/search-semantics-reference/fixtures/graph-ref-cases.json';
          const fixture = JSON.parse(fs.readFileSync(fixturePath, 'utf8'));
          const after = 'graph-ref-validates-kind-arena-slot-generation-and-lifecycle-before-use';
          const inserted = 'graph-ref-arena-incarnation-mismatch-is-typed-and-side-effect-free';
          const index = fixture.expectedCases.indexOf(after);
          if (index < 0 || fixture.expectedCases.includes(inserted)) throw new Error('Graph REF expected case insertion precondition failed');
          fixture.expectedCases.splice(index + 1, 0, inserted);
          fs.writeFileSync(fixturePath, `${JSON.stringify(fixture, null, 2)}\n`);
          NODE

          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('experiments/search-semantics-reference/build/graph-ref-evidence.json', 'utf8'));
          if (evidence.status !== 'pass' || evidence.summary.passed !== 14 || evidence.graphRefRequirementCoverage.executedRequirementCount !== 8) {
            throw new Error('Graph REF review correction did not qualify 14/14 and 8/8');
          }
          console.log(`qualified_ref=${evidence.evidenceIdentity.sha256} bytes=${evidence.evidenceIdentity.byteLength}`);
          NODE
          node scripts/run-graph-edge-reference.mjs
          ./scripts/verify-docs.sh

          git rm --ignore-unmatch .github/workflows/review-graph-ref-token-reuse.yml
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add experiments/search-semantics-reference/src/graph-ref.mjs \
            experiments/search-semantics-reference/src/graph-ref-cases.mjs \
            experiments/search-semantics-reference/fixtures/graph-ref-cases.json
          git commit -m "ref: make Graph protection slots safely reusable"
          git push origin HEAD:ref/graph-ref-01
