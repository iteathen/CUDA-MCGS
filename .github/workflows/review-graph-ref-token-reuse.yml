name: Qualify Graph REF review corrections

on:
  push:
    branches:
      - ref/graph-ref-01

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ref/graph-ref-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Apply and qualify Graph REF review corrections
        run: node tools/graph-ref-review-correction.mjs
      - name: Publish qualified correction and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/review-graph-ref-token-reuse.yml \
            .github/graph-ref-review-trigger.txt \
            tools/graph-ref-review-correction.mjs
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add \
            experiments/search-semantics-reference/src/graph-ref.mjs \
            experiments/search-semantics-reference/src/graph-ref-cases.mjs \
            experiments/search-semantics-reference/fixtures/graph-ref-cases.json
          git commit -m "ref: make Graph protection slots safely reusable"
          git push origin HEAD:ref/graph-ref-01
