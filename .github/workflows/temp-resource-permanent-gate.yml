name: temporary Resource permanent gate

on:
  push:
    branches: [ref/resource-01]

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ref/resource-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Patch permanent peer gate
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/resource-gate-patch.mjs
          node /tmp/resource-gate-patch.mjs
          git diff --check
      - name: Smoke permanent Resource gate
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/run-resource-reference.mjs
      - name: Commit permanent gate and self-clean
        shell: bash
        run: |
          rm .github/workflows/temp-resource-permanent-gate.yml
          git diff --check
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add .github/workflows/docs.yml .github/workflows/temp-resource-permanent-gate.yml
          git commit -m "ci(resource): add fail-closed reference gate"
          git push origin HEAD:ref/resource-01
