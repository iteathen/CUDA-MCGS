name: Operation access evidence scan

on:
  push:
    branches:
      - impl/199-operation-local-access-projection
    paths:
      - '.github/workflows/operation-access-evidence-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: impl/199-operation-local-access-projection
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Enumerate exact stale evidence anchors
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import path from 'node:path';

          const oldDigest = 'd8b6890ae4fc18e39618cd172e59fd0dedad465e48ae80e5442142235be7c4b4';
          const excluded = new Set(['.git', 'node_modules', 'build']);
          const matches = [];

          async function walk(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              if (excluded.has(entry.name)) continue;
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                await walk(target);
                continue;
              }
              let text;
              try { text = await readFile(target, 'utf8'); } catch { continue; }
              if (text.includes(oldDigest)) matches.push(target.replaceAll('\\', '/'));
            }
          }

          await walk('.');
          matches.sort();
          for (const match of matches) console.log(`stale_composer_evidence=${match}`);
          console.log(`stale_composer_evidence_count=${matches.length}`);
          if (matches.length === 0) throw new Error('expected at least one stale Composer evidence anchor');
          NODE
