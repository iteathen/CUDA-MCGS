name: Operation access evidence repair

on:
  push:
    branches:
      - impl/199-operation-local-access-projection
    paths:
      - '.github/workflows/operation-access-evidence-scan.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'iteathen/CUDA-MCGS' && github.ref == 'refs/heads/impl/199-operation-local-access-projection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: impl/199-operation-local-access-projection
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Regenerate and rebind exact evidence identities
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync, statSync, unlinkSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';

          const repositoryRoot = process.cwd();
          const fixtureDirectory = path.join(repositoryRoot, 'experiments', 'search-semantics-reference', 'fixtures');
          const composerBuildDirectory = path.join(repositoryRoot, 'experiments', 'search-ir-composer-reference', 'build');
          const gatePath = path.join(repositoryRoot, 'experiments', 'search-semantics-reference', 'run-integration-gate.mjs');
          const helperPath = path.join(repositoryRoot, '.github', 'workflows', 'operation-access-evidence-scan.yml');

          function run(relativePath) {
            console.log(`evidence_step=${relativePath}`);
            const result = spawnSync(process.execPath, [path.join(repositoryRoot, relativePath)], {
              cwd: repositoryRoot,
              stdio: 'inherit',
              env: process.env,
            });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`${relativePath} failed with ${result.status}`);
          }

          function readJson(absolutePath) {
            return JSON.parse(readFileSync(absolutePath, 'utf8'));
          }

          function writeJson(absolutePath, value) {
            writeFileSync(absolutePath, `${JSON.stringify(value, null, 2)}\n`);
          }

          function identityOf(id, evidence) {
            if (id === 'composer') return evidence.representationCompositionEvidenceKey;
            if (id === 'search-ir') return evidence.searchIrIdentity;
            return evidence.evidenceIdentity;
          }

          function sameIdentity(value, identity) {
            return value && typeof value === 'object' && !Array.isArray(value)
              && value.algorithm === identity.algorithm
              && value.byteLength === identity.byteLength
              && value.sha256 === identity.sha256;
          }

          function replaceIdentity(value, prior, next) {
            let changed = false;
            if (sameIdentity(value, prior)) {
              value.algorithm = next.algorithm;
              value.byteLength = next.byteLength;
              value.sha256 = next.sha256;
              changed = true;
            }
            if (Array.isArray(value)) {
              for (const item of value) changed = replaceIdentity(item, prior, next) || changed;
            } else if (value && typeof value === 'object') {
              for (const item of Object.values(value)) changed = replaceIdentity(item, prior, next) || changed;
            }
            return changed;
          }

          const fixturePaths = readdirSync(fixtureDirectory)
            .filter((name) => name.endsWith('.json'))
            .sort()
            .map((name) => path.join(fixtureDirectory, name));
          const fixtures = new Map(fixturePaths.map((absolutePath) => [absolutePath, readJson(absolutePath)]));

          function flushFixtures() {
            for (const [absolutePath, fixture] of fixtures) writeJson(absolutePath, fixture);
          }

          function replaceInFixtures(prior, next, label) {
            const changed = [];
            for (const [absolutePath, fixture] of fixtures) {
              if (replaceIdentity(fixture, prior, next)) changed.push(path.basename(absolutePath));
            }
            changed.sort();
            console.log(`evidence_rebind=${label} files=${changed.join(',') || 'none'}`);
            flushFixtures();
          }

          const gateText = readFileSync(gatePath, 'utf8');
          const identityStartMarker = 'const frozenEvidenceIdentities = ';
          const identityEndMarker = ';\n\nconst requiredComposerWitnesses';
          const identityStart = gateText.indexOf(identityStartMarker);
          const identityEnd = gateText.indexOf(identityEndMarker, identityStart + identityStartMarker.length);
          if (identityStart < 0 || identityEnd < 0) throw new Error('cannot locate frozen evidence identities');
          const oldIdentities = JSON.parse(gateText.slice(identityStart + identityStartMarker.length, identityEnd));

          run('scripts/run-search-ir-reference.mjs');
          run('scripts/run-search-ir-composer-reference.mjs');
          for (const exporter of [
            'scripts/export-search-ir-composer-domain-profiles.mjs',
            'scripts/export-search-ir-composer-evaluator-profiles.mjs',
            'scripts/export-search-ir-composer-graph-profiles.mjs',
            'scripts/export-search-ir-composer-output-profiles.mjs',
            'scripts/export-search-ir-composer-policy-profiles.mjs',
            'scripts/export-search-ir-composer-progress-profiles.mjs',
            'scripts/export-search-ir-composer-resource-profiles.mjs',
            'scripts/export-search-ir-composer-session-profiles.mjs',
            'scripts/export-search-ir-composer-stage-profiles.mjs',
          ]) run(exporter);

          const integrationFixture = fixtures.get(path.join(fixtureDirectory, 'integration-cases.json'));
          if (!integrationFixture) throw new Error('integration fixture missing');
          const evidenceDescriptorById = new Map(integrationFixture.evidenceInputs.map((entry) => [entry.id, entry]));
          const newIdentities = {};

          for (const id of ['search-ir', 'composer']) {
            const descriptor = evidenceDescriptorById.get(id);
            const evidence = readJson(path.join(repositoryRoot, descriptor.path));
            newIdentities[id] = identityOf(id, evidence);
            replaceInFixtures(oldIdentities[id], newIdentities[id], id);
          }

          const projectionBySchema = new Map();
          function collectProjectionObjects(value) {
            if (Array.isArray(value)) {
              for (const item of value) collectProjectionObjects(item);
              return;
            }
            if (!value || typeof value !== 'object') return;
            if (typeof value.schema === 'string' && value.projectionIdentity && typeof value.projectionIdentity === 'object') {
              projectionBySchema.set(value.schema, value.projectionIdentity);
            }
            for (const item of Object.values(value)) collectProjectionObjects(item);
          }
          function scanGenerated(directory) {
            for (const name of readdirSync(directory)) {
              const absolutePath = path.join(directory, name);
              if (statSync(absolutePath).isDirectory()) scanGenerated(absolutePath);
              else if (name.endsWith('.json')) collectProjectionObjects(readJson(absolutePath));
            }
          }
          scanGenerated(composerBuildDirectory);

          function refreshProjectionIdentity(value) {
            let changed = false;
            if (Array.isArray(value)) {
              for (const item of value) changed = refreshProjectionIdentity(item) || changed;
              return changed;
            }
            if (!value || typeof value !== 'object') return false;
            const projection = typeof value.schema === 'string' ? projectionBySchema.get(value.schema) : null;
            if (projection && Object.hasOwn(value, 'algorithm') && Object.hasOwn(value, 'byteLength') && Object.hasOwn(value, 'sha256')) {
              if (value.algorithm !== projection.algorithm || value.byteLength !== projection.byteLength || value.sha256 !== projection.sha256) {
                value.algorithm = projection.algorithm;
                value.byteLength = projection.byteLength;
                value.sha256 = projection.sha256;
                changed = true;
              }
            }
            for (const item of Object.values(value)) changed = refreshProjectionIdentity(item) || changed;
            return changed;
          }
          const projectionChanged = [];
          for (const [absolutePath, fixture] of fixtures) {
            if (refreshProjectionIdentity(fixture)) projectionChanged.push(path.basename(absolutePath));
          }
          projectionChanged.sort();
          console.log(`projection_rebind_files=${projectionChanged.join(',') || 'none'}`);
          flushFixtures();

          const ownerCommands = [
            ['domain', 'scripts/run-search-semantics-reference.mjs'],
            ['graph-node', 'scripts/run-graph-node-reference.mjs'],
            ['graph-edge', 'scripts/run-graph-edge-reference.mjs'],
            ['graph-ref', 'scripts/run-graph-ref-reference.mjs'],
            ['graph-path', 'scripts/run-graph-path-reference.mjs'],
            ['graph-root', 'scripts/run-graph-root-reference.mjs'],
            ['graph-reclaim', 'scripts/run-graph-reclaim-reference.mjs'],
            ['graph-advance', 'scripts/run-graph-advance-occurrence-reference.mjs'],
            ['graph-cleanup', 'scripts/run-graph-cleanup-reference.mjs'],
            ['policy', 'scripts/run-policy-reference.mjs'],
            ['evaluator', 'scripts/run-evaluator-reference.mjs'],
            ['resource', 'scripts/run-resource-reference.mjs'],
            ['progress', 'scripts/run-progress-reference.mjs'],
            ['output', 'scripts/run-output-reference.mjs'],
            ['framework', 'scripts/run-framework-lifecycle-reference.mjs'],
            ['terminal', 'scripts/run-terminal-slice-reference.mjs'],
            ['session', 'scripts/run-session-reference.mjs'],
            ['stage', 'scripts/run-stage-reference.mjs'],
            ['channel', 'scripts/run-channel-reference-evidence.mjs'],
          ];

          for (const [id, command] of ownerCommands) {
            run(command);
            const descriptor = evidenceDescriptorById.get(id);
            if (!descriptor) throw new Error(`missing evidence descriptor for ${id}`);
            const evidence = readJson(path.join(repositoryRoot, descriptor.path));
            newIdentities[id] = identityOf(id, evidence);
            replaceInFixtures(oldIdentities[id], newIdentities[id], id);
          }

          const orderedIdentities = {};
          for (const id of Object.keys(oldIdentities)) {
            if (!newIdentities[id]) throw new Error(`new identity missing for ${id}`);
            orderedIdentities[id] = newIdentities[id];
          }
          const updatedGate = gateText.slice(0, identityStart + identityStartMarker.length)
            + JSON.stringify(orderedIdentities, null, 2)
            + gateText.slice(identityEnd);
          writeFileSync(gatePath, updatedGate);

          run('experiments/search-semantics-reference/run-integration-gate.mjs');

          const staleComposer = oldIdentities.composer.sha256;
          const activePaths = [...fixturePaths, gatePath];
          const stalePaths = activePaths.filter((absolutePath) => readFileSync(absolutePath, 'utf8').includes(staleComposer));
          if (stalePaths.length !== 0) throw new Error(`stale Composer identities remain: ${stalePaths.join(', ')}`);

          unlinkSync(helperPath);
          NODE
      - name: Full local qualification
        shell: bash
        run: |
          git diff --check
          ./scripts/verify-docs.sh
          node scripts/run-engine-reference-integration.mjs
      - name: Commit evidence rebind and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -s -m 'Evidence: rebind operation-local access identities'
          git push origin HEAD:impl/199-operation-local-access-projection
