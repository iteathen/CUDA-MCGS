name: dev-202-green

on:
  push:
    branches:
      - tmp/202-sideband-clean-construction
    paths:
      - scripts/dev-202-green.mjs
      - .github/workflows/dev-202-green.yml

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/202-sideband-clean-construction
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Repair discarded-helper typo and apply semantic patch
        shell: bash
        run: |
          sed -i 's/delectionRecord\.properties/deletionRecord.properties/' scripts/dev-202-green.mjs
          node scripts/dev-202-green.mjs
      - name: Preserve existing verifier and Composer invariants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const accessPath = 'experiments/search-ir-composer-reference/verify-operation-local-access.mjs';
          let access = fs.readFileSync(accessPath, 'utf8');
          const accessReplacements = new Map([
            ["program.normalized.operations[0].bindings[0].source.access", "program.normalized.operations[0].bindings.find(({ parameter }) => parameter === 'output').source.access"],
            ["execution.normalized.cudaJsAdapter.operationRequirements[0].bindings[0].source.access", "execution.normalized.cudaJsAdapter.operationRequirements[0].bindings.find(({ parameter }) => parameter === 'output').source.access"],
            ["normalizeCase(['read'], 'read').normalized.normalized.operations[0].bindings[0].source.access", "normalizeCase(['read'], 'read').normalized.normalized.operations[0].bindings.find(({ parameter }) => parameter === 'output').source.access"],
            ["normalizeCase(['read', 'write'], 'read-write').normalized.normalized.operations[0].bindings[0].source.access", "normalizeCase(['read', 'write'], 'read-write').normalized.normalized.operations[0].bindings.find(({ parameter }) => parameter === 'output').source.access"],
            ["Object.hasOwn(historical.normalized.normalized.operations[0].bindings[0].source, 'access')", "Object.hasOwn(historical.normalized.normalized.operations[0].bindings.find(({ parameter }) => parameter === 'output').source, 'access')"],
          ]);
          for (const [from, to] of accessReplacements) {
            if (!access.includes(from)) throw new Error(`missing #199 verifier seam: ${from}`);
            access = access.replace(from, to);
          }
          fs.writeFileSync(accessPath, access);

          for (const path of [
            'experiments/search-ir-composer-reference/src/program-package.mjs',
            'experiments/search-ir-composer-reference/src/program-package-fixtures.mjs',
            'experiments/search-ir-composer-reference/verify-external-control-sideband-authority.mjs',
            'schemas/search-ir/0.2.0/program-package-profile.schema.json',
            'schemas/search-ir/0.2.0/execution-package.schema.json',
          ]) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes('payloadResource')) throw new Error(`missing sideband resident-resource rename seam: ${path}`);
            fs.writeFileSync(path, source.replaceAll('payloadResource', 'residentResource'));
          }

          const composerPath = 'experiments/search-ir-composer-reference/src/composer.mjs';
          let composer = fs.readFileSync(composerPath, 'utf8');
          const createOld = "  exactKeys(profileTemplate, PROFILE_TEMPLATE_FIELDS, 'COMPOSER_PROFILE_TEMPLATE_FIELDS', 'program-package profile template');";
          const createNew = "  const templateFields = [...PROFILE_TEMPLATE_FIELDS];\n  if (Object.hasOwn(profileTemplate, 'sidebands')) templateFields.splice(templateFields.indexOf('operations'), 0, 'sidebands');\n  exactKeys(profileTemplate, templateFields, 'COMPOSER_PROFILE_TEMPLATE_FIELDS', 'program-package profile template');";
          const normalizeOld = "  exactKeys(input.profile, [...PROFILE_TEMPLATE_FIELDS, 'generator'], 'COMPOSER_PROFILE_FIELDS', 'resolved program-package profile');";
          const normalizeNew = "  const profileFields = [...PROFILE_TEMPLATE_FIELDS];\n  if (Object.hasOwn(input.profile, 'sidebands')) profileFields.splice(profileFields.indexOf('operations'), 0, 'sidebands');\n  exactKeys(input.profile, [...profileFields, 'generator'], 'COMPOSER_PROFILE_FIELDS', 'resolved program-package profile');";
          if (!composer.includes(createOld) || !composer.includes(normalizeOld)) throw new Error('missing resolved Composer optional-sideband seam');
          composer = composer.replace(createOld, createNew).replace(normalizeOld, normalizeNew);
          fs.writeFileSync(composerPath, composer);
          NODE
      - name: Apply evidence-based Session and adapter-boundary fixes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fixturePath = 'experiments/search-ir-composer-reference/src/program-package-fixtures.mjs';
          let fixture = fs.readFileSync(fixturePath, 'utf8');
          const oldClassFilter = "const classes = resource.classes?.filter(({ contributor: owner, lifetime }) => owner === contributor.id && lifetime === 'session') ?? [];";
          const newClassFilter = "const classes = resource.classes?.filter(({ contributor: owner, lifetime, formula }) => owner === contributor.id && lifetime === 'session' && formula.basis === 'maximum-live') ?? [];";
          if (!fixture.includes(oldClassFilter)) throw new Error('missing Session maximum-live resource seam');
          fixture = fixture.replace(oldClassFilter, newClassFilter);
          fs.writeFileSync(fixturePath, fixture);

          const runPath = 'experiments/search-ir-composer-reference/run.mjs';
          let run = fs.readFileSync(runPath, 'utf8');
          const oldSerialized = "  const serialized = JSON.stringify(adapter);";
          const newSerialized = "  const { searchProgram, ...adapterControlRequirements } = adapter;\n  const serialized = JSON.stringify(adapterControlRequirements);\n  assert.ok(searchProgram.source.includes('gpu.mailbox.loadAcquireSystem'));";
          if (!run.includes(oldSerialized)) throw new Error('missing adapter lifecycle guard seam');
          run = run.replace(oldSerialized, newSerialized);
          fs.writeFileSync(runPath, run);
          NODE
      - name: Qualify focused Composer and permanent sideband verifier
        run: node scripts/run-search-ir-composer-reference.mjs
      - name: Publish temp semantic candidate
        shell: bash
        run: |
          rm -f scripts/dev-202-green.mjs .github/workflows/dev-202-green.yml .github/workflows/construct-202-sideband.yml .github/workflows/construct-202-sideband-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Temp: #202 qualified semantic candidate"
          git push origin HEAD:tmp/202-sideband-clean-construction
