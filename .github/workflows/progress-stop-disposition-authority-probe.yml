name: Progress stop disposition authority probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  progress-stop-disposition-authority-probe:
    name: Graph REF evidence rebind construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/36-progress-stop-disposition-authority
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Rebind Graph REF evidence authority
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'experiments/search-semantics-reference/fixtures';
          const before = '0f91b1ee1584b1e71e84948624c3c861974b03814d0e9accac7426b5794f9449';
          const after = '4baeaf489b8165a8e6ef3171e47a99970f4962d877b96131d16f308e650586f8';
          const expected = new Map([
            ['graph-advance-occurrence-cases.json', 1],
            ['graph-cleanup-cases.json', 1],
            ['graph-path-cases.json', 1],
            ['graph-reclaim-cases.json', 1],
            ['graph-root-cases.json', 1],
          ]);
          const actual = new Map();
          for (const name of fs.readdirSync(root).sort()) {
            const full = path.join(root, name);
            if (!fs.statSync(full).isFile()) continue;
            const text = fs.readFileSync(full, 'utf8');
            const count = text.split(before).length - 1;
            if (count > 0) actual.set(name, count);
          }
          if (JSON.stringify([...actual]) !== JSON.stringify([...expected])) {
            throw new Error(`stale Graph REF evidence occurrence set drifted: ${JSON.stringify([...actual])}`);
          }
          for (const [name] of actual) {
            const full = path.join(root, name);
            fs.writeFileSync(full, fs.readFileSync(full, 'utf8').split(before).join(after));
          }
          console.log(`graph_ref_evidence_rebind files=${actual.size} occurrences=${[...actual.values()].reduce((sum, count) => sum + count, 0)}`);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/search-semantics-reference/fixtures
          git diff --cached --quiet && { echo 'expected Graph REF evidence rebind diff is empty' >&2; exit 1; }
          git commit -m "test(graph): rebind REF evidence authority"
          git push origin HEAD:fix/36-progress-stop-disposition-authority
