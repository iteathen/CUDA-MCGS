name: Progress stop disposition authority probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  progress-stop-disposition-authority-probe:
    name: Progress stop disposition authority red probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Prove frozen Composer still accepts the current profiles
        run: node scripts/run-search-ir-composer-reference.mjs
      - name: Falsify stop-disposition terminal authority
        run: node experiments/search-ir-composer-reference/probe-progress-stop-disposition-authority.mjs
