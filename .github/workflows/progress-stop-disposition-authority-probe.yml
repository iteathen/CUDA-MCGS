name: Progress stop disposition authority probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  progress-stop-disposition-authority-probe:
    name: Graph NODE evidence rebind construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/36-progress-stop-disposition-authority
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Rebind Graph NODE evidence authority
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'experiments/search-semantics-reference/fixtures';
          const before = '9c814f4d2560fe43cae105c36872be52d245a370a57885ade09e11509c53f9dc';
          const after = '27c0d5d25526bc98990ad997c5d83c944af352fbd4b6a2b005f22fcee08ab275';
          const expected = new Map([
            ['graph-advance-occurrence-cases.json', 1],
            ['graph-cleanup-cases.json', 1],
            ['graph-edge-cases.json', 1],
            ['graph-path-cases.json', 1],
            ['graph-reclaim-cases.json', 1],
            ['graph-ref-cases.json', 1],
            ['graph-root-cases.json', 1],
          ]);
          const actual = new Map();
          for (const name of fs.readdirSync(root).sort()) {
            const full = path.join(root, name);
            if (!fs.statSync(full).isFile()) continue;
            const text = fs.readFileSync(full, 'utf8');
            const count = text.split(before).length - 1;
            if (count > 0) actual.set(name, count);
          }
          if (JSON.stringify([...actual]) !== JSON.stringify([...expected])) {
            throw new Error(`stale Graph NODE evidence occurrence set drifted: ${JSON.stringify([...actual])}`);
          }
          for (const [name] of actual) {
            const full = path.join(root, name);
            fs.writeFileSync(full, fs.readFileSync(full, 'utf8').split(before).join(after));
          }
          console.log(`graph_node_evidence_rebind files=${actual.size} occurrences=${[...actual.values()].reduce((sum, count) => sum + count, 0)}`);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/search-semantics-reference/fixtures
          git diff --cached --quiet && { echo 'expected Graph NODE evidence rebind diff is empty' >&2; exit 1; }
          git commit -m "test(graph): rebind NODE evidence authority"
          git push origin HEAD:fix/36-progress-stop-disposition-authority
