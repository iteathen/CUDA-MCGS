name: "Authorized #124 runtime transport"

on:
  push:
    branches:
      - feature/124-evaluator-runtime

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Materialize exact #124 candidate and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workflow=.github/workflows/authorized-124-runtime-transport.yml
          transport=.github/authorized-124-runtime-transport
          runtime=adapters/evaluators/cuda-js-tensor/src/runtime-contribution.mjs
          oracle=conformance/cuda-js-tensor-evaluator/runtime.mjs

          mkdir -p "$(dirname "$runtime")" "$(dirname "$oracle")"
          cat "$transport"/runtime-contribution.part-* | base64 -d | gzip -d > "$runtime"
          cat "$transport"/runtime-conformance.part-* | base64 -d | gzip -d > "$oracle"

          write_blob() {
            local path="$1"
            local sha="$2"
            mkdir -p "$(dirname "$path")"
            node --input-type=module - "$path" "$sha" <<'NODE'
          import fs from 'node:fs';
          const [path, sha] = process.argv.slice(2);
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) throw new Error(`blob ${sha}: HTTP ${response.status}`);
          const blob = await response.json();
          if (blob.sha !== sha || blob.encoding !== 'base64') throw new Error(`blob ${sha}: identity/encoding mismatch`);
          fs.writeFileSync(path, Buffer.from(blob.content.replace(/\n/g, ''), 'base64'));
          NODE
            test "$(git hash-object "$path")" = "$sha"
          }

          write_blob adapters/evaluators/cuda-js-tensor/index.mjs aba7284eddde40111e16d799bb7e771dd15e37b9
          write_blob scripts/run-cuda-js-tensor-evaluator.mjs 29aecb43d940b9a3aaf20904fe23448153c02de6
          write_blob conformance/cuda-js-tensor-evaluator/package.mjs f5d92c273438fe8d0427d391de72318e85f6e6b7
          write_blob adapters/evaluators/cuda-js-tensor/README.md fcc359111564f5b352b81e7d02b7610504c7841d
          write_blob conformance/cuda-js-tensor-evaluator/README.md 500bd2431cf364961693989529ba99e8c12649f3
          write_blob adapters/evaluators/cuda-js-tensor/component.yaml 5ae64975741227fb7402a40aed310de8e9f60fa4

          test "$(git hash-object "$runtime")" = d2f188ee7f3a16c2f7aa2f2de60fbe756008a9db
          test "$(git hash-object "$oracle")" = 67e7744589314469217412622cfce059bd6e0d2d
          node --check "$runtime"
          node --check "$oracle"
          node -e "JSON.parse(require('node:fs').readFileSync('adapters/evaluators/cuda-js-tensor/component.yaml','utf8'))"
          node scripts/run-cuda-js-tensor-evaluator.mjs

          rm -- "$workflow"
          rm -rf -- "$transport"

          allowed='^(adapters/evaluators/cuda-js-tensor/(README\.md|component\.yaml|index\.mjs|src/runtime-contribution\.mjs)|conformance/cuda-js-tensor-evaluator/(README\.md|package\.mjs|runtime\.mjs)|scripts/run-cuda-js-tensor-evaluator\.mjs|\.github/workflows/authorized-124-runtime-transport\.yml|\.github/authorized-124-runtime-transport/)'
          while IFS= read -r changed; do
            path="${changed:3}"
            if [[ ! "$path" =~ $allowed ]]; then
              echo "unexpected working-tree path: $path" >&2
              exit 1
            fi
          done < <(git status --porcelain=v1 --untracked-files=all)

          git add -A -- \
            adapters/evaluators/cuda-js-tensor/README.md \
            adapters/evaluators/cuda-js-tensor/component.yaml \
            adapters/evaluators/cuda-js-tensor/index.mjs \
            adapters/evaluators/cuda-js-tensor/src/runtime-contribution.mjs \
            conformance/cuda-js-tensor-evaluator/README.md \
            conformance/cuda-js-tensor-evaluator/package.mjs \
            conformance/cuda-js-tensor-evaluator/runtime.mjs \
            scripts/run-cuda-js-tensor-evaluator.mjs \
            "$workflow" "$transport"
          git diff --cached --check

          git config user.name "OpenAI authorized project agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add device-owned Tensor evaluator runtime contribution"

          # This package falsifier requires candidate bytes to be HEAD, so run it
          # after the local candidate commit but before publishing the branch.
          node conformance/cuda-js-tensor-evaluator/package.mjs
          git push origin HEAD:refs/heads/feature/124-evaluator-runtime
