name: Temporary Graph cleanup evidence rebind

on:
  push:
    branches:
      - 'tmp/graph-cleanup-qualification-repair-20260828'

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Rebind exact evidence chain in owner order
        shell: bash
        run: |
          set -euo pipefail

          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-domain-profiles.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs

          cat > /tmp/rebind.mjs <<'NODE'
          import fs from 'node:fs';

          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, `${JSON.stringify(v, null, 2)}\n`);
          const compactIdentity = (v) => ({ algorithm: v.algorithm, byteLength: v.byteLength, sha256: v.sha256 });
          const projectionIdentity = (current, generated) => ({
            schema: current.schema,
            algorithm: generated.algorithm,
            byteLength: generated.byteLength,
            sha256: generated.sha256,
          });
          const fixtureRoot = 'experiments/search-semantics-reference/fixtures';
          const composer = read('experiments/search-ir-composer-reference/build/evidence.json').representationCompositionEvidenceKey;
          const domainProjection = read('experiments/search-ir-composer-reference/build/domain-profiles.json').projectionIdentity;
          const graphProjection = read('experiments/search-ir-composer-reference/build/graph-profiles.json').projectionIdentity;
          const rootControl = read('experiments/search-ir-composer-reference/build/root-control.json').projectionIdentity;

          const neutralPath = `${fixtureRoot}/neutral-schedules.json`;
          const neutral = read(neutralPath);
          neutral.composerEvidence = compactIdentity(composer);
          const replaceEvidenceKeys = (v) => {
            if (Array.isArray(v)) return v.map(replaceEvidenceKeys);
            if (v && typeof v === 'object') {
              for (const [k, child] of Object.entries(v)) {
                if (k === 'evidenceKey') v[k] = composer.sha256;
                else v[k] = replaceEvidenceKeys(child);
              }
            }
            return v;
          };
          replaceEvidenceKeys(neutral.schedules);
          write(neutralPath, neutral);

          const domainPath = `${fixtureRoot}/domain-cases.json`;
          const domain = read(domainPath);
          domain.composerEvidence = compactIdentity(composer);
          domain.profileProjection = projectionIdentity(domain.profileProjection, domainProjection);
          write(domainPath, domain);

          const graphFixtures = [
            'graph-node-cases.json',
            'graph-edge-cases.json',
            'graph-ref-cases.json',
            'graph-path-cases.json',
            'graph-root-cases.json',
            'graph-reclaim-cases.json',
            'graph-advance-occurrence-cases.json',
            'graph-cleanup-cases.json',
          ];
          for (const name of graphFixtures) {
            const p = `${fixtureRoot}/${name}`;
            const f = read(p);
            if (f.composerEvidence) f.composerEvidence = compactIdentity(composer);
            if (f.profileProjection) f.profileProjection = projectionIdentity(f.profileProjection, graphProjection);
            if (f.rootControlProjection) f.rootControlProjection = compactIdentity(rootControl);
            write(p, f);
          }
          NODE

          node /tmp/rebind.mjs
          node experiments/search-semantics-reference/run.mjs

          update_evidence () {
            local property="$1"
            local evidence_file="$2"
            node - "$property" "$evidence_file" <<'NODE'
          import fs from 'node:fs';
          const [property, evidenceFile] = process.argv.slice(2);
          const identity = JSON.parse(fs.readFileSync(evidenceFile, 'utf8')).evidenceIdentity;
          if (!identity) throw new Error(`missing evidenceIdentity in ${evidenceFile}`);
          const fixtureRoot = 'experiments/search-semantics-reference/fixtures';
          for (const name of fs.readdirSync(fixtureRoot).filter((n) => n.startsWith('graph-') && n.endsWith('-cases.json'))) {
            const p = `${fixtureRoot}/${name}`;
            const f = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!Object.hasOwn(f, property)) continue;
            f[property] = { algorithm: identity.algorithm, byteLength: identity.byteLength, sha256: identity.sha256 };
            fs.writeFileSync(p, `${JSON.stringify(f, null, 2)}\n`);
          }
          NODE
          }

          node scripts/run-graph-node-reference.mjs
          update_evidence nodeEvidence experiments/search-semantics-reference/build/graph-node-evidence.json

          node scripts/run-graph-edge-reference.mjs
          update_evidence edgeEvidence experiments/search-semantics-reference/build/graph-edge-evidence.json

          node scripts/run-graph-ref-reference.mjs
          update_evidence refEvidence experiments/search-semantics-reference/build/graph-ref-evidence.json

          node scripts/run-graph-path-reference.mjs
          update_evidence pathEvidence experiments/search-semantics-reference/build/graph-path-evidence.json

          node scripts/run-graph-root-reference.mjs
          update_evidence rootEvidence experiments/search-semantics-reference/build/graph-root-evidence.json

          node scripts/run-graph-reclaim-reference.mjs
          update_evidence reclaimEvidence experiments/search-semantics-reference/build/graph-reclaim-evidence.json

          node scripts/run-graph-advance-occurrence-reference.mjs
          update_evidence advanceOccurrenceEvidence experiments/search-semantics-reference/build/graph-advance-occurrence-evidence.json

          node scripts/run-graph-cleanup-reference.mjs

          ./scripts/verify-docs.sh
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-edge-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node scripts/run-graph-path-reference.mjs
          node scripts/run-graph-root-reference.mjs
          node scripts/run-graph-reclaim-reference.mjs
          node scripts/run-graph-advance-occurrence-reference.mjs
          node scripts/run-graph-cleanup-reference.mjs

          git diff --check
          allowed='^(experiments/search-semantics-reference/fixtures/(neutral-schedules|domain-cases|graph-node-cases|graph-edge-cases|graph-ref-cases|graph-path-cases|graph-root-cases|graph-reclaim-cases|graph-advance-occurrence-cases|graph-cleanup-cases)\.json)$'
          while IFS= read -r file; do
            if ! [[ "$file" =~ $allowed ]]; then
              echo "unexpected migration file: $file" >&2
              exit 1
            fi
          done < <(git diff --name-only)

          if git diff --quiet; then
            echo 'Evidence chain already rebound; no commit required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/search-semantics-reference/fixtures/*.json
          git commit -m 'test: rebind Graph cleanup evidence chain'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
