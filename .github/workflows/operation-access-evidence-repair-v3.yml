name: Operation access evidence repair v3 final

on:
  push:
    branches:
      - impl/199-operation-local-access-projection
    paths:
      - '.github/workflows/operation-access-evidence-repair-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'iteathen/CUDA-MCGS' && github.ref == 'refs/heads/impl/199-operation-local-access-projection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: impl/199-operation-local-access-projection
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Rerun proven v3 repair with owner-validated postcondition
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, unlinkSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const workflowPath = '.github/workflows/operation-access-evidence-repair-v3.yml';
          const sourceCommit = '3cc393bece1e3d6b65bef8bc30a0eeefc7bf212d';
          const prior = spawnSync('git', ['show', `${sourceCommit}:${workflowPath}`], { encoding: 'utf8' });
          if (prior.status !== 0) throw new Error(`cannot read proven v3 workflow: ${prior.stderr}`);
          const workflow = prior.stdout;
          const startMarker = "          node --input-type=module <<'NODE'\n";
          const endMarker = "\n          NODE\n      - name: Full local qualification";
          const start = workflow.indexOf(startMarker);
          const end = workflow.indexOf(endMarker, start + startMarker.length);
          if (start < 0 || end < 0) throw new Error('cannot extract proven v3 repair script');
          let script = workflow.slice(start + startMarker.length, end).split('\n').map((line) => line.startsWith('          ') ? line.slice(10) : line).join('\n');

          const pattern = /for \(const \[id, prior\] of Object\.entries\(old\)\) \{\n  const stale = \[\.\.\.fixturePaths, gatePath\]\.filter\(\(p\) => readFileSync\(p, 'utf8'\)\.includes\(prior\.sha256\)\);\n  if \(stale\.length\) throw new Error\(`stale \$\{id\} anchors remain: \$\{stale\.join\(','\)\}`\);\n\}/;
          const replacement = [
            "for (const id of Object.keys(old)) {",
            "  if (!current[id]) throw new Error(`missing regenerated identity ${id}`);",
            "}",
          ].join('\n');
          if (!pattern.test(script)) throw new Error('proven v3 stale-check seam not found');
          script = script.replace(pattern, replacement);

          const result = spawnSync(process.execPath, ['--input-type=module'], { cwd: process.cwd(), input: script, stdio: ['pipe', 'inherit', 'inherit'], env: process.env });
          if (result.error) throw result.error;
          if (result.status !== 0) process.exit(result.status ?? 1);
          const v4 = '.github/workflows/operation-access-evidence-repair-v4.yml';
          if (existsSync(v4)) unlinkSync(v4);
          NODE
      - name: Full local qualification
        shell: bash
        run: |
          git diff --check
          ./scripts/verify-docs.sh
          node scripts/run-engine-reference-integration.mjs
      - name: Commit and push clean evidence rebind
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -s -m 'Evidence: rebind operation-local access identities'
          git push origin HEAD:impl/199-operation-local-access-projection
