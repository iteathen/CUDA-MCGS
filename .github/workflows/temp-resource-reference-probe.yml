name: temporary resource reference probe

on:
  push:
    branches: [ref/resource-01]

permissions:
  contents: write

jobs:
  probe-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ref/resource-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run exact Resource reference
        id: resource
        continue-on-error: true
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/run-resource-reference.mjs
      - name: Self-clean probe transport
        if: always()
        shell: bash
        run: |
          rm .github/workflows/temp-resource-reference-probe.yml
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add .github/workflows/temp-resource-reference-probe.yml
          git commit -m "chore: remove temporary Resource reference probe"
          git push origin HEAD:ref/resource-01
      - name: Preserve probe result
        if: always()
        shell: bash
        run: test "${{ steps.resource.outcome }}" = success
