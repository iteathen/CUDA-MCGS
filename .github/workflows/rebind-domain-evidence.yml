name: one-shot Domain evidence rebind

on:
  push:
    branches:
      - architecture/44-framework-only-production

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: architecture/44-framework-only-production
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Generate corrected Composer and Domain projection
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-domain-profiles.mjs
      - name: Rebind Domain fixture and prove oracle
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          const composer = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/domain-profiles.json', 'utf8'));
          const path = 'experiments/search-semantics-reference/fixtures/domain-cases.json';
          const fixture = JSON.parse(readFileSync(path, 'utf8'));
          fixture.composerEvidence = composer.representationCompositionEvidenceKey;
          fixture.profileProjection = { schema: fixture.profileProjection.schema, ...projection.projectionIdentity };
          writeFileSync(path, `${JSON.stringify(fixture, null, 2)}\n`);
          unlinkSync('.github/workflows/rebind-domain-evidence.yml');
          NODE
          node scripts/run-search-semantics-reference.mjs
          git diff --check
      - name: Commit exact Domain fixture rebinding and self-clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/search-semantics-reference/fixtures/domain-cases.json .github/workflows/rebind-domain-evidence.yml
          git commit -m 'test: rebind Domain evidence to framework authority'
          git push origin HEAD:architecture/44-framework-only-production
