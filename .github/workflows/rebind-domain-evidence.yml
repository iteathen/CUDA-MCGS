name: one-shot Domain evidence rebind

on:
  push:
    branches:
      - architecture/44-framework-only-production

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: architecture/44-framework-only-production
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Generate corrected Composer and Domain projection
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-domain-profiles.mjs
      - name: Rebind neutral harness and Domain fixture, then prove oracle
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          const composer = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));
          const projection = JSON.parse(readFileSync('experiments/search-ir-composer-reference/build/domain-profiles.json', 'utf8'));

          const neutralPath = 'experiments/search-semantics-reference/fixtures/neutral-schedules.json';
          const neutral = JSON.parse(readFileSync(neutralPath, 'utf8'));
          neutral.composerEvidence = composer.representationCompositionEvidenceKey;
          for (const schedule of Object.values(neutral.schedules)) {
            schedule.evidenceKey = composer.representationCompositionEvidenceKey.sha256;
          }
          writeFileSync(neutralPath, `${JSON.stringify(neutral, null, 2)}\n`);

          const domainPath = 'experiments/search-semantics-reference/fixtures/domain-cases.json';
          const domain = JSON.parse(readFileSync(domainPath, 'utf8'));
          domain.composerEvidence = composer.representationCompositionEvidenceKey;
          domain.profileProjection = { schema: domain.profileProjection.schema, ...projection.projectionIdentity };
          writeFileSync(domainPath, `${JSON.stringify(domain, null, 2)}\n`);

          unlinkSync('.github/workflows/rebind-domain-evidence.yml');
          NODE
          node scripts/run-search-semantics-reference.mjs
          git diff --check
      - name: Commit exact Domain/harness rebinding and self-clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/search-semantics-reference/fixtures/neutral-schedules.json \
                  experiments/search-semantics-reference/fixtures/domain-cases.json \
                  .github/workflows/rebind-domain-evidence.yml
          git commit -m 'test: rebind Domain evidence to framework authority'
          git push origin HEAD:architecture/44-framework-only-production
