name: output-reference-probe

on:
  pull_request:
    branches:
      - experimental/portfolio

permissions:
  contents: read

jobs:
  output-reference-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Run focused Output publication oracle probe
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-output-profiles.mjs
          node scripts/run-output-reference.mjs --case output-oracle-sensitivity-publication
      - name: Retain focused Output evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: output-reference-focused-red
          path: |
            experiments/search-ir-composer-reference/build/output-profiles.json
            experiments/search-semantics-reference/build/output-evidence.output-oracle-sensitivity-publication.json
          if-no-files-found: warn
