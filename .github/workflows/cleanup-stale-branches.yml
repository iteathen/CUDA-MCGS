name: Cleanup fully merged stale branches

on:
  pull_request_target:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-stale-branches-20260810
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CLEANUP_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Delete only refs proven safe to remove
        shell: bash
        run: |
          set -euo pipefail

          regular_targets=(
            agent/cleanup-and-artifact-disposition
            agent/cuda-js-exp-000-sync
            agent/governed-plan-execution
            agent/pr-review-and-merge-doctrine
            agent/proportional-sanity-checking
            agent/publish-lego-doctrine
          )

          expected_cleanup='agent/cleanup-stale-branches-20260810'
          if [[ "${CLEANUP_BRANCH}" != "${expected_cleanup}" ]]; then
            echo "Unexpected cleanup PR head: ${CLEANUP_BRANCH}" >&2
            exit 1
          fi

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          default_ref="origin/${DEFAULT_BRANCH}"
          cleanup_ref="origin/${CLEANUP_BRANCH}"
          git rev-parse --verify "${default_ref}^{commit}" >/dev/null

          for branch in "${regular_targets[@]}"; do
            ref="origin/${branch}"
            if ! git show-ref --verify --quiet "refs/remotes/${ref}"; then
              echo "Already absent: ${branch}"
              continue
            fi

            if ! git merge-base --is-ancestor "${ref}" "${default_ref}"; then
              echo "Refusing to delete unmerged branch: ${branch}" >&2
              exit 1
            fi

            open_prs="$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --head "${branch}" \
              --json number \
              --jq 'length')"
            if [[ "${open_prs}" != "0" ]]; then
              echo "Refusing to delete branch with open PR: ${branch}" >&2
              exit 1
            fi

            git push origin --delete "${branch}"
          done

          if git show-ref --verify --quiet "refs/remotes/${cleanup_ref}"; then
            if ! git merge-base --is-ancestor "${default_ref}" "${cleanup_ref}"; then
              echo "Cleanup branch is not based on the default branch" >&2
              exit 1
            fi

            changed_paths="$(git diff --name-only "${default_ref}...${cleanup_ref}")"
            if [[ "${changed_paths}" != '.github/workflows/cleanup-stale-branches.yml' ]]; then
              printf 'Cleanup branch contains unexpected changes:\n%s\n' "${changed_paths}" >&2
              exit 1
            fi

            pr_head="$(gh pr view "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json headRefName \
              --jq '.headRefName')"
            if [[ "${pr_head}" != "${CLEANUP_BRANCH}" ]]; then
              echo "PR head changed unexpectedly" >&2
              exit 1
            fi

            git push origin --delete "${CLEANUP_BRANCH}"
          fi

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          remaining="$({ git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed '/\/HEAD$/d' \
            | grep -v "^origin/${DEFAULT_BRANCH}$"; } || true)"
          if [[ -n "${remaining}" ]]; then
            printf 'Unexpected branches remain:\n%s\n' "${remaining}" >&2
            exit 1
          fi
