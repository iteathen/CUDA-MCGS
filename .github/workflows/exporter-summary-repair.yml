name: Exporter summary repair transport

on:
  push:
    branches:
      - ref/channel-evidence-01
    paths:
      - '.github/workflows/exporter-summary-repair.yml'
      - 'scripts/exporter-summary-repair.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ref/channel-evidence-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Apply exact exporter summary repair
        run: node scripts/exporter-summary-repair.mjs
      - name: Verify repair diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- experiments/search-ir-composer-reference/src/validation.mjs experiments/search-ir-composer-reference/export-*-profiles.mjs
      - name: Regenerate Composer evidence
        run: node scripts/run-search-ir-composer-reference.mjs
      - name: Qualify every profile exporter
        shell: bash
        run: |
          node scripts/export-search-ir-composer-domain-profiles.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/export-search-ir-composer-policy-profiles.mjs
          node scripts/export-search-ir-composer-evaluator-profiles.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/export-search-ir-composer-progress-profiles.mjs
          node scripts/export-search-ir-composer-output-profiles.mjs
          node scripts/export-search-ir-composer-session-profiles.mjs
          node scripts/export-search-ir-composer-stage-profiles.mjs
      - name: Commit only permanent exporter repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/search-ir-composer-reference/src/validation.mjs experiments/search-ir-composer-reference/export-*-profiles.mjs
          git commit -m 'REF-CHANNEL-EVIDENCE-01: remove duplicated exporter case count'
          git push origin HEAD:ref/channel-evidence-01
