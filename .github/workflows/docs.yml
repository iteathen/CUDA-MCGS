name: documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Verify documentation and agent governance
        run: ./scripts/verify-docs.sh

  search-ir-reference:
    name: Search IR reference (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Run deterministic CUDA-MCGS Search IR reference capsule
        run: node scripts/run-search-ir-reference.mjs
      - name: Retain platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: search-ir-reference-${{ matrix.os }}
          path: experiments/search-ir-reference/build/evidence.json
