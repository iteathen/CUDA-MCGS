name: documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Root-control source digest probe
        run: |
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          for (const path of ['docs/specs/SPEC-0006-search-session-control-and-observation.md']) {
            const text = await readFile(path, 'utf8');
            const normalized = text.replace(/\r\n?/g, '\n');
            console.log(`${path} sha256=${createHash('sha256').update(Buffer.from(normalized, 'utf8')).digest('hex')}`);
          }
          NODE
      - name: Verify documentation and agent governance
        run: ./scripts/verify-docs.sh

  search-ir-reference:
    name: Search IR reference (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Run deterministic CUDA-MCGS Search IR reference capsule
        run: node scripts/run-search-ir-reference.mjs
      - name: Retain platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: search-ir-reference-${{ matrix.os }}
          path: experiments/search-ir-reference/build/evidence.json
