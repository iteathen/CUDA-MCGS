name: documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-verification:
    name: Governance verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Verify documentation and agent governance
        run: ./scripts/verify-docs.sh

  search-ir-reference:
    name: Search IR reference (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run deterministic CUDA-MCGS Search IR reference capsule
        run: node scripts/run-search-ir-reference.mjs
      - name: Retain platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-ir-reference-${{ matrix.os }}
          path: experiments/search-ir-reference/build/evidence.json

  graph-node-reference:
    name: Graph NODE reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer, Graph projection, and NODE reference
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
      - name: Retain Graph NODE evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-node-reference
          path: |
            experiments/search-ir-composer-reference/build/graph-profiles.json
            experiments/search-semantics-reference/build/graph-node-evidence.json

  graph-edge-reference:
    name: Graph EDGE reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run qualified NODE input and EDGE reference
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-edge-reference.mjs
      - name: Retain Graph EDGE evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-edge-reference
          path: experiments/search-semantics-reference/build/graph-edge-evidence.json

  graph-ref-reference:
    name: Graph REF reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer, Graph projection, NODE, and REF reference
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-ref-reference.mjs
      - name: Retain Graph REF evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-ref-reference
          path: |
            experiments/search-ir-composer-reference/build/graph-profiles.json
            experiments/search-semantics-reference/build/graph-node-evidence.json
            experiments/search-semantics-reference/build/graph-ref-evidence.json

  graph-path-reference:
    name: Graph PATH reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer, Graph projection, NODE, REF, and PATH reference
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node scripts/run-graph-path-reference.mjs
      - name: Retain Graph PATH evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-path-reference
          path: |
            experiments/search-ir-composer-reference/build/graph-profiles.json
            experiments/search-semantics-reference/build/graph-node-evidence.json
            experiments/search-semantics-reference/build/graph-ref-evidence.json
            experiments/search-semantics-reference/build/graph-path-evidence.json

  graph-root-reference:
    name: Graph ROOT reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer through ROOT reference
        # ROOT consumes the generated Session root-control projection plus NODE/REF/PATH evidence. Graph owns only root-anchor/protection storage and owner disposition; Session retains current-root/epoch/operation authority and RECLAIM remains downstream.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node scripts/run-graph-path-reference.mjs
          node scripts/run-graph-root-reference.mjs
      - name: Retain Graph ROOT evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-root-reference
          path: |
            experiments/search-ir-composer-reference/build/graph-profiles.json
            experiments/search-ir-composer-reference/build/root-control.json
            experiments/search-semantics-reference/build/graph-node-evidence.json
            experiments/search-semantics-reference/build/graph-ref-evidence.json
            experiments/search-semantics-reference/build/graph-path-evidence.json
            experiments/search-semantics-reference/build/graph-root-evidence.json

  graph-reclaim-reference:
    name: Graph RECLAIM reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer through RECLAIM reference
        # RECLAIM consumes the exact Graph semantic packet and proves only lifecycle/quiescence/reuse meaning. Resource/Progress retain global admission/scheduling authority and native CUDA mechanism qualification remains downstream.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-edge-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node scripts/run-graph-path-reference.mjs
          node scripts/run-graph-root-reference.mjs
          node scripts/run-graph-reclaim-reference.mjs
      - name: Retain Graph RECLAIM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-reclaim-reference
          path: |
            experiments/search-ir-composer-reference/build/graph-profiles.json
            experiments/search-ir-composer-reference/build/root-control.json
            experiments/search-semantics-reference/build/graph-node-evidence.json
            experiments/search-semantics-reference/build/graph-edge-evidence.json
            experiments/search-semantics-reference/build/graph-ref-evidence.json
            experiments/search-semantics-reference/build/graph-path-evidence.json
            experiments/search-semantics-reference/build/graph-root-evidence.json
            experiments/search-semantics-reference/build/graph-reclaim-evidence.json

  graph-advance-occurrence-reference:
    name: Graph ADVANCE occurrence closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Graph packet through ADVANCE occurrence closure
        # This is an integration falsifier over accepted Session provenance plus PATH/ROOT/REF/RECLAIM. It adds no Session authority and selects no native/CUDA lifetime mechanism.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-edge-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node scripts/run-graph-path-reference.mjs
          node scripts/run-graph-root-reference.mjs
          node scripts/run-graph-reclaim-reference.mjs
          node scripts/run-graph-advance-occurrence-reference.mjs
      - name: Retain Graph ADVANCE occurrence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-advance-occurrence-reference
          path: |
            experiments/search-ir-composer-reference/build/graph-profiles.json
            experiments/search-ir-composer-reference/build/root-control.json
            experiments/search-semantics-reference/build/graph-node-evidence.json
            experiments/search-semantics-reference/build/graph-edge-evidence.json
            experiments/search-semantics-reference/build/graph-ref-evidence.json
            experiments/search-semantics-reference/build/graph-path-evidence.json
            experiments/search-semantics-reference/build/graph-root-evidence.json
            experiments/search-semantics-reference/build/graph-reclaim-evidence.json
            experiments/search-semantics-reference/build/graph-advance-occurrence-evidence.json

  graph-cleanup-reference:
    name: Graph CLEANUP reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Graph packet through CLEANUP reference
        # CLEANUP composes qualified Graph owner evidence and proves only Graph cleanup meaning. Resource/CUDA-JS retain concrete resource-destruction and native realization authority.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-graph-profiles.mjs
          node scripts/run-graph-node-reference.mjs
          node scripts/run-graph-edge-reference.mjs
          node scripts/run-graph-ref-reference.mjs
          node scripts/run-graph-path-reference.mjs
          node scripts/run-graph-root-reference.mjs
          node scripts/run-graph-reclaim-reference.mjs
          node scripts/run-graph-advance-occurrence-reference.mjs
          node scripts/run-graph-cleanup-reference.mjs
      - name: Retain Graph CLEANUP evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-cleanup-reference
          path: |
            experiments/search-ir-composer-reference/build/graph-profiles.json
            experiments/search-ir-composer-reference/build/root-control.json
            experiments/search-semantics-reference/build/graph-node-evidence.json
            experiments/search-semantics-reference/build/graph-edge-evidence.json
            experiments/search-semantics-reference/build/graph-ref-evidence.json
            experiments/search-semantics-reference/build/graph-path-evidence.json
            experiments/search-semantics-reference/build/graph-root-evidence.json
            experiments/search-semantics-reference/build/graph-reclaim-evidence.json
            experiments/search-semantics-reference/build/graph-advance-occurrence-evidence.json
            experiments/search-semantics-reference/build/graph-cleanup-evidence.json

  policy-reference:
    name: Policy reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer and Policy reference
        # Policy consumes normalized Domain roles and Graph-ready/reference facts. Evaluator, Resource, Progress, Output, Session and native/CUDA realization remain separate owners.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-policy-profiles.mjs
          node scripts/run-policy-reference.mjs
      - name: Retain Policy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-reference
          path: |
            experiments/search-ir-composer-reference/build/policy-profiles.json
            experiments/search-semantics-reference/build/policy-evidence.json

  evaluator-reference:
    name: Evaluator reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer and Evaluator reference
        # Evaluator consumes exact normalized profiles plus injected owner facts. Resource, Progress, Session, Output and native/CUDA realization remain separate owners.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-evaluator-profiles.mjs
          node scripts/run-evaluator-reference.mjs
      - name: Retain Evaluator evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluator-reference
          path: |
            experiments/search-ir-composer-reference/build/evaluator-profiles.json
            experiments/search-semantics-reference/build/evaluator-evidence.json

  resource-reference:
    name: Resource reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer and Resource reference
        # Resource owns finite admission/accounting, pressure, exhaustion and cleanup semantics. Contributor policy, Progress scheduling and native/CUDA realization remain separate owners.
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/run-resource-reference.mjs
      - name: Retain Resource evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-reference
          path: |
            experiments/search-ir-composer-reference/build/resource-profiles.json
            experiments/search-semantics-reference/build/resource-evidence.json

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - governance-verification
      - search-ir-reference
      - graph-node-reference
      - graph-edge-reference
      - graph-ref-reference
      - graph-path-reference
      - graph-root-reference
      - graph-reclaim-reference
      - graph-advance-occurrence-reference
      - graph-cleanup-reference
      - policy-reference
      - evaluator-reference
      - resource-reference
    runs-on: ubuntu-latest
    steps:
      - name: Require every merge-gate job to succeed
        env:
          GOVERNANCE_RESULT: ${{ needs.governance-verification.result }}
          SEARCH_IR_RESULT: ${{ needs.search-ir-reference.result }}
          GRAPH_NODE_RESULT: ${{ needs.graph-node-reference.result }}
          GRAPH_EDGE_RESULT: ${{ needs.graph-edge-reference.result }}
          GRAPH_REF_RESULT: ${{ needs.graph-ref-reference.result }}
          GRAPH_PATH_RESULT: ${{ needs.graph-path-reference.result }}
          GRAPH_ROOT_RESULT: ${{ needs.graph-root-reference.result }}
          GRAPH_RECLAIM_RESULT: ${{ needs.graph-reclaim-reference.result }}
          GRAPH_ADVANCE_OCCURRENCE_RESULT: ${{ needs.graph-advance-occurrence-reference.result }}
          GRAPH_CLEANUP_RESULT: ${{ needs.graph-cleanup-reference.result }}
          POLICY_RESULT: ${{ needs.policy-reference.result }}
          EVALUATOR_RESULT: ${{ needs.evaluator-reference.result }}
          RESOURCE_RESULT: ${{ needs.resource-reference.result }}
        run: |
          set -euo pipefail
          names=(GOVERNANCE SEARCH_IR GRAPH_NODE GRAPH_EDGE GRAPH_REF GRAPH_PATH GRAPH_ROOT GRAPH_RECLAIM GRAPH_ADVANCE_OCCURRENCE GRAPH_CLEANUP POLICY EVALUATOR RESOURCE)
          results=(
            "$GOVERNANCE_RESULT"
            "$SEARCH_IR_RESULT"
            "$GRAPH_NODE_RESULT"
            "$GRAPH_EDGE_RESULT"
            "$GRAPH_REF_RESULT"
            "$GRAPH_PATH_RESULT"
            "$GRAPH_ROOT_RESULT"
            "$GRAPH_RECLAIM_RESULT"
            "$GRAPH_ADVANCE_OCCURRENCE_RESULT"
            "$GRAPH_CLEANUP_RESULT"
            "$POLICY_RESULT"
            "$EVALUATOR_RESULT"
            "$RESOURCE_RESULT"
          )
          failed=0
          for index in "${!results[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${results[$index]}"
            if [[ "${results[$index]}" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"
