name: Channel review-gap patch transport

on:
  push:
    branches:
      - ref/channel-evidence-01
    paths:
      - '.github/workflows/channel-review-gap-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ref/channel-evidence-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Apply exact review-discovered Channel corrections
        run: node scripts/channel-review-gap-patch.mjs
      - name: Verify exact patch shape
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- \
            schemas/search-ir/0.2.0/channel-profile.schema.json \
            experiments/search-ir-composer-reference/src/channel.mjs \
            experiments/search-ir-composer-reference/src/channel-fixtures.mjs \
            experiments/search-ir-composer-reference/run.mjs
      - name: Run focused Composer qualification before commit
        run: node scripts/run-search-ir-composer-reference.mjs
      - name: Commit only owner-local correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            schemas/search-ir/0.2.0/channel-profile.schema.json \
            experiments/search-ir-composer-reference/src/channel.mjs \
            experiments/search-ir-composer-reference/src/channel-fixtures.mjs \
            experiments/search-ir-composer-reference/run.mjs
          git commit -m 'REF-CHANNEL-EVIDENCE-01: close review-discovered Channel gaps'
          git push origin HEAD:ref/channel-evidence-01
