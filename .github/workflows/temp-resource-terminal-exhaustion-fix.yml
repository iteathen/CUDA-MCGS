name: temporary resource terminal exhaustion fix

on:
  push:
    branches: [ref/resource-01]

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ref/resource-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Apply exact Resource-owned terminal transition
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'experiments/search-semantics-reference/src/resource.mjs';
          const source = readFileSync(path, 'utf8');
          const before = "    exhaustionEvents.push(event);\n    if (terminal === true && firstTerminalCause === null) firstTerminalCause = event;\n    return {";
          const after = "    exhaustionEvents.push(event);\n    if (terminal === true) {\n      if (firstTerminalCause === null) firstTerminalCause = event;\n      if (lifecycle === 'active') lifecycle = 'draining';\n    }\n    return {";
          const matches = source.split(before).length - 1;
          if (matches !== 1) throw new Error(`expected one terminal exhaustion publication block, found ${matches}`);
          writeFileSync(path, source.replace(before, after));
          NODE
          git diff --check
      - name: Run focused and full Resource falsifiers
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-resource-profiles.mjs
          node scripts/run-resource-reference.mjs --case resource-terminal-exhaustion-drain
          node scripts/run-resource-reference.mjs
      - name: Commit repair and self-clean
        shell: bash
        run: |
          rm .github/workflows/temp-resource-terminal-exhaustion-fix.yml
          git diff --check
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add experiments/search-semantics-reference/src/resource.mjs .github/workflows/temp-resource-terminal-exhaustion-fix.yml
          git commit -m "fix(resource): close admission on terminal exhaustion"
          git push origin HEAD:ref/resource-01
