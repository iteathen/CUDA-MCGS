name: Operation access construction

on:
  push:
    branches:
      - impl/199-operation-local-access-projection
    paths:
      - '.github/workflows/operation-access-construction.yml'

permissions:
  contents: write

jobs:
  construct:
    if: github.repository == 'iteathen/CUDA-MCGS' && github.ref == 'refs/heads/impl/199-operation-local-access-projection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: impl/199-operation-local-access-projection
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Apply exact operation-access patch
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';

          function replaceExact(path, before, after) {
            const source = readFileSync(path, 'utf8');
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + 1) >= 0) {
              throw new Error(`${path}: expected exactly one construction seam`);
            }
            writeFileSync(path, source.slice(0, first) + after + source.slice(first + before.length));
          }

          const programPath = 'experiments/search-ir-composer-reference/src/program-package.mjs';
          replaceExact(programPath,
          `  if (input.source?.kind === 'resource') {
            exactKeys(input.source, ['kind', 'resource'], 'COMPOSE_OPERATION_BINDING_FIELDS', \`${'${operationId} ${input.parameter} resource'}\`);
            const resource = resources.get(input.source.resource);
            if (!resource || resource.materialization !== 'resident-storage' || !parameter.type.startsWith('ptr<')) fail('COMPOSE_OPERATION_BINDING', \`${'${operationId} resource binding is incompatible'}\`);
            return { parameter: input.parameter, source: { kind: 'resource', resource: input.source.resource } };
          }
          exactKeys(input.source, ['kind', 'schema'], 'COMPOSE_OPERATION_BINDING_FIELDS', \`${'${operationId} ${input.parameter} scalar'}\`);`,
          `  if (input.source?.kind === 'resource') {
            const hasAccess = Object.hasOwn(input.source, 'access');
            exactKeys(input.source, hasAccess ? ['kind', 'resource', 'access'] : ['kind', 'resource'], 'COMPOSE_OPERATION_BINDING_FIELDS', \`${'${operationId} ${input.parameter} resource'}\`);
            const resource = resources.get(input.source.resource);
            if (!resource || resource.materialization !== 'resident-storage' || !parameter.type.startsWith('ptr<')) fail('COMPOSE_OPERATION_BINDING', \`${'${operationId} resource binding is incompatible'}\`);
            const source = { kind: 'resource', resource: input.source.resource };
            if (hasAccess) {
              const access = assertEnum(input.source.access, ['read', 'write', 'read-write'], 'COMPOSE_OPERATION_ACCESS', \`${'${operationId} ${input.parameter} access'}\`);
              if ((access === 'read' || access === 'read-write') && !resource.access.includes('read')) fail('COMPOSE_OPERATION_ACCESS', \`${'${operationId} ${input.parameter} read access exceeds the resource envelope'}\`);
              if ((access === 'write' || access === 'read-write') && !resource.access.includes('write')) fail('COMPOSE_OPERATION_ACCESS', \`${'${operationId} ${input.parameter} write access exceeds the resource envelope'}\`);
              source.access = access;
            }
            return { parameter: input.parameter, source };
          }
          if (Object.hasOwn(input.source ?? {}, 'access')) fail('COMPOSE_OPERATION_ACCESS', \`${'${operationId} ${input.parameter} scalar binding cannot carry access'}\`);
          exactKeys(input.source, ['kind', 'schema'], 'COMPOSE_OPERATION_BINDING_FIELDS', \`${'${operationId} ${input.parameter} scalar'}\`);`);

          replaceExact(programPath,
          `function buildCudaJsAdapterRequirements(program) {
            const resources = program.resources.filter(({ materialization }) => materialization === 'resident-storage');
            const resourceNames = new Map(resources.map((entry, index) => [entry.id, \`resource-${'${index}'}\`]));
            const operations = program.operations.map((entry, index) => ({`,
          `function buildCudaJsAdapterRequirements(program) {
            const resources = program.resources.filter(({ materialization }) => materialization === 'resident-storage');
            const resourceNames = new Map(resources.map((entry, index) => [entry.id, \`resource-${'${index}'}\`]));
            for (const operation of program.operations) for (const binding of operation.bindings) {
              if (binding.source.kind === 'resource' && !Object.hasOwn(binding.source, 'access')) {
                fail('COMPOSE_OPERATION_ACCESS_REQUIRED', \`${'${operation.id} ${binding.parameter} lacks operation-local resource access'}\`);
              }
            }
            const operations = program.operations.map((entry, index) => ({`);

          replaceExact(programPath,
          `      ? { parameter: binding.parameter, source: { kind: 'resource', resource: resourceNames.get(binding.source.resource) } }
                : { parameter: binding.parameter, source: { kind: 'scalar', schema: { ...binding.source.schema } } }),`,
          `      ? { parameter: binding.parameter, source: { kind: 'resource', resource: resourceNames.get(binding.source.resource), access: binding.source.access } }
                : { parameter: binding.parameter, source: { kind: 'scalar', schema: { ...binding.source.schema } } }),`);

          const fixturePath = 'experiments/search-ir-composer-reference/src/program-package-fixtures.mjs';
          replaceExact(fixturePath,
          `bindings: [{ parameter: 'output', source: { kind: 'resource', resource: outputResource.id } }],`,
          `bindings: [{ parameter: 'output', source: { kind: 'resource', resource: outputResource.id, access: 'write' } }],`);

          const operationAccess = {
            enum: ['read', 'write', 'read-write'],
            description: 'MCGS-owned ordinary operation-local access intent. Atomic/publication effects require a later accepted extension and cannot be weakened to this field.',
          };
          for (const [path, definition] of [
            ['schemas/search-ir/0.2.0/program-package-profile.schema.json', 'binding'],
            ['schemas/search-ir/0.2.0/execution-package.schema.json', 'publicBinding'],
          ]) {
            const schema = JSON.parse(readFileSync(path, 'utf8'));
            const branches = schema.$defs[definition].properties.source.oneOf;
            const resource = branches.find((entry) => entry.properties?.kind?.const === 'resource');
            const scalar = branches.find((entry) => entry.properties?.kind?.const === 'scalar');
            if (!resource || !scalar || Object.hasOwn(resource.properties, 'access') || Object.hasOwn(scalar.properties, 'access')) throw new Error(`${path}: unexpected binding schema seam`);
            resource.properties.access = operationAccess;
            writeFileSync(path, `${JSON.stringify(schema, null, 2)}\n`);
          }

          writeFileSync('experiments/search-ir-composer-reference/verify-operation-local-access.mjs', `#!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          import {
            buildExecutionPackage,
            composeSearchProgram,
            normalizeProgramPackageProfile,
          } from './src/program-package.mjs';
          import { buildProgramPackageProfile } from './src/program-package-fixtures.mjs';

          const experimentRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)));
          const repositoryRoot = path.resolve(experimentRoot, '..', '..');
          const schemaRoot = path.join(repositoryRoot, 'schemas', 'search-ir', '0.2.0');
          const ordinaryAccess = ['read', 'write', 'read-write'];
          const broadAccess = ['read', 'write', 'atomic', 'publish'];
          const digest = (character) => ({ algorithm: 'sha256', sha256: character.repeat(64) });
          const profile = (id, schema, character) => ({ normalized: { id, schema }, schemaSha: character.repeat(64), identity: digest(character) });

          function makeFixture(providerAccess = broadAccess, bindingAccess = 'write') {
            const resourceResult = {
              ...profile('resource.operation-access', 'cuda-mcgs.resource-profile/0.2.0', '1'),
              normalized: {
                id: 'resource.operation-access',
                schema: 'cuda-mcgs.resource-profile/0.2.0',
                providerRequirements: [{
                  id: 'provider.operation-access',
                  unit: 'bytes',
                  capacity: '64',
                  alignment: '8',
                  memorySpaces: ['device-search'],
                  access: [...providerAccess],
                }],
              },
            };
            const progressResult = profile('progress.operation-access', 'cuda-mcgs.progress-profile/0.2.0', '2');
            const outputResult = profile('output.operation-access', 'cuda-mcgs.output-profile/0.2.0', '3');
            const inspected = {
              contractSet: { contracts: [{ id: 'SPEC-0005', specificationIdentity: 'CUDA-MCGS-SPEC-0005@0.4.0', sha256: '4'.repeat(64) }] },
              identities: { contractSet: digest('5') },
            };
            const fixture = buildProgramPackageProfile(inspected, {
              profileResults: [resourceResult, progressResult, outputResult],
              resourceResult,
              progressResult,
              outputResult,
              sessionResult: null,
              stageResult: null,
              channelResult: null,
            }, 'operation-access');
            const operation = fixture.input.operations.find(({ entryPoint }) => entryPoint === 'engine_step');
            const binding = operation?.bindings.find(({ parameter }) => parameter === 'output');
            if (!binding || binding.source?.kind !== 'resource') throw new Error('operation-access fixture lacks engine_step(output) resource binding');
            if (bindingAccess === null) delete binding.source.access;
            else binding.source.access = bindingAccess;
            return { fixture, inspected, binding };
          }

          function normalizeCase(providerAccess = broadAccess, bindingAccess = 'write') {
            const subject = makeFixture(providerAccess, bindingAccess);
            const normalized = normalizeProgramPackageProfile(subject.fixture.input, subject.inspected, subject.fixture.context);
            return { ...subject, normalized };
          }

          const accepted = normalizeCase();
          const acceptedBinding = accepted.normalized.normalized.operations[0].bindings.find(({ parameter }) => parameter === 'output');
          assert.equal(acceptedBinding.source.access, 'write');
          const program = composeSearchProgram(accepted.normalized);
          assert.equal(program.normalized.operations[0].bindings[0].source.access, 'write');
          const execution = buildExecutionPackage(accepted.normalized, program);
          assert.equal(execution.normalized.cudaJsAdapter.operationRequirements[0].bindings[0].source.access, 'write');
          assert.deepEqual(new Set(execution.normalized.cudaJsAdapter.resourceRequirements[0].accessRequirements), new Set(broadAccess));

          const readOnly = normalizeCase(['read'], 'read');
          assert.equal(readOnly.normalized.normalized.operations[0].bindings[0].source.access, 'read');
          const readWrite = normalizeCase(['read', 'write'], 'read-write');
          assert.equal(readWrite.normalized.normalized.operations[0].bindings[0].source.access, 'read-write');

          assert.throws(() => normalizeCase(['write'], 'read'), { code: 'COMPOSE_OPERATION_ACCESS' });
          assert.throws(() => normalizeCase(['read'], 'write'), { code: 'COMPOSE_OPERATION_ACCESS' });
          assert.throws(() => normalizeCase(['read'], 'read-write'), { code: 'COMPOSE_OPERATION_ACCESS' });
          assert.throws(() => normalizeCase(broadAccess, 'atomic'), { code: 'COMPOSE_OPERATION_ACCESS' });
          assert.throws(() => normalizeCase(broadAccess, 'publish'), { code: 'COMPOSE_OPERATION_ACCESS' });

          const scalarAccess = makeFixture();
          scalarAccess.binding.source = {
            kind: 'scalar',
            schema: { id: 'cuda-mcgs.scalar-u32/0.1.0', version: '0.1.0', sha256: '6'.repeat(64) },
            access: 'read',
          };
          assert.throws(() => normalizeProgramPackageProfile(scalarAccess.fixture.input, scalarAccess.inspected, scalarAccess.fixture.context), { code: 'COMPOSE_OPERATION_ACCESS' });

          const historical = normalizeCase(broadAccess, null);
          const historicalProgram = composeSearchProgram(historical.normalized);
          assert.throws(() => buildExecutionPackage(historical.normalized, historicalProgram), { code: 'COMPOSE_OPERATION_ACCESS_REQUIRED' });

          const readWriteSameEnvelope = normalizeCase(broadAccess, 'read-write');
          assert.notEqual(readWriteSameEnvelope.normalized.identity.sha256, accepted.normalized.identity.sha256);

          for (const [file, definition] of [
            ['program-package-profile.schema.json', 'binding'],
            ['execution-package.schema.json', 'publicBinding'],
          ]) {
            const schema = JSON.parse(await readFile(path.join(schemaRoot, file), 'utf8'));
            const branches = schema.$defs[definition].properties.source.oneOf;
            const resource = branches.find((entry) => entry.properties?.kind?.const === 'resource');
            const scalar = branches.find((entry) => entry.properties?.kind?.const === 'scalar');
            assert.deepEqual(resource.properties.access.enum, ordinaryAccess);
            assert(!resource.required.includes('access'), 'historical resource bindings must retain structural validity');
            assert.equal(Object.hasOwn(scalar.properties, 'access'), false);
          }

          console.log('operation_local_access=pass ordinary=read,write,read-write historical=non-realizable atomic_publication=fail-closed adapter=inference-free');
          `);

          writeFileSync('scripts/run-search-ir-composer-reference.mjs', `#!/usr/bin/env node
          import '../experiments/search-ir-composer-reference/run.mjs';
          import '../experiments/search-ir-composer-reference/verify-progress-stop-disposition-authority.mjs';
          import '../experiments/search-ir-composer-reference/verify-operation-local-access.mjs';
          `);

          const integrationPath = 'scripts/run-engine-reference-integration.mjs';
          replaceExact(integrationPath,
          `  'scripts/run-search-ir-composer-reference.mjs',
            'experiments/search-ir-composer-reference/verify-operation-local-access.mjs',`,
          `  'scripts/run-search-ir-composer-reference.mjs',`);

          unlinkSync('.github/workflows/operation-access-construction.yml');
          NODE
      - name: Qualify construction locally
        run: |
          git diff --check
          node scripts/run-search-ir-composer-reference.mjs
      - name: Commit and push construction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -s -m 'Execution package: project operation-local resource access'
          git push origin HEAD:impl/199-operation-local-access-projection
