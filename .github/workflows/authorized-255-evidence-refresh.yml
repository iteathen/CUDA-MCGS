name: "Authorized #255 downstream evidence refresh"

on:
  push:
    branches:
      - feature/124-device-resident-evaluator

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh exact downstream evidence locks and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(source, before, after, expectedCount, label) {
            const actualCount = source.split(before).length - 1;
            if (actualCount !== expectedCount) {
              throw new Error(`${label}: expected ${expectedCount} occurrences, found ${actualCount}`);
            }
            return source.split(before).join(after);
          }

          const oldComposerSha = 'b09622fe1c3faeb4cb37c58e45241aa035e7caec92d107fc81990220fa0e437f';
          const newComposerSha = '448bab881cbfc8502acb5958f914a1833854c355de83a7aec9b4fadf42bd30f3';
          const oldProjectionSha = '3290a420f667e0681d96d760c2816a6ce22b97240978fab8e969cd94be052914';
          const newProjectionSha = '12ce540e3ff45c9bf2a47d9f1d1bfc4caa4636367a62682a0790f8ddcee88704';

          const neutralPath = 'experiments/search-semantics-reference/fixtures/neutral-schedules.json';
          let neutral = fs.readFileSync(neutralPath, 'utf8');
          neutral = replaceExact(neutral, '"byteLength": 708983', '"byteLength": 709018', 1, 'neutral composer byte length');
          neutral = replaceExact(neutral, oldComposerSha, newComposerSha, 4, 'neutral composer evidence identities');
          fs.writeFileSync(neutralPath, neutral);

          const domainPath = 'experiments/search-semantics-reference/fixtures/domain-cases.json';
          let domain = fs.readFileSync(domainPath, 'utf8');
          domain = replaceExact(domain, '"byteLength": 708983', '"byteLength": 709018', 1, 'domain composer byte length');
          domain = replaceExact(domain, oldComposerSha, newComposerSha, 1, 'domain composer evidence identity');
          domain = replaceExact(domain, oldProjectionSha, newProjectionSha, 1, 'domain projection identity');
          fs.writeFileSync(domainPath, domain);
          NODE

          rm -- .github/workflows/authorized-255-evidence-refresh.yml
          git config user.name "OpenAI authorized project agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/search-semantics-reference/fixtures/neutral-schedules.json experiments/search-semantics-reference/fixtures/domain-cases.json .github/workflows/authorized-255-evidence-refresh.yml
          git diff --cached --check
          git commit -m "Refresh #255 Search Compiler evidence locks"
          git push origin HEAD:refs/heads/feature/124-device-resident-evaluator
