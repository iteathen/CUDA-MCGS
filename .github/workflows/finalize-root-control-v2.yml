name: one-shot root control finalization v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'docs/ref-root-control-01-reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ref-root-control-01-reconcile
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Reuse finalization with complete repository identity migration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const workflow = await readFile('.github/workflows/finalize-root-control.yml', 'utf8');
          const marker = '        run: |\n';
          const start = workflow.indexOf(marker);
          if (start < 0) throw new Error('finalization run block not found');
          let script = workflow.slice(start + marker.length)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');

          const oldSource = "'https://github.com/iteathen/UMCGS/'";
          const oldTarget = "'https://github.com/iteathen/CUDA-MCGS/'";
          if (!script.includes(oldSource) || !script.includes(oldTarget)) throw new Error('schema identity migration anchors missing');
          script = script.replace(oldSource, "'iteathen/UMCGS'").replace(oldTarget, "'iteathen/CUDA-MCGS'");

          const composerMarker = 'node scripts/run-search-ir-composer-reference.mjs';
          if (!script.includes(composerMarker)) throw new Error('Composer execution marker missing');
          const derivedRefresh = `node --input-type=module <<'REFRESH'\nimport { readFile, writeFile } from 'node:fs/promises';\nimport { sourceTextSha256 } from './experiments/search-ir-composer-reference/src/validation.mjs';\n\nconst fixturePath = 'experiments/search-ir-composer-reference/fixtures/minimal.framework-selection.json';\nconst fixture = JSON.parse(await readFile(fixturePath, 'utf8'));\nconst schemaFiles = new Map([\n  ['domain', 'domain-profile.schema.json'],\n  ['graph', 'graph-profile.schema.json'],\n  ['output', 'output-profile.schema.json'],\n  ['policy', 'policy-profile.schema.json'],\n  ['program-package', 'program-package-profile.schema.json'],\n  ['progress', 'progress-profile.schema.json'],\n  ['resource', 'resource-profile.schema.json'],\n]);\nfor (const profile of fixture.profiles) {\n  const file = schemaFiles.get(profile.role);\n  if (!file) throw new Error(\`no schema mapping for framework role \${profile.role}\`);\n  profile.schema.sha256 = sourceTextSha256(await readFile(\`schemas/search-ir/0.2.0/\${file}\`));\n}\nawait writeFile(fixturePath, \`\${JSON.stringify(fixture, null, 2)}\\n\`);\n\nconst packageFixturePath = 'experiments/search-ir-composer-reference/src/program-package-fixtures.mjs';\nlet packageFixture = await readFile(packageFixturePath, 'utf8');\npackageFixture = packageFixture.replaceAll('iteathen/UMCGS', 'iteathen/CUDA-MCGS');\nawait writeFile(packageFixturePath, packageFixture);\n\nconst verifyPath = 'scripts/verify-docs.sh';\nlet verify = await readFile(verifyPath, 'utf8');\nverify = verify.replace('node_bin=\"\${UMCGS_NODE:-}\"', 'node_bin=\"\${CUDA_MCGS_NODE:-\${UMCGS_NODE:-}}\"');\nawait writeFile(verifyPath, verify);\nREFRESH\n\nset +e\n${composerMarker}\ndiscovery_status=$?\nset -e\nif [[ ! -s experiments/search-ir-composer-reference/build/evidence.json ]]; then\n  echo 'Composer discovery pass did not emit evidence' >&2\n  exit 1\nfi\nnode --input-type=module <<'IDENTITIES'\nimport { readFile, writeFile } from 'node:fs/promises';\nconst fixturePath = 'experiments/search-ir-composer-reference/fixtures/minimal.framework-selection.json';\nconst fixture = JSON.parse(await readFile(fixturePath, 'utf8'));\nconst evidence = JSON.parse(await readFile('experiments/search-ir-composer-reference/build/evidence.json', 'utf8'));\nconst byRole = new Map([\n  ['domain', evidence.domainProfileIdentities?.[0]],\n  ['graph', evidence.graphProfileIdentities?.[0]],\n  ['policy', evidence.policyProfileIdentities?.[0]],\n  ['resource', evidence.resourceProfileIdentities?.[0]],\n  ['progress', evidence.progressProfileIdentities?.[0]],\n  ['output', evidence.outputProfileIdentities?.[0]],\n]);\nfor (const profile of fixture.profiles) {\n  const identity = byRole.get(profile.role);\n  if (!identity) continue;\n  if (!/^[0-9a-f]{64}$/.test(identity.sha256)) throw new Error(\`missing normalized identity for \${profile.role}\`);\n  profile.identity = { algorithm: identity.algorithm, sha256: identity.sha256 };\n}\nawait writeFile(fixturePath, \`\${JSON.stringify(fixture, null, 2)}\\n\`);\nIDENTITIES\n\n${composerMarker}`;
          script = script.replace(composerMarker, derivedRefresh);

          const schemaCheck = "if grep -RIl 'iteathen/UMCGS' schemas/search-ir/0.2.0; then";
          if (!script.includes(schemaCheck)) throw new Error('schema identity verification anchor missing');
          script = script.replace(schemaCheck, "if grep -RIl 'iteathen/UMCGS' schemas/search-ir/0.2.0 experiments/search-ir-composer-reference/src experiments/search-ir-composer-reference/fixtures; then");

          const addMarker = 'git add -A';
          if (!script.includes(addMarker)) throw new Error('git add marker missing');
          script = script.replace(addMarker, "git rm .github/workflows/finalize-root-control-v2.yml\n" + addMarker);

          await writeFile('/tmp/finalize-root-control-v2.sh', `set -euo pipefail\n${script}`, { mode: 0o700 });
          NODE
          bash /tmp/finalize-root-control-v2.sh
