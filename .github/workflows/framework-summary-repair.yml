name: Framework summary repair transport

on:
  push:
    branches:
      - ref/channel-evidence-01
    paths:
      - '.github/workflows/framework-summary-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ref/channel-evidence-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Apply exact Framework summary repair
        run: node scripts/framework-composer-summary-repair.mjs
      - name: Verify repair diff
        shell: bash
        run: |
          git diff --check
          git diff -- experiments/search-semantics-reference/run-framework-lifecycle.mjs
      - name: Regenerate Composer evidence
        run: node scripts/run-search-ir-composer-reference.mjs
      - name: Qualify Framework lifecycle reference
        run: node scripts/run-framework-lifecycle-reference.mjs
      - name: Commit only permanent Framework repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/search-semantics-reference/run-framework-lifecycle.mjs
          git commit -m 'REF-CHANNEL-EVIDENCE-01: remove Framework duplicated Composer case count'
          git push origin HEAD:ref/channel-evidence-01
