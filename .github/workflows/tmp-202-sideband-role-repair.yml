name: tmp 202 sideband role repair

on:
  push:
    branches:
      - tmp/202-sideband-role-falsifier-repair-20260904

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Apply deterministic repair
        run: node scripts/tmp-202-sideband-role-repair-v2.mjs
      - name: Qualify focused Composer capsule
        run: node scripts/run-search-ir-composer-reference.mjs
      - name: Verify diff
        run: git diff --check
      - name: Publish qualified candidate blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/search-ir-composer-reference/src/program-package-fixtures.mjs \
            experiments/search-ir-composer-reference/src/program-package.mjs \
            experiments/search-ir-composer-reference/run.mjs \
            schemas/search-ir/0.2.0/program-package-profile.schema.json
          git commit -m "tmp: qualified #202 explicit sideband role and canonical falsifiers"
          git push origin HEAD:tmp/202-sideband-role-falsifier-repair-20260904
