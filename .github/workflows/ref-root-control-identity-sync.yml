name: REF root-control identity sync

on:
  push:
    branches: [docs/ref-root-control-01-reconcile]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[identity-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Replace exactly one frozen contract-set identity
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'experiments/search-ir-composer-reference/fixtures/minimal.framework-selection.json';
          const before = '54f5e7ce38423042ae95098fe38e0cf5bd33acdca8cd1fecf0f1c939ef945177';
          const after = '5d7a6ffb2861716789acf5e14ef405d7a70d4b151980b9726adbd2a3b10180b9';
          const text = await readFile(path, 'utf8');
          const count = text.split(before).length - 1;
          if (count !== 1) throw new Error(`expected one old contract-set identity, found ${count}`);
          await writeFile(path, text.replace(before, after));
          NODE
          node scripts/check-structured-data.mjs
          git diff --check
      - name: Remove one-shot workflow and commit
        shell: bash
        env:
          BRANCH: docs/ref-root-control-01-reconcile
        run: |
          rm .github/workflows/ref-root-control-identity-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sync proposal framework selection identity [identity-synced]'
          git push origin HEAD:$BRANCH
