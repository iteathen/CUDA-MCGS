name: construct-202-sideband

on:
  push:
    branches:
      - impl/202-external-control-sideband-projection

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: impl/202-external-control-sideband-projection
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Apply #202 package-sideband implementation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function patch(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${path}: transform made no change`);
            fs.writeFileSync(path, after);
          }
          function once(text, oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0 || text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(`${label}: expected exactly one match`);
            return text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          patch('experiments/search-ir-composer-reference/src/program-package.mjs', (text) => {
            text = once(text,
              "const RESTRICTED_SOURCE_TYPES = new Set(['bool', 'u32', 'i32', 'u64', 'f32', 'ptr<bool>', 'ptr<u32>', 'ptr<i32>', 'ptr<u64>', 'ptr<f32>']);",
              "const RESTRICTED_SOURCE_TYPES = new Set(['bool', 'u32', 'i32', 'u64', 'f32', 'ptr<bool>', 'ptr<u32>', 'ptr<i32>', 'ptr<u64>', 'ptr<f32>', 'sideband<u32>']);",
              'restricted parameter types');
            text = once(text,
              "const BASE_REQUIREMENTS = new Set(['cuda-js.device-js/0.1.0', 'cuda-js.operation-lifecycle/0.1.0']);",
              "const HISTORICAL_BASE_REQUIREMENTS = new Set(['cuda-js.device-js/0.1.0', 'cuda-js.operation-lifecycle/0.1.0']);\nconst BASE_REQUIREMENTS = new Set([...HISTORICAL_BASE_REQUIREMENTS, 'cuda-js.publication-mailbox/0.1.0']);",
              'base public requirements');

            const sidebandHelpers = `function expectedSessionPayloadResourceId(context) {
  if (!context.sessionResult) return null;
  const plan = context.resourceResult?.normalized;
  const contributors = (plan?.contributors ?? []).filter(({ contract }) => contract?.id === 'SPEC-0006');
  if (contributors.length !== 1) fail('COMPOSE_SIDEBAND_PAYLOAD', 'selected Session requires exactly one Resource-plan Session contributor');
  const rerootClasses = new Set((plan.reserves ?? []).filter(({ purpose }) => purpose === 'reroot-admission').map(({ class: classId }) => classId));
  const candidates = (plan.classes ?? []).filter((entry) => entry.contributor === contributors[0].id && !rerootClasses.has(entry.id) && entry.lifetime === 'session');
  if (candidates.length !== 1) fail('COMPOSE_SIDEBAND_PAYLOAD', 'selected Session requires exactly one resident control class outside reroot admission');
  const partition = (plan.partitions ?? []).find(({ class: classId }) => classId === candidates[0].id);
  const pool = partition ? (plan.pools ?? []).find(({ id }) => id === partition.pool) : null;
  const provider = pool ? (plan.providerRequirements ?? []).find(({ pool: poolId }) => poolId === pool.id) : null;
  const resource = provider ? context.resources.find(({ providerRequirement }) => providerRequirement === provider.id) : null;
  if (!resource || resource.materialization !== 'resident-storage') fail('COMPOSE_SIDEBAND_PAYLOAD', 'selected Session control class has no resident package resource');
  return resource.id;
}

function normalizeSideband(input, index, context) {
  exactKeys(input, ['id', 'owner', 'role', 'direction', 'valueType', 'capacity', 'publication', 'applicationPoint', 'lifetime', 'payloadResource'], 'COMPOSE_SIDEBAND_FIELDS', \`sideband \${index}\`);
  assertNamespacedId(input.id, 'COMPOSE_SIDEBAND_ID', \`sideband \${index} id\`);
  assertNamespacedId(input.owner, 'COMPOSE_SIDEBAND_OWNER', \`\${input.id} owner\`);
  if (!context.semanticOwners.has(input.owner)) fail('COMPOSE_SIDEBAND_OWNER', \`\${input.id} names unselected owner \${input.owner}\`);
  const role = assertEnum(input.role, ['framework-cancellation', 'session-command-publication'], 'COMPOSE_SIDEBAND_ROLE', \`\${input.id} role\`);
  const direction = assertEnum(input.direction, ['host-to-device'], 'COMPOSE_SIDEBAND_DIRECTION', \`\${input.id} direction\`);
  const valueType = assertEnum(input.valueType, ['u32'], 'COMPOSE_SIDEBAND_VALUE', \`\${input.id} valueType\`);
  const capacity = positiveDecimal(input.capacity, 'COMPOSE_SIDEBAND_CAPACITY', \`\${input.id} capacity\`);
  if (capacity !== '1') fail('COMPOSE_SIDEBAND_CAPACITY', \`\${input.id} first accepted realization requires one finite signal lane\`);
  const publication = assertEnum(input.publication, ['release-acquire'], 'COMPOSE_SIDEBAND_PUBLICATION', \`\${input.id} publication\`);
  const applicationPoint = assertEnum(input.applicationPoint, ['progress-bounded-checkpoint', 'session-command-checkpoint'], 'COMPOSE_SIDEBAND_APPLICATION', \`\${input.id} applicationPoint\`);
  const lifetime = assertEnum(input.lifetime, ['execution', 'session'], 'COMPOSE_SIDEBAND_LIFETIME', \`\${input.id} lifetime\`);
  let payloadResource = null;
  if (input.payloadResource !== null) {
    assertNamespacedId(input.payloadResource, 'COMPOSE_SIDEBAND_PAYLOAD', \`\${input.id} payloadResource\`);
    const resource = context.resourceById.get(input.payloadResource);
    if (!resource || resource.materialization !== 'resident-storage'
        || !['device-search', 'device-publication'].every((space) => resource.memorySpaces.includes(space))
        || !['read', 'write', 'atomic', 'publish'].every((access) => resource.access.includes(access))) {
      fail('COMPOSE_SIDEBAND_PAYLOAD', \`\${input.id} payloadResource lacks the required resident publication envelope\`);
    }
    payloadResource = input.payloadResource;
  }
  if (role === 'framework-cancellation') {
    if (input.owner !== context.progressResult.normalized.id || applicationPoint !== 'progress-bounded-checkpoint' || lifetime !== 'execution' || payloadResource !== null) {
      fail('COMPOSE_SIDEBAND_ROLE', 'framework cancellation sideband ownership/lifetime/payload is invalid');
    }
  } else {
    const expectedPayload = expectedSessionPayloadResourceId(context);
    if (!context.sessionResult || input.owner !== context.sessionResult.normalized.id || applicationPoint !== 'session-command-checkpoint' || lifetime !== 'session' || payloadResource !== expectedPayload) {
      fail('COMPOSE_SIDEBAND_ROLE', 'Session publication sideband ownership/lifetime/payload is invalid');
    }
  }
  return { id: input.id, owner: input.owner, role, direction, valueType, capacity, publication, applicationPoint, lifetime, payloadResource };
}

`;
            text = once(text, 'function normalizeBinding(input, operationId, index, parameters, resources) {', sidebandHelpers + 'function normalizeBinding(input, operationId, index, parameters, resources, sidebands) {', 'sideband normalizer insertion');
            text = once(text,
              "    return { parameter: input.parameter, source };\n  }\n  if (Object.hasOwn(input.source ?? {}, 'access')) fail('COMPOSE_OPERATION_ACCESS', `${operationId} ${input.parameter} scalar binding cannot carry access`);",
              "    return { parameter: input.parameter, source };\n  }\n  if (input.source?.kind === 'sideband') {\n    exactKeys(input.source, ['kind', 'sideband'], 'COMPOSE_OPERATION_BINDING_FIELDS', `${operationId} ${input.parameter} sideband`);\n    const sideband = sidebands.get(input.source.sideband);\n    if (!sideband || parameter.type !== `sideband<${sideband.valueType}>`) fail('COMPOSE_OPERATION_BINDING', `${operationId} sideband binding is incompatible`);\n    return { parameter: input.parameter, source: { kind: 'sideband', sideband: input.source.sideband } };\n  }\n  if (Object.hasOwn(input.source ?? {}, 'access')) fail('COMPOSE_OPERATION_ACCESS', `${operationId} ${input.parameter} scalar binding cannot carry access`);",
              'sideband binding branch');
            text = once(text,
              "  if (input.source.kind !== 'scalar' || parameter.type.startsWith('ptr<')) fail('COMPOSE_OPERATION_BINDING', `${operationId} scalar binding is incompatible`);",
              "  if (input.source.kind !== 'scalar' || parameter.type.startsWith('ptr<') || parameter.type.startsWith('sideband<')) fail('COMPOSE_OPERATION_BINDING', `${operationId} scalar binding is incompatible`);",
              'scalar binding exclusion');
            text = once(text,
              'const bindings = input.bindings.map((binding, bindingIndex) => normalizeBinding(binding, input.id, bindingIndex, entryPoint.parameters, context.resourceById)).sort((left, right) => compareRaw(left.parameter, right.parameter));',
              'const bindings = input.bindings.map((binding, bindingIndex) => normalizeBinding(binding, input.id, bindingIndex, entryPoint.parameters, context.resourceById, context.sidebandById)).sort((left, right) => compareRaw(left.parameter, right.parameter));',
