              "function expectedRequirementKeys(context, currentSidebandRepresentation) {\n  const expected = new Map();\n  const base = currentSidebandRepresentation ? BASE_REQUIREMENTS : HISTORICAL_BASE_REQUIREMENTS;\n  for (const id of base) expected.set(id, context.requirementById.get(id));\n  const results = currentSidebandRepresentation ? (context.profileResults ?? []) : [context.stageResult, context.channelResult];\n  for (const result of results) {\n    for (const requirement of result?.normalized?.programContribution?.requirements ?? []) expected.set(requirement.id, requirement);\n  }\n  return expected;\n}",
              'generic requirement closure');
            text = once(text,
              '  const expectedRequirements = expectedRequirementKeys(context);',
