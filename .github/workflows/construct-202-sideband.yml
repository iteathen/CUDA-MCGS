              'sideband binding coverage');
            text = once(text,
              "  const normalized = { schema: input.schema, representation: input.representation, status: input.status, contract: normalizeCatalogContract(input.contract, inspected), id: input.id, version: input.version, semanticEngine, generator, sourceUnits, functions, programUnits, publicRequirements, resources, operations, manifests, provenance, compatibility, deletion };",
              "  const normalized = { schema: input.schema, representation: input.representation, status: input.status, contract: normalizeCatalogContract(input.contract, inspected), id: input.id, version: input.version, semanticEngine, generator, sourceUnits, functions, programUnits, publicRequirements, resources, ...(hasSidebands ? { sidebands } : {}), operations, manifests, provenance, compatibility, deletion };",
              'normalized sidebands');
            text = once(text,
              "    resources: profile.resources.map((entry) => ({ ...entry, memorySpaces: [...entry.memorySpaces], access: [...entry.access] })),\n    operations: profile.operations.map((entry) => ({ ...entry, bindings: structuredClone(entry.bindings), grid: [...entry.grid], block: [...entry.block],  })),",
              "    resources: profile.resources.map((entry) => ({ ...entry, memorySpaces: [...entry.memorySpaces], access: [...entry.access] })),\n    ...(Object.hasOwn(profile, 'sidebands') ? { sidebands: structuredClone(profile.sidebands) } : {}),\n    operations: profile.operations.map((entry) => ({ ...entry, bindings: structuredClone(entry.bindings), grid: [...entry.grid], block: [...entry.block],  })),",
              'Search Program sidebands');

            text = once(text,
              "  const resourceNames = new Map(resources.map((entry, index) => [entry.id, `resource-${index}`]));\n  for (const operation of program.operations) for (const binding of operation.bindings) {",
              "  const resourceNames = new Map(resources.map((entry, index) => [entry.id, `resource-${index}`]));\n  const sidebands = program.sidebands ?? [];\n  const frameworkCancellation = sidebands.find(({ role }) => role === 'framework-cancellation');\n  if (!frameworkCancellation) fail('COMPOSE_SIDEBAND_REQUIRED', 'runtime-realizable execution requires an explicit framework cancellation sideband');\n  const sidebandNames = new Map(sidebands.map((entry, index) => [entry.id, `sideband-${index}`]));\n  for (const operation of program.operations) for (const binding of operation.bindings) {",
              'adapter sideband preflight');
            text = once(text,
              "    if (binding.source.kind === 'resource' && !Object.hasOwn(binding.source, 'access')) {\n      fail('COMPOSE_OPERATION_ACCESS_REQUIRED', `${operation.id} ${binding.parameter} lacks operation-local resource access`);\n    }\n  }",
              "    if (binding.source.kind === 'resource' && !Object.hasOwn(binding.source, 'access')) {\n      fail('COMPOSE_OPERATION_ACCESS_REQUIRED', `${operation.id} ${binding.parameter} lacks operation-local resource access`);\n    }\n    if (binding.source.kind === 'sideband' && !sidebandNames.has(binding.source.sideband)) fail('COMPOSE_SIDEBAND_BINDING', `${operation.id} ${binding.parameter} names unknown sideband`);\n  }",
              'adapter sideband binding preflight');
            text = once(text,
              "    bindings: entry.bindings.map((binding) => binding.source.kind === 'resource'\n      ? { parameter: binding.parameter, source: { kind: 'resource', resource: resourceNames.get(binding.source.resource), access: binding.source.access } }\n      : { parameter: binding.parameter, source: { kind: 'scalar', schema: { ...binding.source.schema } } }),",
