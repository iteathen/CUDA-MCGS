            return text;
          });

          patch('experiments/search-ir-composer-reference/src/program-package-fixtures.mjs', (text) => {
            const helper = `function sessionPayloadResourceId(context, resources) {
  if (!context.sessionResult) return null;
  const plan = context.resourceResult.normalized;
  const contributors = (plan.contributors ?? []).filter(({ contract }) => contract?.id === 'SPEC-0006');
  if (contributors.length !== 1) throw new Error('selected Session requires exactly one Resource-plan Session contributor');
