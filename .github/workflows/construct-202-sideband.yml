  const records = input.records.map((record, index) => {
    exactKeys(record, sidebandDeletion
      ? ['owner', 'sourceUnits', 'functions', 'resources', 'sidebands', 'publicRequirements', 'packageRecords']
      : ['owner', 'sourceUnits', 'functions', 'resources', 'publicRequirements', 'packageRecords'], 'COMPOSE_DELETION_RECORD_FIELDS', \`deletion record \${index}\`);
    if (!context.semanticOwners.has(record.owner)) fail('COMPOSE_DELETION_OWNER', \`deletion record \${record.owner} is not selected\`);
    const normalized = { owner: record.owner };
    const keys = ['sourceUnits', 'functions', 'resources', ...(sidebandDeletion ? ['sidebands'] : []), 'publicRequirements', 'packageRecords'];
    for (const key of keys) {
      if (!Array.isArray(record[key])) fail('COMPOSE_DELETION_RECORD', \`\${record.owner} \${key} must be an array\`);
      normalized[key] = [...record[key]].sort(compareRaw);
      if (new Set(normalized[key]).size !== normalized[key].length) fail('COMPOSE_DELETION_RECORD', \`\${record.owner} repeats \${key}\`);
    }
    return normalized;
  }).sort((left, right) => compareRaw(left.owner, right.owner));
  uniqueBy(records, 'owner', 'COMPOSE_DELETION_OWNER', 'deletion owner');
  if (records.length !== selectedOwners.length) fail('COMPOSE_DELETION_OWNER', 'every selected owner requires one deletion record');
  const coverage = new Map([
    ['sourceUnits', context.sourceUnits.map(({ id }) => id)],
    ['functions', context.functions.map(({ name }) => name)],
    ['resources', context.resources.map(({ id }) => id)],
    ...(sidebandDeletion ? [['sidebands', context.sidebands.map(({ id }) => id)]] : []),
    ['publicRequirements', context.publicRequirements.map(({ contract }) => contract.id)],
  ]);
  for (const [key, expected] of coverage) for (const id of expected) if (!records.some((record) => record[key].includes(id))) fail('COMPOSE_DELETION_COVERAGE', \`\${key} \${id} has no deletion owner\`);
  const same = (left, right) => left.length === right.length && left.every((value, index) => value === right[index]);
  for (const record of records) {
    const expectedSourceUnits = context.sourceUnits.filter(({ semanticOwner }) => semanticOwner === record.owner).map(({ id }) => id).sort(compareRaw);
    const expectedFunctions = context.functions.filter(({ sourceUnit }) => expectedSourceUnits.includes(sourceUnit)).map(({ name }) => name).sort(compareRaw);
    const expectedResources = context.resources.filter(({ ownerProfile }) => ownerProfile === record.owner).map(({ id }) => id).sort(compareRaw);
    const expectedSidebands = sidebandDeletion ? context.sidebands.filter(({ owner }) => owner === record.owner).map(({ id }) => id).sort(compareRaw) : [];
    const expectedRequirements = context.publicRequirements.filter(({ consumers }) => consumers.includes(record.owner)).map(({ contract }) => contract.id).sort(compareRaw);
    const expectedPackageRecords = record.owner === context.compositionProfileId ? ['package.execution-operation'] : [];
    if (!same(record.sourceUnits, expectedSourceUnits) || !same(record.functions, expectedFunctions) || !same(record.resources, expectedResources)
        || (sidebandDeletion && !same(record.sidebands, expectedSidebands)) || !same(record.publicRequirements, expectedRequirements) || !same(record.packageRecords, expectedPackageRecords)) {
      fail('COMPOSE_DELETION_OWNERSHIP', \`\${record.owner} deletion record differs from authoritative ownership\`);
    }
  }
  return { selectedOwners, records, comparison: input.comparison, absence: input.absence };
}
`;
            text = text.slice(0, deletionStart) + deletion + text.slice(deletionEnd);

            text = once(text,
              "export function normalizeProgramPackageProfile(input, inspected, suppliedContext) {\n  exactKeys(input, ['schema', 'representation', 'status', 'contract', 'id', 'version', 'semanticEngine', 'generator', 'sourceUnits', 'functions', 'programUnits', 'publicRequirements', 'resources', 'operations', 'manifests', 'provenance', 'compatibility', 'deletion'], 'COMPOSE_ROOT_FIELDS', 'program/package profile');",
              "export function normalizeProgramPackageProfile(input, inspected, suppliedContext) {\n  const hasSidebands = Object.hasOwn(input, 'sidebands');\n  exactKeys(input, hasSidebands\n    ? ['schema', 'representation', 'status', 'contract', 'id', 'version', 'semanticEngine', 'generator', 'sourceUnits', 'functions', 'programUnits', 'publicRequirements', 'resources', 'sidebands', 'operations', 'manifests', 'provenance', 'compatibility', 'deletion']\n    : ['schema', 'representation', 'status', 'contract', 'id', 'version', 'semanticEngine', 'generator', 'sourceUnits', 'functions', 'programUnits', 'publicRequirements', 'resources', 'operations', 'manifests', 'provenance', 'compatibility', 'deletion'], 'COMPOSE_ROOT_FIELDS', 'program/package profile');",
              'optional sideband root');

            text = once(text,
              "  context.resourceById = new Map(resources.map((entry) => [entry.id, entry])); context.resources = resources;\n\n  const operations = input.operations.map((entry, index) => normalizeOperation(entry, index, context)).sort((left, right) => compareRaw(left.id, right.id));",
              "  context.resourceById = new Map(resources.map((entry) => [entry.id, entry])); context.resources = resources;\n\n  let sidebands = [];\n  if (hasSidebands) {\n    if (!Array.isArray(input.sidebands) || input.sidebands.length === 0) fail('COMPOSE_SIDEBAND_COUNT', 'sidebands must contain the required external-control path');\n    sidebands = input.sidebands.map((entry, index) => normalizeSideband(entry, index, context)).sort((left, right) => compareRaw(left.id, right.id));\n    uniqueBy(sidebands, 'id', 'COMPOSE_SIDEBAND_DUPLICATE', 'sideband');\n    if (sidebands.filter(({ role }) => role === 'framework-cancellation').length !== 1) fail('COMPOSE_SIDEBAND_REQUIRED', 'exactly one framework cancellation sideband is required');\n    const sessionCount = sidebands.filter(({ role }) => role === 'session-command-publication').length;\n    if (sessionCount !== (context.sessionResult ? 1 : 0)) fail('COMPOSE_SIDEBAND_REQUIRED', 'Session publication sideband selection differs from selected Session');\n    if (!context.publicRequirements.some(({ contract }) => contract.id === 'cuda-js.publication-mailbox/0.1.0')) fail('COMPOSE_SIDEBAND_CAPABILITY', 'sideband realization requires the public publication-mailbox contract');\n  }\n  context.sidebands = sidebands; context.sidebandById = new Map(sidebands.map((entry) => [entry.id, entry]));\n\n  const operations = input.operations.map((entry, index) => normalizeOperation(entry, index, context)).sort((left, right) => compareRaw(left.id, right.id));",
              'sideband normalization phase');
            text = once(text,
              "  uniqueBy(operations, 'id', 'COMPOSE_OPERATION_DUPLICATE', 'operation');\n  const kernels = functions.filter(({ executionRole }) => executionRole === 'runtime-entry');",
