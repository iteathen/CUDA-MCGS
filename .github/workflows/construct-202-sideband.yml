      - name: Write permanent #202 falsifier/conformance verifier
        shell: bash
        run: |
          cat > experiments/search-ir-composer-reference/verify-external-control-sideband-authority.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';

          import { buildProgramPackageProfile } from './src/program-package-fixtures.mjs';
          import { buildExecutionPackage, composeSearchProgram, normalizeProgramPackageProfile } from './src/program-package.mjs';

          const U128_MAX = '340282366920938463463374607431768211455';
          const digest = (character) => ({ algorithm: 'sha256', sha256: character.repeat(64) });
          const profile = (id, schema, character, normalized = {}) => ({
            normalized: { id, schema, ...normalized }, schemaSha: character.repeat(64), identity: digest(character),
          });
          const schemaReference = (id, character = '9') => ({ id: `${id}/0.1.0`, version: '0.1.0', sha256: character.repeat(64) });
          const sourceIdentity = (source) => ({ algorithm: 'sha256', sha256: createHash('sha256').update(source, 'utf8').digest('hex') });

          function makeContext(sessionResult = null) {
            const providerRequirements = [{
              id: 'provider.sideband-authority.output', unit: 'bytes', capacity: '64', alignment: '8',
              memorySpaces: ['device-search'], access: ['read', 'write'],
            }];
            const resourceNormalized = { providerRequirements, contributors: [], classes: [], reserves: [], partitions: [], pools: [] };
            if (sessionResult) {
              providerRequirements.push({
                id: 'provider.sideband-authority.session-control', pool: 'pool.sideband-authority.session-control', unit: 'bytes', capacity: '16384', alignment: '256',
                memorySpaces: ['device-search', 'device-publication'], access: ['read', 'write', 'atomic', 'publish'],
              });
              resourceNormalized.contributors.push({ id: 'owner.session.sideband-authority', contract: { id: 'SPEC-0006' }, classes: ['resource.sideband-authority.class-session-control'] });
              resourceNormalized.classes.push({
                id: 'resource.sideband-authority.class-session-control', contributor: 'owner.session.sideband-authority', lifetime: 'session',
                memorySpaces: ['device-search', 'device-publication'], access: ['read', 'write', 'atomic', 'publish'],
              });
              resourceNormalized.partitions.push({ id: 'partition.sideband-authority.session-control', class: 'resource.sideband-authority.class-session-control', pool: 'pool.sideband-authority.session-control' });
              resourceNormalized.pools.push({ id: 'pool.sideband-authority.session-control', providerRequirement: 'provider.sideband-authority.session-control' });
            }
            const resourceResult = profile('resource.sideband-authority', 'cuda-mcgs.resource-profile/0.2.0', '1', resourceNormalized);
            const progressResult = profile('progress.sideband-authority', 'cuda-mcgs.progress-profile/0.2.0', '2');
            const outputResult = profile('output.sideband-authority', 'cuda-mcgs.output-profile/0.2.0', '3');
            return {
              profileResults: [resourceResult, progressResult, outputResult, ...(sessionResult ? [sessionResult] : [])],
              resourceResult, progressResult, outputResult, sessionResult, stageResult: null, channelResult: null,
            };
          }

          const inspected = {
            contractSet: { contracts: [{ id: 'SPEC-0005', specificationIdentity: 'CUDA-MCGS-SPEC-0005@0.4.0', sha256: '4'.repeat(64) }] },
            identities: { contractSet: digest('5') },
          };
          const normalize = (built) => normalizeProgramPackageProfile(built.input, inspected, built.context);

          const baseBuilt = buildProgramPackageProfile(inspected, makeContext(), 'sideband-base');
          const base = normalize(baseBuilt);
          const baseProgram = composeSearchProgram(base);
          const baseExecution = buildExecutionPackage(base, baseProgram);
          const baseCancellation = base.normalized.sidebands.find(({ role }) => role === 'framework-cancellation');
          assert.ok(baseCancellation);
          assert.equal(baseCancellation.owner, baseBuilt.context.progressResult.normalized.id);
          assert.equal(baseCancellation.payloadResource, null);
          assert.ok(base.normalized.operations[0].bindings.some(({ source }) => source.kind === 'sideband' && source.sideband === baseCancellation.id));
          assert.ok(base.normalized.publicRequirements.some(({ contract }) => contract.id === 'cuda-js.publication-mailbox/0.1.0'));
          assert.ok(baseExecution.normalized.cudaJsAdapter.sidebandRequirements.some(({ role }) => role === 'framework-cancellation'));

          const sessionResult = profile('session.sideband-authority', 'cuda-mcgs.session-profile/0.2.0', '6', {
            counters: [{ kind: 'command', maximum: U128_MAX }],
            programContribution: {
              sourceIdentity: digest('7'), functionIds: ['program.session.sideband-authority.apply_commands'],
              requirements: [schemaReference('cuda-js.publication-mailbox', '8')], engineStepRoles: ['apply-session-controls'], nativeContent: 'forbidden',
            },
          });
          const sessionBuilt = buildProgramPackageProfile(inspected, makeContext(sessionResult), 'sideband-session');
          const session = normalize(sessionBuilt);
          const sessionSignal = session.normalized.sidebands.find(({ role }) => role === 'session-command-publication');
          assert.ok(sessionSignal);
          assert.equal(sessionSignal.owner, sessionResult.normalized.id);
          assert.ok(sessionSignal.payloadResource);
          assert.equal(sessionSignal.valueType, 'u32');
          assert.equal(sessionResult.normalized.counters.find(({ kind }) => kind === 'command').maximum, U128_MAX);
          assert.equal('commandGeneration' in sessionSignal, false);
          assert.equal('commandId' in sessionSignal, false);
          assert.ok(session.normalized.operations[0].bindings.some(({ source }) => source.kind === 'sideband' && source.sideband === sessionSignal.id));
          const mailboxRequirement = session.normalized.publicRequirements.find(({ contract }) => contract.id === 'cuda-js.publication-mailbox/0.1.0');
          assert.ok(mailboxRequirement.consumers.includes(sessionResult.normalized.id));
          const baseMailbox = base.normalized.publicRequirements.find(({ contract }) => contract.id === 'cuda-js.publication-mailbox/0.1.0');
          assert.equal(baseMailbox.consumers.includes(sessionResult.normalized.id), false);
          assert.equal(base.normalized.sidebands.some(({ role }) => role === 'session-command-publication'), false);

          const unknownBinding = structuredClone(baseBuilt.input);
          unknownBinding.operations[0].bindings.find(({ source }) => source.kind === 'sideband').source.sideband = 'sideband.unknown-control';
          assert.throws(() => normalizeProgramPackageProfile(unknownBinding, inspected, baseBuilt.context), /sideband binding is incompatible/);

          const missingSidebands = structuredClone(baseBuilt.input);
          delete missingSidebands.sidebands;
          assert.throws(() => normalizeProgramPackageProfile(missingSidebands, inspected, baseBuilt.context), /sideband binding is incompatible/);

          const missingCapability = structuredClone(baseBuilt.input);
          missingCapability.publicRequirements = missingCapability.publicRequirements.filter(({ contract }) => contract.id !== 'cuda-js.publication-mailbox/0.1.0');
          for (const record of missingCapability.deletion.records) record.publicRequirements = record.publicRequirements.filter((id) => id !== 'cuda-js.publication-mailbox/0.1.0');
          assert.throws(() => normalizeProgramPackageProfile(missingCapability, inspected, baseBuilt.context), /public requirements differ|publication-mailbox/);

          const invalidDirection = structuredClone(baseBuilt.input);
          invalidDirection.sidebands[0].direction = 'device-to-host';
          assert.throws(() => normalizeProgramPackageProfile(invalidDirection, inspected, baseBuilt.context), /direction is invalid/);

          const changedMeaning = structuredClone(baseBuilt.input);
          changedMeaning.sidebands[0].capacity = '2';
          assert.throws(() => normalizeProgramPackageProfile(changedMeaning, inspected, baseBuilt.context), /first accepted realization requires one finite signal lane/);
          const changedApplication = structuredClone(baseBuilt.input);
          changedApplication.sidebands[0].applicationPoint = 'session-command-checkpoint';
          assert.throws(() => normalizeProgramPackageProfile(changedApplication, inspected, baseBuilt.context), /framework cancellation sideband ownership/);

          const historical = structuredClone(baseBuilt.input);
          delete historical.sidebands;
          historical.publicRequirements = historical.publicRequirements.filter(({ contract }) => contract.id !== 'cuda-js.publication-mailbox/0.1.0');
          const historicalSource = 'function engine_step(output) { output[gpu.thread.globalX()] = 0; }\n';
          const entryUnit = historical.sourceUnits.find(({ functions }) => functions.includes('engine_step'));
          entryUnit.source = historicalSource;
          entryUnit.sourceIdentity = sourceIdentity(historicalSource);
          historical.functions.find(({ name }) => name === 'engine_step').parameters = [{ name: 'output', type: 'ptr<u32>' }];
          historical.operations[0].bindings = historical.operations[0].bindings.filter(({ parameter }) => parameter === 'output');
          for (const record of historical.deletion.records) {
            delete record.sidebands;
            record.publicRequirements = record.owner === historical.id
              ? historical.publicRequirements.map(({ contract }) => contract.id)
              : [];
          }
          const historicalResult = normalizeProgramPackageProfile(historical, inspected, baseBuilt.context);
          assert.equal(Object.hasOwn(historicalResult.normalized, 'sidebands'), false);
          const historicalProgram = composeSearchProgram(historicalResult);
          assert.equal(Object.hasOwn(historicalProgram.normalized, 'sidebands'), false);
          assert.throws(() => buildExecutionPackage(historicalResult, historicalProgram), /explicit framework cancellation sideband/);

          const identityBase = base.identity.sha256;
          const identityMutation = structuredClone(baseBuilt.input);
          identityMutation.sidebands[0].publication = 'release-acquire';
          identityMutation.sidebands[0].id = 'sideband.sideband-base.framework-cancellation-v2';
          identityMutation.operations[0].bindings.find(({ source }) => source.kind === 'sideband').source.sideband = identityMutation.sidebands[0].id;
          const progressDeletion = identityMutation.deletion.records.find(({ owner }) => owner === baseBuilt.context.progressResult.normalized.id);
          progressDeletion.sidebands = [identityMutation.sidebands[0].id];
          assert.notEqual(normalizeProgramPackageProfile(identityMutation, inspected, baseBuilt.context).identity.sha256, identityBase);

          console.log('external_control_sideband=pass base_cancellation=declared-and-bound session_requirement=closed session_publication=notification-not-identity historical=structural-valid-runtime-reject deletion=exact binding=fail-closed identity=sensitive');
          EOF
      - name: Qualify focused Composer/reference implementation
        shell: bash
        run: |
          node scripts/run-search-ir-composer-reference.mjs
