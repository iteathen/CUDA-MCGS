name: authorized-124-audit-oracle-tightening

on:
  push:
    branches:
      - feature/124-explicit-runtime-metadata-audit

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/124-explicit-runtime-metadata-audit
          fetch-depth: 0
      - name: Tighten oracle
        run: node .github/authorized-124-audit-oracle-tightening.cjs
      - name: Remove transport and qualify
        run: |
          git rm -f .github/authorized-124-audit-oracle-tightening.cjs .github/workflows/authorized-124-audit-oracle-tightening.yml
          node --check conformance/cuda-js-tensor-evaluator/resource-binding.mjs
          node scripts/run-cuda-js-tensor-evaluator.mjs
          node conformance/cuda-js-tensor-evaluator/package.mjs
      - name: Commit oracle cleanup
        run: |
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "Tighten Tensor resource binding audit oracle"
          git push origin HEAD:feature/124-explicit-runtime-metadata-audit
