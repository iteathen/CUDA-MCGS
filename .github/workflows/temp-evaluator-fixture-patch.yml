name: temporary evaluator fixture patch

on:
  push:
    branches:
      - fix/evaluator-required-fixture-matrix-20260829

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/evaluator-required-fixture-matrix-20260829
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Apply exact conformance correction
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'experiments/search-ir-composer-reference/run.mjs';
          const source = await readFile(path, 'utf8');
          const before = `await runCase('evaluator-profile-second-instances-distinct', () => {
            assert.equal(new Set(evaluatorProfiles.map(({ identity }) => identity.sha256)).size, evaluatorProfiles.length);
            assert.deepEqual(evaluatorProfiles.map(({ normalized }) => normalized.cache.kind), ['selected', 'none', 'none', 'none', 'none']);
            assert.deepEqual(evaluatorProfiles.map(({ normalized }) => normalized.artifacts.length), [1, 0, 1, 0, 1]);
            assert.equal(evaluatorProfiles[4].normalized.mutableState.kind, 'selected');
          });`;
          const after = `await runCase('evaluator-profile-second-instances-distinct', () => {
            assert.equal(new Set(evaluatorProfiles.map(({ identity }) => identity.sha256)).size, evaluatorProfiles.length);
            assert.deepEqual(evaluatorProfiles.map(({ normalized }) => normalized.cache.kind), ['selected', 'none', 'none', 'none', 'selected']);
            assert.deepEqual(evaluatorProfiles.map(({ normalized }) => normalized.artifacts.length), [1, 0, 1, 0, 1]);
            const resumable = evaluatorProfiles[4].normalized;
            assert.equal(resumable.mutableState.kind, 'selected');
            assert.equal(resumable.batching.continuation.kind, 'bounded');
            assert.equal(resumable.cache.kind, 'selected');
            assert(resumable.cache.keyFacts.includes('state-generation'));
          });`;
          const occurrences = source.split(before).length - 1;
          if (occurrences !== 1) throw new Error(`expected exactly one obsolete evaluator expectation, found ${occurrences}`);
          await writeFile(path, source.replace(before, after));
          NODE
          git diff --check
          git diff -- experiments/search-ir-composer-reference/run.mjs
      - name: Run canonical Composer reference
        run: node scripts/run-search-ir-composer-reference.mjs
      - name: Commit correction and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-evaluator-fixture-patch.yml
          git diff --check
          git config user.name 'iteathen'
          git config user.email 'josh.oshiro@gmail.com'
          git add experiments/search-ir-composer-reference/run.mjs
          git commit -m 'fix(evaluator): assert resumable mutable cache profile'
          git push origin HEAD:fix/evaluator-required-fixture-matrix-20260829
