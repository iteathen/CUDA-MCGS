name: policy-coverage-migration

on:
  push:
    branches: [ref/policy-reference-01]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Normalize Policy coverage to minimal source diff
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const base = 'fe11835727cd2a3a94518cd5d930dcfb3611fad8';
          const coveragePath = 'schemas/search-ir/0.2.0/requirement-coverage.json';
          const current = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
          let text = execFileSync('git', ['show', `${base}:${coveragePath}`], { encoding: 'utf8' });
          const prefixes = [
            'POLICY-RECORD-',
            'POLICY-RESERVE-',
            'POLICY-CYCLE-',
            'POLICY-BACKUP-',
            'POLICY-STOP-',
            'POLICY-REUSE-',
            'POLICY-CLEANUP-'
          ];
          for (const prefix of prefixes) {
            const desired = current.classifications.find((entry) => entry.contract === 'SPEC-0008' && entry.requirementPrefix === prefix);
            if (!desired) throw new Error(`missing desired classification ${prefix}`);
            const marker = `      "requirementPrefix": "${prefix}",`;
            const markerAt = text.indexOf(marker);
            if (markerAt < 0) throw new Error(`missing original classification ${prefix}`);
            const start = text.lastIndexOf('    {\n', markerAt);
            const endMarker = '\n    }';
            const end = text.indexOf(endMarker, markerAt);
            if (start < 0 || end < 0) throw new Error(`cannot bound classification ${prefix}`);
            let block = text.slice(start, end + endMarker.length);
            const statusPattern = /      "evidenceStatus": "(?:partial|pending|deferred)",/;
            const refsPattern = /      "evidenceRefs": \[[^\n]*\],/;
            if (!statusPattern.test(block) || !refsPattern.test(block)) throw new Error(`unexpected formatting for ${prefix}`);
            block = block.replace(statusPattern, `      "evidenceStatus": "${desired.evidenceStatus}",`);
            const refs = `[${desired.evidenceRefs.map((ref) => JSON.stringify(ref)).join(', ')}]`;
            block = block.replace(refsPattern, `      "evidenceRefs": ${refs},`);
            text = `${text.slice(0, start)}${block}${text.slice(end + endMarker.length)}`;
          }
          fs.writeFileSync(coveragePath, text);
          const regenerated = JSON.parse(text);
          for (const prefix of prefixes) {
            const desired = current.classifications.find((entry) => entry.contract === 'SPEC-0008' && entry.requirementPrefix === prefix);
            const actual = regenerated.classifications.find((entry) => entry.contract === 'SPEC-0008' && entry.requirementPrefix === prefix);
            if (actual.evidenceStatus !== desired.evidenceStatus || JSON.stringify(actual.evidenceRefs) !== JSON.stringify(desired.evidenceRefs)) {
              throw new Error(`semantic mismatch after minimal regeneration for ${prefix}`);
            }
          }
          NODE
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed"
            test "$changed" = 'schemas/search-ir/0.2.0/requirement-coverage.json'
          fi
          node scripts/run-search-ir-composer-reference.mjs
          if git diff --quiet; then
            echo 'Policy coverage already minimally formatted.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add schemas/search-ir/0.2.0/requirement-coverage.json
          git commit -m 'test: minimize Policy coverage diff'
          git push origin HEAD:ref/policy-reference-01
