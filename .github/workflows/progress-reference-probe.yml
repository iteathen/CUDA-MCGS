name: Progress reference probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  progress-reference-probe:
    name: Progress reference red/green probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run exact Composer, Progress projection, and Progress reference
        continue-on-error: true
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-progress-profiles.mjs
          node scripts/run-progress-reference.mjs
      - name: Red includes cooperative-claim falsifier
        continue-on-error: true
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; const e=JSON.parse(await readFile('experiments/search-semantics-reference/build/progress-evidence.json','utf8')); if(!e.cases.some(({id,status})=>id==='progress-ready-after-publication'&&status==='fail')) process.exit(1);"
      - name: Red includes continuation-bound falsifier
        continue-on-error: true
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; const e=JSON.parse(await readFile('experiments/search-semantics-reference/build/progress-evidence.json','utf8')); if(!e.cases.some(({id,status})=>id==='progress-pending-yields-worker'&&status==='fail')) process.exit(1);"
      - name: Red includes starvation-classification falsifier
        continue-on-error: true
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; const e=JSON.parse(await readFile('experiments/search-semantics-reference/build/progress-evidence.json','utf8')); if(!e.cases.some(({id,status})=>id==='progress-starvation-contract'&&status==='fail')) process.exit(1);"
      - name: Red includes sensitivity falsifier
        continue-on-error: true
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; const e=JSON.parse(await readFile('experiments/search-semantics-reference/build/progress-evidence.json','utf8')); if(!e.cases.some(({id,status})=>id==='progress-oracle-sensitivity'&&status==='fail')) process.exit(1);"
      - name: Red has no unexpected cases outside hypothesized set
        continue-on-error: true
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; const e=JSON.parse(await readFile('experiments/search-semantics-reference/build/progress-evidence.json','utf8')); const allowed=new Set(['progress-ready-after-publication','progress-pending-yields-worker','progress-starvation-contract','progress-oracle-sensitivity']); const unexpected=e.cases.filter(({status})=>status==='fail').map(({id})=>id).filter((id)=>!allowed.has(id)); if(unexpected.length){console.error(unexpected.join(','));process.exit(1);}" 
      - name: First-red evidence exists
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; const e=JSON.parse(await readFile('experiments/search-semantics-reference/build/progress-evidence.json','utf8')); if(e.status!=='fail') process.exit(1);"
      - name: Retain Progress probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: progress-reference-probe
          path: |
            experiments/search-ir-composer-reference/build/progress-profiles.json
            experiments/search-semantics-reference/build/progress-evidence.json
          if-no-files-found: warn
