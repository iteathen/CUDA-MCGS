name: Progress reference probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  progress-reference-probe:
    name: Progress reference red/green probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Build exact Composer and Progress projection
        run: |
          node scripts/run-search-ir-composer-reference.mjs
          node scripts/export-search-ir-composer-progress-profiles.mjs
      - name: Full Progress reference red probe
        continue-on-error: true
        run: node scripts/run-progress-reference.mjs
      - name: Focused profile strict normalization
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-profile-strict-normalization
      - name: Focused ready after publication
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-ready-after-publication
      - name: Focused pending yields worker
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-pending-yields-worker
      - name: Focused accounting conservation
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-accounting-conservation
      - name: Focused producer-unblocking fairness
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-producer-unblocking-fairness
      - name: Focused partial batch device flush
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-partial-batch-device-flush
      - name: Focused must-drain priority
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-must-drain-priority
      - name: Focused starvation contract
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-starvation-contract
      - name: Focused resource-recovery reserve
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-resource-recovery-reserve
      - name: Focused scheduler semantic parity
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-scheduler-semantic-parity
      - name: Focused mandatory wait cycle
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-mandatory-wait-cycle
      - name: Focused deadlock vs quiescence
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-deadlock-vs-quiescence
      - name: Focused livelock potential
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-livelock-potential
      - name: Focused first stop cause
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-first-stop-cause
      - name: Focused stale epoch isolation
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-stale-epoch-isolation
      - name: Focused observation no progression
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-observation-no-progression
      - name: Focused closure complete
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-closure-complete
      - name: Focused owner deletion zero residue
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-owner-deletion-zero-residue
      - name: Focused oracle sensitivity
        if: ${{ always() }}
        run: node scripts/run-progress-reference.mjs --case progress-oracle-sensitivity
      - name: Retain Progress probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: progress-reference-probe
          path: |
            experiments/search-ir-composer-reference/build/progress-profiles.json
            experiments/search-semantics-reference/build/progress-evidence*.json
          if-no-files-found: error
