  if (!pool || pool.providerRequirement !== input.id || input.unit !== pool.unit || input.capacity !== pool.capacity || input.alignment !== pool.alignment) fail('RESOURCE_PROVIDER_POOL', \`\${input.id} differs from logical pool\`);
