name: "Authorized #124 Resource materialization"

on:
  push:
    branches:
      - feature/resource-provider-materialization-124

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
