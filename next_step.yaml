  "settled_proposal_shape": {
    "stage_model": [
      "A Search Stage is one semantic operational state and validity transition for one logical search work item, not the searched domain state or a global phase/kernel/module/graph node.",
      "A coherent semantic category and owned invariant define the stage; usefulness then checks granularity and chooses among semantically valid placements.",
      "A stage may expose stable entry, stable exit, both, or neither; no extension checkpoint exists during incomplete stage mutation.",
      "A capability that requires mid-stage participation belongs in the mandatory stage lowering; a new stable operational invariant becomes a stage."
    ],
    "extension_model": [
      "All capabilities required at one stage share one Stage Extension Surface, minimum generated context, finite resource contribution, and deterministic composition order.",
      "A non-empty stage capability set contributes exactly one optional composed Stage PTX input; an empty set contributes no optional-extension PTX, call, context, state, capability-only channel/workspace, or synchronization residue.",
      "Stage PTX is an artifact/composition unit and does not prescribe a cubin, module, kernel, launch, CUDA Graph node, or scheduler topology.",
      "No runtime registry, callback table, fragment loop, schema interpreter, host resolution, late compilation, or late binding exists after ignition."
    ],
    "dataflow_model": [
      "Cross-stage and cross-surface dataflow is allowed; cross-stage and cross-surface blocking is forbidden.",
      "A producer may publish bounded work/data for a later stage using separately owned storage after committing or rolling back its current stage mutation.",
      "A required unavailable result moves the logical consumer to a declared pending state and releases the worker/resources; the scheduler runs other ready work including the producer.",
      "Every channel owns identity, generation, freshness, release/acquire scope, capacity, pressure, cancellation, expiry, deadlock outcome, reclamation, and teardown.",
      "Internal Async Stage Channels are distinct from external Search Session control/observation ports; an external reroot command is not modeled as an arbitrary internal extension callback."
    ],
    "persistent_session_model": [
      "A Search Session is a long-lived logical engine lifetime that may span many monotonically increasing root epochs under one finite memory/resource plan; long-lived does not mean unbounded memory or one mandatory kernel lifetime.",
      "An externally supplied action, observation, or replacement-root fact is environment/session input rather than a CPU-produced internal search decision. Accepting a new logical root advances the root epoch and publishes the accepted epoch/root identity.",
      "Root-relative paths, reservations, pending work, live-ranking publications and terminal-result work are associated with a root epoch. Work from an older epoch cannot publish into the current epoch unless its owning contract explicitly proves the data is root-independent and safely reusable.",
      "Reroot resolves or creates the new root through the domain identity contract, preserves reusable graph/evaluator/search state according to explicit owners, retires or invalidates obsolete root-relative work, and schedules reclamation with generation safety.",
      "Reroot must not require rebuilding the entire retained graph. Reclamation may be incremental and pressure-driven; any profile requiring a stop-the-world sweep must declare and justify that behavior explicitly.",
      "The Search Session abstraction is independent of physical scheduler topology; persistent kernels, cooperative execution, device-owned multi-kernel workflows, device graphs or later mechanisms may conform if they preserve the same session semantics."
    ],
    "live_ranking_model": [
      "Live root ranking is a first-class publication surface separate from terminal search result publication. A consumer can observe a complete ranked root-action view while the Search Session continues to make progress.",
      "Every live-ranking snapshot carries session identity, root epoch, publication generation, bounded progress/freshness metadata, a bounded entry count and policy-declared ranked action payload. A consumer must reject or ignore a snapshot whose root epoch does not match the accepted current root epoch.",
      "The policy/output contract selects best-action, top-k, complete-bounded ranking or another fixed-bounded ranking profile and declares ranking fields, ordering, cadence, staleness and validity. The universal contract does not require a full sort after every backup.",
      "A ranking publisher commits one coherent snapshot before publication; observers see an older complete snapshot or a newer complete snapshot, never a partially updated ranking. Double buffering, sequence counters, mapped publication or another mechanism are lowering/runtime choices, not universal semantics.",
      "Reading or ignoring the live ranking cannot be required for internal search progression. Terminal completion/partial-result publication remains a separate contract."
    ],
    "external_session_io_model": [
      "The CUDA-MCGS execution package exposes bounded external session ports for root-update input and live-ranking observation in addition to cancellation and terminal completion. CUDA-MCGS owns their semantic schemas and epoch/generation meaning.",
      "CUDA-JS must expose only consumer-neutral mechanisms sufficient for a long-lived device operation plus bounded sideband control/observation while device work remains active. CUDA-JS must not learn root, move, ranking or search semantics.",
      "The current CUDA-JS terminally awaited finite-completion-deadline profile is not sufficient evidence for the intended persistent-session profile. CUDA-JS issue 38 owns research/specification of the missing generic capability before Windows persistent-session acceptance.",
      "Do not assume DriverActor internal concurrency is required. Candidate mechanisms include host-visible mapped/pinned publication with system-scope synchronization, detached/long-lived operation resources with sideband commands, or another generic design selected after CUDA-JS-owned research and evidence.",
      "One-way cancellation, terminal completion, health/error ownership and teardown remain explicit and are not conflated with ordinary root updates or ranking reads."
    ],
    "scheduler_model": [
      "Device closure is invariant and physical scheduler topology is experiment-selected.",
      "Persistent queues, cooperative execution, device-owned multi-kernel workflows, CUDA Graph profiles, and future mechanisms may conform when they preserve stage/channel/session semantics.",
      "CUDA Graph conditional/device-launch restrictions prevent graphs from being assumed as the universal nested scheduler.",
      "A host relaunch or decision loop that advances internal active search is non-conforming; external root updates and ranking observation are permitted session I/O only when device-owned progress remains independent of their servicing."
    ]
  },
  "can_versus_should": {
    "can": [
      "create a stage per source block or possible hook",
      "use global barriers or one kernel per stage",
      "bind one callable PTX fragment per feature",
      "spin on readiness or nest device launches",
      "stop and relaunch around every external move or observation and rebuild root ranking on demand",
