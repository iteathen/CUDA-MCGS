  "settled_proposal_shape": {
    "universal_core_model": [
      "Universal core meaning is product-neutral and remains coherent if chess and all optional extension capabilities are deleted.",
      "Domain, policy, evaluator, generic output and resource contracts define their semantics independently of the Search Stage extension substrate.",
      "Graph/path/transposition/publication/resource/device-progress semantics remain universal MCGS contracts; no ranking formula/output is mandatory.",
      "Generic bounded output payloads plus generic result/observation publication are universal semantics; product payloads such as ranked legal moves are downstream selected schemas."
    ],
    "extension_model": [
      "A Search Stage is one semantic operational state/validity transition for one logical work item, not searched domain state or a global phase/kernel/module/graph/product phase.",
      "Stage checkpoints expose a minimal universal base context; selected capabilities may add namespaced specialization-only context/state/resources that disappear when absent.",
      "A capability declares its semantic owner and selected domain/policy/evaluator/output/session/product contract when it changes search meaning; the surface cannot redefine core invariants.",
      "All selected capabilities at one stage share one Stage Extension Surface and, in version zero, at most one optional composed Stage PTX input.",
      "Internal Async Stage Channels are bounded/nonblocking and are distinct from external Search Session control/observation ports.",
      "No runtime registry, callback table, fragment loop, schema interpreter, host resolution, late compilation or late binding exists after ignition."
    ],
    "session_model": [
      "A selected long-lived Search Session spans finite monotonically advancing root epochs under one finite resource plan without implying one kernel lifetime.",
      "Root updates validate and prove admission before root-update-specific mutation; rejected updates leave accepted search-semantic state unchanged.",
      "A valid new root under full/critical capacity has a declared reserved-admission/reclaim/reject/restart policy; surprise allocation is prohibited.",
      "Old root-relative work cannot publish new-epoch effects unless an owning contract proves the effect root-independent; reservations receive exactly one stale/completion disposition.",
      "Each persistent state family declares retain, retain-if-key-valid, transform, reset or invalidate/retire semantics across reroot.",
      "Reroot and reclamation are separate transitions; reclamation is generation-safe and may use a grace/epoch mechanism or equivalent proof.",
      "Generic live observations are bounded coherent snapshots and are read-only with respect to search-semantic state; ranking is only one possible product/output observation schema.",
      "Session/root/observation/reclamation counters are finite and fail/restart stale-safely instead of silently wrapping."
    ],
    "product_model": [
      "A product selects universal contracts and capabilities and owns its product-specific domain/policy/evaluator/output/reuse/support semantics.",
      "Chess legal-move ranking, board/history identity, evaluator meaning and chess-specific capabilities live in CHESS-0001/issue 45, not universal core fields.",
      "Chess may motivate a proposed universal improvement but cannot directly mutate universal contracts; promotion follows ADR-0018 and independent universal review.",
      "Chess acceptance/implementation does not gate universal CUDA-MCGS parent completion or release."
    ],
    "scheduler_model": [
      "Device closure is invariant and physical scheduler topology is evidence-selected.",
      "Persistent queues, cooperative execution, device-owned multi-kernel workflows, CUDA Graph profiles and future mechanisms may conform when they preserve core/stage/channel/session semantics.",
      "A host relaunch or decision loop that advances internal active search is non-conforming; bounded external session inputs/observations do not own internal progress."
    ]
  },
