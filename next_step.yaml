  "plan_revision_reason": "The bounded PTX composition prototype completed 37/37 portable and 13/13 Windows-native cases through a packaged exact CUDA-JS main revision. It proves ordered direct-symbol PTX linking, device-closed execution, fail-closed proposal-shaped validation, graceful recovery/cleanup, and exact unbound disappearance. It also falsifies two optimistic assumptions: current CUDA-JS NVRTC compilation cannot produce linkable standalone CUDA-source fragments without a public relocatable-device-code control, and separate PTX calls are not fused-equivalent for the tiny hot fixture. This revision separates the evidenced CUDA-JS feature from CUDA-MCGS semantic work, constrains rather than rejects the owner-selected PTX direction, and leaves the active CUDA-JS LTO/compiler work untouched until its exact final head can be reassessed.",
