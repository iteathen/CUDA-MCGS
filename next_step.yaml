  "plan_revision_reason": "The project owner corrected plan 15 after SESSION-001 learning: continuously ranked root moves were promoted too high and made the universal framework look like a specific decision/game search. ADR-0018 now separates mandatory universal MCGS semantics, a universal least-authority extension/composition substrate, and downstream products. Ranked chess moves move to the chess product/output layer; the universal session contract provides only generic bounded read-only observation publication. SESSION-001 also exposed proposal requirements for admission-before-mutation root updates, typed full-arena root pressure, reroot/reclamation separation, root-epoch stale-work isolation, generation-safe reclamation, observation read-only behavior and finite stale-safe counters. Plan 16 reverses plan-15 dependency mistakes: universal domain/policy/evaluator/output/resource semantics are stated independently of optional Stage mechanics, while the Search Composer later integrates selected extension resource contributions. A dedicated universal output owner prevents ranked-product payload semantics from leaking back into search policy.",
