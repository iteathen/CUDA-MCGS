  "settled_proposal_shape": {
    "stage_model": [
      "A Search Stage is one semantic operational state and validity transition for one logical search work item, not the searched domain state or a global phase/kernel/module/graph node.",
      "A coherent semantic category and owned invariant define the stage; usefulness then checks granularity and chooses among semantically valid placements.",
      "A stage may expose stable entry, stable exit, both, or neither; no extension checkpoint exists during incomplete stage mutation.",
      "A capability that requires mid-stage participation belongs in the mandatory stage lowering; a new stable operational invariant becomes a stage."
    ],
    "extension_model": [
      "All capabilities required at one stage share one Stage Extension Surface, minimum generated context, finite resource contribution, and deterministic composition order.",
      "A non-empty stage capability set contributes exactly one optional composed Stage PTX input; an empty set contributes no optional-extension PTX, call, context, state, capability-only channel/workspace, or synchronization residue.",
      "Stage PTX is an artifact/composition unit and does not prescribe a cubin, module, kernel, launch, CUDA Graph node, or scheduler topology.",
      "No runtime registry, callback table, fragment loop, schema interpreter, host resolution, late compilation, or late binding exists after ignition."
    ],
    "dataflow_model": [
      "Cross-stage and cross-surface dataflow is allowed; cross-stage and cross-surface blocking is forbidden.",
      "A producer may publish bounded work/data for a later stage using separately owned storage after committing or rolling back its current stage mutation.",
      "A required unavailable result moves the logical consumer to a declared pending state and releases the worker/resources; the scheduler runs other ready work including the producer.",
      "Every channel owns identity, generation, freshness, release/acquire scope, capacity, pressure, cancellation, expiry, deadlock outcome, reclamation, and teardown."
    ],
    "scheduler_model": [
      "Device closure is invariant and physical scheduler topology is experiment-selected.",
      "Persistent queues, cooperative execution, device-owned multi-kernel workflows, CUDA Graph profiles, and future mechanisms may conform when they preserve stage/channel semantics.",
      "CUDA Graph conditional/device-launch restrictions prevent graphs from being assumed as the universal nested scheduler.",
      "A host relaunch or decision loop that advances active search is non-conforming."
    ]
  },
  "can_versus_should": {
    "can": [
      "create a stage per source block or possible hook",
      "use global barriers or one kernel per stage",
      "bind one callable PTX fragment per feature",
      "spin on readiness or nest device launches",
      "hand-author PTX and rely on synthetic clock64 timing"
    ],
    "should": [
      "derive stages from semantic categories and owned stable invariants, then validate useful granularity",
      "schedule per-work-item stage states without implying a global barrier",
      "compose all same-stage capabilities into one optional Stage PTX input",
      "represent dependencies as bounded published readiness and pending work",
      "generate PTX from accepted contracts and validate final artifacts with representative GPU evidence"
    ]
  },
