  "plan_revision_reason": "Owner clarification establishes the intended operating model more strongly than parent plan 14: CUDA-MCGS is expected to search continuously for long periods, preserve useful graph/search knowledge across externally supplied moves or observations, reroot by advancing a logical root epoch, and keep a persistent ranked root-action view available while search continues. Parent plan 14 already named persistence/reroot/reclamation and device-owned progress, but it did not make root epochs, stale-work isolation, live ranking versus terminal result, external session I/O, or the required CUDA-JS long-lived-operation/sideband capability explicit. This revision preserves the existing stage/channel architecture and accepted SPEC-0001/SPEC-0002 authority, strengthens the downstream focus-branch contracts before implementation begins, and creates CUDA-JS issue 38 as a consumer-neutral research/specification dependency. External reroot input is environment/session data and does not authorize host-owned internal search progression. No persistent-kernel, mapped-memory, detached-operation, same-actor-concurrency, or other transport mechanism is selected by this plan revision.",
