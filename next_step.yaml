current_focus:
  repository: iteathen/CUDA-MCGS
  issue: 124
  name: generic device-resident Tensor evaluator connector
  state: active_nonphysical_framework_work
  prerequisites:
    - accepted SPEC-0009 evaluator semantics
    - protected public CUDA-JS runtime adapter
    - public CUDA-JS-Tensor TensorDeviceProgram callable/item/workspace mechanism
  tensor_public_contract:
    package: cuda-js-tensor
    required_surface:
      - TensorDeviceProgram
      - compileTensorDeviceProgram
      - itemCapacity
      - parameters
      - inputs
      - outputs
      - workspace
      - totalWorkspaceBytes
      - function tensorRunItem
      - public DeviceJsLibrary/importAs composition
      - compatibilityIdentity
    ownership_rule: >
      CUDA-MCGS may consume these public generic facts but may not redefine Tensor
      mathematics, TensorPlan semantics, item-axis independence, callable ABI or
      workspace meaning.
  implementation_outcome: >
    Add one optional connector that binds a public TensorDeviceProgram into the
    accepted evaluator lifecycle. The connector owns request incarnation and
    freshness, finite queue/batch formation, request-to-item assignment, full
    and partial batch identity, scatter/readiness, stale rejection, failure/
    pressure/cancellation mapping, retryability and cleanup. Evaluator-free and
    non-Tensor profiles remain complete alternatives.
  acceptance:
    - public package contracts only; no private/deep imports
    - no native/CUDA/PTX/FFI source in CUDA-MCGS
    - finite capacity and workspace admission before execution
    - multiple requests preserve exact item identity
    - partial batches do not fabricate occupancy or results
    - reused slots reject stale result generations
    - Tensor pressure/failure/cancellation/unavailable capability map to typed evaluator dispositions
    - failed or cancelled attempts remain retryable where semantics permit
    - resources close terminally or retain truthful orphan/restart-required disposition
    - evaluator-free deletion/substitution remains complete
    - portable conformance claims only portable semantic evidence
  stop_conditions:
    - do not introduce downstream product-specific state, protocol, model, output or correctness meaning
    - do not create a second Tensor planner/compiler/runtime
    - do not inspect or depend on Tensor private source layout
    - do not add host read-decide-write/relaunch progression for active evaluation
    - route missing generic Tensor capability to CUDA-JS-Tensor
    - route missing generic native/provider mechanism to CUDA-JS

parked_physical_evidence:
  disposition: deferred_not_waived
  resume_condition: suitable directly exposed physical NVIDIA hardware becomes available
  gates:
    - repository: iteathen/CUDA-JS
      issue: 32
      meaning: exact CUDA-MCGS/CUDA-JS physical compatible pair
    - repository: iteathen/CUDA-MCGS
      issue: 37
      meaning: first native Linux qualification and representative performance
    - repository: iteathen/CUDA-MCGS
      issue: 105
      meaning: multi-GPU replicas after exact single-device physical qualification
  rule: >
    Hosted, portable, VM, mock and package evidence may continue to prove only
    the semantics they execute. None of it closes or weakens these physical gates.

completed_external_package_evidence:
  issue: 123
  state: cuda_free_pre_ignition_slice_protected_complete_physical_remainder_deferred
  meaning: >
    One unrelated repository proved installed public package normalization,
    accepted authority/context construction, resolve/compose, fail-closed stale
    or wrong authority, retryability, private/testing export rejection and
    cleanup. The consumer repository identity is historical evidence only and
    is not a current product dependency or semantic owner.

