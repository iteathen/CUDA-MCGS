  "design_synthesis": {
    "extension_model": [
      "A selected search exposes an Extension Surface containing zero or more semantic Extension Points.",
      "Each point has an Extension Contract plus point-specific Context Schema; the contract owns meaning/permissions/invariants/order/resources/failure, while the schema owns machine-verifiable representation.",
      "An Extension Fragment declares its target point/version, required context/capabilities, permissions, resources, concurrency requirements, architecture/toolchain needs, and provenance/cache identity.",
      "The Search Composer validates and binds fragments before ignition, generates only the required context/glue/layouts, and emits the specialized execution package.",
      "A bound fragment may change activation state on-device during search; new binding/loading/host resolution during active search is non-conforming.",
      "Mandatory domain/policy/evaluator/execution semantics remain explicit contracts and are not reduced to arbitrary optional hooks."
    ],
    "performance_contract": [
      "Unbound extension points shall impose zero abstraction overhead in the realized search image.",
      "Bound extensions shall avoid generic runtime dispatch and meet an explicit realization-specific emitted-code/resource/performance envelope; direct static calls qualify as non-generic dispatch but their call, register, and code-size costs remain charged to the realization.",
      "Production evidence must inspect emitted PTX and final cubin/SASS plus representative performance/resources; source-level specialization or a successful link is not proof.",
      "The semantic extension contract remains independent of one composition technique. PTX remains the selected version-zero final device artifact; separately compiled relocatable PTX is a candidate module/stage boundary rather than a requirement for every semantic point.",
      "Unbound points disappear through Search Composer generation before PTX emission. Bound points may be lowered into fused generated core PTX or use statically named coarse device symbols according to an accepted realization classification; callback tables and runtime function-pointer registries remain excluded.",
      "The controlled discovery rejects tiny call-per-hook PTX as the default on the exact tested profile and shows that same-input PTX does not recover inlining. The candidate tiered realization must pass representative second-instance, deletion, emitted-code, occupancy, GPU-timing, and multi-profile gates before acceptance."
    ],
    "device_closure": [
      "All data/code/state required for active search is resident or preloaded before ignition.",
      "The host may configure, validate, compose, compile/link, allocate, upload, launch, request cancellation one-way, and consume completion.",
      "The host may not supply intermediate decisions, resolve extensions, or coordinate required search phases after ignition.",
      "GPU residency is a semantic execution contract, not a commitment to a single persistent kernel."
    ],
