hard_constraints:
  - one semantic/resource/lifecycle/compatibility fact has one visible owner
  - maintained CUDA-MCGS source is JavaScript/TypeScript plus restricted Device-JS only
  - no Python
  - no private sibling imports
  - no product semantics upstream
  - no host-produced active-search intermediate after ignition
  - no portable/package evidence promoted to native/provider/hardware support
  - protected integration requires exact-head qualification, complete review, exact base/tree validation and protected read-back
