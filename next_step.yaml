schema_version: 119
updated: 2026-09-06
status: generic_tensor_evaluator_connector_active_physical_deferred
objective: >
  Continue CUDA-MCGS as a product-neutral JavaScript/TypeScript framework. Build
  and qualify the optional generic device-resident Tensor evaluator connector
  through public CUDA-JS-Tensor contracts while deferring directly exposed
  physical NVIDIA qualification. Physical evidence remains open/resumable and
  is never inferred from portable/package evidence.

ownership_boundary: >
  CUDA-MCGS owns universal Search IR/Graph/Policy/Evaluator/Resource/Progress/
  Output/Session/Stage/Channel semantics and generic search composition/runtime
  boundaries. CUDA-JS-Tensor owns Tensor mathematics, TensorProgram/TensorPlan,
  item-axis semantics, callable ABI and Tensor workspace. CUDA-JS owns all
  consumer-neutral native CUDA/provider/compiler/runtime/resource mechanisms.
  Product semantics remain downstream and are not execution dependencies.

