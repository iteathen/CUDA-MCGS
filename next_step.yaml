  "plan_revision_reason": "The extended PTX composition prototype completed 42/42 portable and 25/25 Windows-native cases through a packaged exact CUDA-JS main revision. The controlled one-to-eight-operation matrix confirms that same-module PTX functions are not automatically inlined, fine call-per-hook composition scales calls and code size with fragment count, and one coarse PTX boundary can amortize close to inline cost only after enough intrinsic work. This preserves PTX as the selected final device artifact and a candidate coarse-module boundary while rejecting tiny separately callable hot hooks as the default. A tiered realization—fusible CUDA-MCGS-owned lowering for hot micro-policies and relocatable PTX calls for measured coarse modules/stages—is now a specification candidate requiring representative evidence. No new CUDA-JS feature is inferred beyond the already evidenced relocatable-device-code control, and active CUDA-JS LTO/compiler work remains untouched.",
