      "treat external action/observation/reroot as bounded session input rather than host-owned internal search progression",
      "publish coherent bounded root-ranking snapshots independently from terminal results at a policy-defined cadence",
      "compose all same-stage capabilities into one optional Stage PTX input",
      "represent internal dependencies as bounded published readiness and pending work",
      "generate PTX from accepted contracts and validate final artifacts with representative GPU evidence"
    ]
  },
